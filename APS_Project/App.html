<script>
/**
 * ============================================================================
 * SANDVIORA AVIOSOLUTION - Master Application Orchestrator & State Controller
 * ============================================================================
 * File: App.html
 * Architectural Role: Client-Side Single Page Application (SPA) Controller
 * 
 * Description:
 * Manages the top-level lifecycle, module navigation, view routing, sidebar state,
 * background prefetching, and global UI toast notifications.
 * 
 * Navigation Hierarchy:
 * - Module Level: Top Navbar (ORG, HRM, TQC)
 * - Submenu Level: Collapsible Left Sidebar (Dashboard, Input Records, View Forms, etc.)
 * - Sub-view Level: Embedded in-page tabs and spreadsheets
 * ============================================================================
 */

var app = window.app = {
  
  /**
   * Navigation registry defining available views and icons per top-level module.
   */
  modules: {
    'HRM': [
      { id: 'hrm_dashboard', label: 'Dashboard', icon: 'dashboard' },
      { id: 'hrm_input', label: 'Input Records', icon: 'edit_document' },
      { id: 'hrm_view', label: 'View Forms', icon: 'list_alt' },
      { id: 'hrm_employees', label: 'Employees List', icon: 'groups' },
      { id: 'hrm_service', label: 'Service History', icon: 'history' },
      { id: 'hrm_promotion', label: 'Promotion', icon: 'trending_up' },
      { id: 'hrm_workforce', label: 'Workforces', icon: 'groups_2' },
      { id: 'hrm_allowance', label: 'Allowance Calculation', icon: 'calculate' },
      { id: 'hrm_reports', label: 'Report', icon: 'assessment' }
    ],
    'ORG': [
      { id: 'org_dashboard', label: 'Dashboard', icon: 'dashboard' },
      { id: 'org_input', label: 'Input Records', icon: 'edit_document' },
      { id: 'org_view', label: 'View Forms', icon: 'table_view' }
    ],
    'TQC': [
      { id: 'tqc_dashboard', label: 'Dashboard', icon: 'dashboard' },
      { id: 'tqc_input', label: 'Input Records', icon: 'post_add' },
      { id: 'tqc_view', label: 'View Forms', icon: 'list_alt' }
    ]
  },

  /**
   * Currently active top module ('ORG', 'HRM', or 'TQC').
   */
  currentModule: null,

  /**
   * Currently active view identifier (e.g. 'hrm_employees', 'org_input').
   */
  currentView: null,

  /**
   * Initializes the application.
   * Kicks off background prefetching of master dropdown references and employee models.
   * Loads the default module ('ORG').
   */
  init: function() {
    // Non-blocking background prefetch for 0ms transitions
    api.getMasterData().catch(function() {});
    api.getHrmDetails().catch(function() {});

    // Default to first module (ORG)
    this.loadSidebar('ORG');
  },

  /**
   * Switches the active top-level module and dynamically populates the sidebar menu.
   * 
   * @param {string} moduleKey - Target module ('ORG', 'HRM', or 'TQC').
   */
  loadSidebar: function(moduleKey) {
    this.currentModule = moduleKey;

    var titleEl = document.getElementById('sidebar-title');
    if (titleEl) {
      titleEl.innerText = moduleKey + ' Submenus';
    }

    var iconEl = document.getElementById('sidebar-title-icon');
    if (iconEl) {
      var iconMap = { 'ORG': 'corporate_fare', 'HRM': 'people', 'TQC': 'school' };
      iconEl.innerText = iconMap[moduleKey] || 'menu';
    }

    // Update top nav button active state
    document.querySelectorAll('.top-nav-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.module === moduleKey);
    });

    var navEl = document.getElementById('sidebar-nav');
    if (!navEl) return;

    var items = this.modules[moduleKey] || [];
    var html = '';
    items.forEach(function(item) {
      html += `
        <button type="button" class="sidebar-nav-link" data-view="${item.id}" onclick="app.loadView('${item.id}')">
          <span class="material-icons">${item.icon}</span>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.label}</span>
        </button>
      `;
    });
    navEl.innerHTML = html;

    // Automatically load the first submenu of the selected module
    if (items.length > 0) {
      this.loadView(items[0].id);
    }
  },

  /**
   * Loads and renders a specific sub-view within the active module.
   * Coordinates module mount visibility and invokes domain view controllers.
   * 
   * @param {string} viewId - View identifier (e.g. 'hrm_employees', 'org_input').
   */
  loadView: function(viewId) {
    this.currentView = viewId;

    // Highlight active sidebar item
    document.querySelectorAll('.sidebar-nav-link').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.view === viewId);
    });

    // Close mobile drawer if open
    this.closeSidebarOnMobile();

    // Module container DOM elements
    var hrmRoot = document.getElementById('hrm-module-root');
    var orgRoot = document.getElementById('org-module-root');
    var tqcRoot = document.getElementById('tqc-module-root');

    try {
      if (viewId.startsWith('hrm_')) {
        if (hrmRoot) hrmRoot.style.display = 'flex';
        if (orgRoot) orgRoot.style.display = 'none';
        if (tqcRoot) tqcRoot.style.display = 'none';

        if (typeof hrmViews !== 'undefined') {
          if (viewId === 'hrm_dashboard') hrmViews.renderDashboard();
          else if (viewId === 'hrm_input') hrmViews.renderInputRecords();
          else if (viewId === 'hrm_view') hrmViews.renderViewForms();
          else if (viewId === 'hrm_employees') hrmViews.renderEmployeesList();
          else if (viewId === 'hrm_service') hrmViews.renderServiceHistory();
          else if (viewId === 'hrm_promotion') hrmViews.renderPromotionModule();
          else if (viewId === 'hrm_workforce') hrmViews.renderWorkforcesModule();
          else if (viewId === 'hrm_allowance') hrmViews.renderAllowanceModule();
          else if (viewId === 'hrm_reports') hrmViews.renderReportsHub();
        }
      } else if (viewId.startsWith('org_')) {
        if (hrmRoot) hrmRoot.style.display = 'none';
        if (orgRoot) orgRoot.style.display = 'flex';
        if (tqcRoot) tqcRoot.style.display = 'none';

        if (typeof orgViews !== 'undefined') {
          if (viewId === 'org_dashboard') orgViews.renderDashboard();
          else if (viewId === 'org_input') orgViews.renderInputRecords();
          else if (viewId === 'org_view') orgViews.renderViewForms();
        }
      } else if (viewId.startsWith('tqc_')) {
        if (hrmRoot) hrmRoot.style.display = 'none';
        if (orgRoot) orgRoot.style.display = 'none';
        if (tqcRoot) tqcRoot.style.display = 'flex';

        if (typeof tqcViews !== 'undefined') {
          if (viewId === 'tqc_dashboard') tqcViews.renderDashboard();
          else if (viewId === 'tqc_input') tqcViews.renderInputRecords();
          else if (viewId === 'tqc_view') tqcViews.renderViewForms();
        }
      }
    } catch (e) {
      console.error('Error rendering view ' + viewId + ':', e);
    }
  },

  /**
   * Toggles the collapsible sidebar drawer on mobile viewports.
   */
  toggleSidebar: function() {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    if (!sidebar) return;
    sidebar.classList.toggle('open');
    if (overlay) overlay.classList.toggle('hidden');
  },

  /**
   * Automatically closes the mobile sidebar drawer upon item selection.
   */
  closeSidebarOnMobile: function() {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    if (sidebar && window.innerWidth < 640) {
      sidebar.classList.remove('open');
    }
    if (overlay) overlay.classList.add('hidden');
  },

  /**
   * Displays a temporary notification toast at the top-right of the screen.
   * 
   * @param {string} message - Text notification to display.
   * @param {string} [type='success'] - 'success' or 'error'.
   */
  toast: function(message, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;

    var toast = document.createElement('div');
    var isError = type === 'error';
    var icon = isError ? 'error' : 'check_circle';

    toast.className = 'app-toast ' + (isError ? 'error' : 'success');
    toast.innerHTML = `
      <span class="material-icons">${icon}</span>
      <span class="toast-message">${message}</span>
    `;

    container.appendChild(toast);
    setTimeout(function() {
      toast.remove();
    }, 4000);
  }
};

// Bootstrap application on DOM ready
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() {
    app.init();
  });
} else {
  app.init();
}
</script>
