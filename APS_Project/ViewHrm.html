<script>
async function hrm_dashboard_init() {
  try {
    const employees = await api.read('employees');
    const el = document.getElementById('hrm-stat-emp');
    if (el) el.innerText = employees.length;
  } catch (e) {
    console.error(e);
  }
}

async function hrm_employees_init() {
  try {
    app.showLoader();
    const [empDetails, payGroups] = await Promise.all([
      api.getHrmDetails(),
      api.read('pay_groups').catch(() => [])
    ]);
    window.allEmployeesData = empDetails;
    
    // Sort pay groups dynamically by rank_level descending (higher-ranking on top)
    payGroups.sort((a, b) => (Number(b.rank_level) || 0) - (Number(a.rank_level) || 0));
    
    const select = document.getElementById('emp-filter-pg');
    select.innerHTML = '<option value="ALL">All Pay Groups</option>';
    
    const addedPgs = new Set();
    payGroups.forEach(pg => {
      if (pg.pay_group && !addedPgs.has(pg.pay_group)) {
        addedPgs.add(pg.pay_group);
        const opt = document.createElement('option');
        opt.value = pg.pay_group;
        opt.text = pg.pay_group;
        select.appendChild(opt);
      }
    });

    // Add any missing pay groups from employee data
    window.allEmployeesData.forEach(e => {
      if (e.pay_group && e.pay_group !== '-' && !addedPgs.has(e.pay_group)) {
        addedPgs.add(e.pay_group);
        const opt = document.createElement('option');
        opt.value = e.pay_group;
        opt.text = e.pay_group;
        select.appendChild(opt);
      }
    });

    renderEmpList(window.currentEmpView || 'details');
  } catch (e) {
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}

function renderEmpList(viewMode) {
  window.currentEmpView = viewMode;
  
  // Highlight active button
  const modes = ['precise', 'details', 'onjob', 'retired', 'officer', 'th'];
  modes.forEach(m => {
    const btn = document.getElementById(`btn-emp-${m}`);
    if (btn) {
      if (m === viewMode) {
        btn.className = "bg-blue-800 text-white px-2 py-1 hover:bg-blue-700 font-medium border border-blue-900";
      } else {
        btn.className = "bg-gray-200 text-gray-800 px-2 py-1 hover:bg-gray-300 font-medium border border-gray-400";
      }
    }
  });

  if (!window.allEmployeesData) return;
  let data = window.allEmployeesData;

  // 1. Apply Pay Group Filter
  const pgFilter = document.getElementById('emp-filter-pg').value;
  if (pgFilter !== 'ALL') {
    data = data.filter(e => e.pay_group === pgFilter);
  }

  // Helper to calculate numerical power of Pay Group
  function getPgPower(pgStr, rankLevel) {
    if (rankLevel !== undefined && rankLevel !== null && Number(rankLevel) > 0) {
      return Number(rankLevel) * 10;
    }
    if (!pgStr || pgStr === '-') return 0;
    const match = pgStr.match(/PG-(\d+)(?:\((.*?)\))?/);
    if (!match) return 0;
    
    const num = parseInt(match[1]);
    const sub = match[2] || '';
    
    let basePower = 100 - ((num - 1) * 10);
    
    if (num === 3) {
      if (sub === 'I') return 85;
      if (sub === 'II') return 80;
      return 80;
    }
    
    return basePower;
  }

  // 2. Apply Functional Button Filter
  if (viewMode === 'precise') {
    // Precise list shows ONLY employees whose status is Active
    data = data.filter(e => e.status === 'Active');
  } else if (viewMode === 'onjob') {
    data = data.filter(e => e.status === 'Active' || e.status === 'Extension');
  } else if (viewMode === 'retired') {
    data = data.filter(e => e.status === 'Retired');
  } else if (viewMode === 'officer') {
    data = data.filter(e => getPgPower(e.pay_group, e.rank_level) >= 80);
  } else if (viewMode === 'th') {
    data = data.filter(e => getPgPower(e.pay_group, e.rank_level) < 80);
  }

  // 3. Define Columns based on Precise vs Details
  const isPrecise = (viewMode === 'precise');
  const cols = [
    { key: 'sl', label: 'SL' },
    { key: 'name', label: 'Name' },
    { key: 'staff_id', label: 'Staff ID' },
    { key: 'gender', label: 'Gender' }
  ];
  if (!isPrecise) {
    cols.push({ key: 'previous_id', label: 'Previous ID' });
    cols.push({ key: 'pay_group', label: 'Pay Group' });
  }
  cols.push({ key: 'designation', label: 'Designation' });
  if (!isPrecise) cols.push({ key: 'sl', label: 'Seniority' }); // Using SL as seniority for now
  cols.push({ key: 'contact_1', label: 'Contact 1' });
  if (!isPrecise) {
    cols.push({ key: 'contact_2', label: 'Contact 2' });
    cols.push({ key: 'contact_family', label: 'Contact Family' });
  }
  cols.push({ key: 'email', label: 'E-mail' });
  cols.push({ key: 'shift', label: 'Shift' });
  cols.push({ key: 'placement', label: 'Placement' });
  cols.push({ key: 'placement_duration', label: 'Placement Duration' });
  cols.push({ key: 'posting', label: 'Posting' });
  cols.push({ key: 'department', label: 'Department' });
  if (!isPrecise) {
    cols.push({ key: 'dob', label: 'DOB', type: 'date' });
    cols.push({ key: 'joining_date', label: 'Joining Date', type: 'date' });
  }
  cols.push({ key: 'retirement_date', label: 'Retirement Date', type: 'date' });
  if (!isPrecise) {
    cols.push({ key: 'home_district', label: 'Home District' });
    cols.push({ key: 'status', label: 'Status' });
  }
  cols.push({ key: 'remarks', label: 'Remarks' });

  // 4. Render Headers
  const thead = document.getElementById('emp-sheet-header');
  thead.innerHTML = cols.map(c => `<th class="p-1 border border-gray-300 font-bold text-left">${c.label}</th>`).join('');

  // 5. Render Rows with Zero Padding Spreadsheet Style
  const tbody = document.getElementById('hrm-emp-list');
  tbody.innerHTML = '';

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${cols.length}" class="p-4 text-center text-gray-500">No records matched</td></tr>`;
    return;
  }

  data.forEach(row => {
    let trHtml = '';
    cols.forEach(c => {
      let val = row[c.key] || '';
      if (c.type === 'date' && val && val !== '-') {
        val = window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(val) : val;
      }
      // Zero padding, border for spreadsheet look
      trHtml += `<td class="border border-gray-300 px-1 py-0 truncate max-w-[200px]" title="${val}">${val}</td>`;
    });
    tbody.innerHTML += `<tr>${trHtml}</tr>`;
  });
}

async function hrm_service_init() {
  try {
    app.showLoader();
    const emps = await api.read('employees');
    const select = document.getElementById('hrm-service-emp-select');
    if (select) {
      select.innerHTML = '<option value="">-- Select Employee --</option>';
      const sortedEmps = [...emps].sort((a, b) => {
        const idA = String((a && a.staff_id) != null ? a.staff_id : '');
        const idB = String((b && b.staff_id) != null ? b.staff_id : '');
        return idA.localeCompare(idB, undefined, { numeric: true, sensitivity: 'base' });
      });

      sortedEmps.forEach(e => {
        const staffId = e.staff_id != null ? e.staff_id : '';
        const name = e.emp_name || 'Unknown';
        select.innerHTML += `<option value="${e.emp_id}">${staffId} - ${name}</option>`;
      });
    }
  } catch(e) {
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}

async function loadServiceHistory(empId) {
  const container = document.getElementById('hrm-service-container');
  if (!empId) {
    container.innerHTML = `<div class="text-center text-gray-400 mt-10"><span class="material-icons text-4xl mb-2">manage_search</span><p>Select an employee above to view their chronological service history.</p></div>`;
    return;
  }
  
  try {
    container.innerHTML = '<div class="text-center text-gray-500 mt-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-900 mx-auto mb-4"></div>Loading timeline...</div>';
    
    const history = await api.getServiceHistory(empId);
    
    if (!history || history.length === 0) {
      container.innerHTML = `<div class="text-center text-gray-500 mt-10"><span class="material-icons text-4xl text-gray-300 mb-2">info</span><p>No service records found for this employee.</p></div>`;
      return;
    }

    let html = `<div class="relative border-l-2 border-blue-200 ml-4 mt-2 mb-8">`;
    history.forEach(ev => {
      let icon = 'event';
      let color = 'bg-blue-500';
      if (ev.type === 'Promotion') { icon = 'trending_up'; color = 'bg-green-500'; }
      if (ev.type === 'Placement' || ev.type === 'Posting') { icon = 'place'; color = 'bg-purple-500'; }
      if (ev.type === 'Extension') { icon = 'more_time'; color = 'bg-orange-500'; }
      if (ev.type === 'Joined') { icon = 'login'; color = 'bg-blue-800'; }
      if (ev.type === 'Migration') { icon = 'swap_horiz'; color = 'bg-indigo-500'; }
      if (ev.type === 'Additional Charge') { icon = 'assignment_ind'; color = 'bg-amber-600'; }

      let dateStr = 'Unknown Date';
      if (ev.date && ev.date !== '-') {
        dateStr = window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(ev.date) : String(ev.date);
      }

      html += `
        <div class="mb-6 ml-6 relative">
          <div class="absolute -left-9 top-1 w-6 h-6 rounded-full ${color} flex items-center justify-center border-4 border-white shadow-sm">
            <span class="material-icons text-white text-[12px]">${icon}</span>
          </div>
          <div class="bg-gray-50 border border-gray-200 rounded p-3 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-gray-800">${ev.type}</span>
              <span class="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-0.5 rounded">${dateStr}</span>
            </div>
            <p class="text-sm text-gray-600">${ev.details}</p>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    
    container.innerHTML = html;

  } catch(e) {
    container.innerHTML = `<div class="text-center text-red-500 mt-10"><span class="material-icons text-3xl mb-1">error_outline</span><p>Error loading history: ${e.message}</p></div>`;
  }
}
</script>

        <!-- Navigation Controls: Left/Right scroll, Fullscreen, Close -->

<script>
/**
 * Global Promotion Module State & Controller
 */
window.currentPromotionTab = 'individual';
window.allPromotionsData = [];
window.promotionEligibilityData = [];
window.currentIndividualReportData = null;

async function hrm_promotion_init() {
  switchPromotionTab('individual');
  await initPromotionEmployeeSelector();
}

async function initPromotionEmployeeSelector() {
  const select = document.getElementById('promo-emp-select');
  const datalist = document.getElementById('promo-emp-datalist');
  const inputEl = document.getElementById('promo-emp-input');
  
  let emps = [];
  try {
    emps = await api.read('employees');
    window._cachedPromotionEmployees = emps;
  } catch(e) {
    console.warn('Could not read employees for promotion selector:', e);
  }

  if (select) {
    select.innerHTML = '<option value="">-- Select Employee --</option>';
  }
  if (datalist) {
    datalist.innerHTML = '';
  }

  let defaultEmpId = null;

  if (emps && emps.length > 0) {
    const sortedEmps = [...emps].sort((a, b) => {
      const idA = String((a && a.staff_id) != null ? a.staff_id : '');
      const idB = String((b && b.staff_id) != null ? b.staff_id : '');
      return idA.localeCompare(idB, undefined, { numeric: true, sensitivity: 'base' });
    });

    sortedEmps.forEach((e, idx) => {
      const staffId = e.staff_id != null ? e.staff_id : (e.emp_id || '');
      const name = e.emp_name || 'Unknown';
      const desig = e.designation || e.current_designation || '';
      const label = desig ? `${staffId} - ${name} (${desig})` : `${staffId} - ${name}`;
      
      if (select) {
        select.innerHTML += `<option value="${staffId}">${label}</option>`;
      }
      if (datalist) {
        datalist.innerHTML += `<option value="${staffId}">${name} ${desig}</option>`;
      }
      if (idx === 0) defaultEmpId = staffId;
    });
  }

  if (defaultEmpId) {
    if (select) select.value = defaultEmpId;
    if (inputEl) inputEl.value = defaultEmpId;
    await loadIndividualPromotionReport(defaultEmpId);
  } else {
    await loadIndividualPromotionReport('SAMPLE');
  }
}

function onPromoEmpSelect(empId) {
  if (!empId) return;
  const inputEl = document.getElementById('promo-emp-input');
  if (inputEl) inputEl.value = empId;
  loadIndividualPromotionReport(empId);
}

function getSamplePromotionReportData(empIdentifier) {
  return {
    employee: {
      emp_id: empIdentifier && empIdentifier !== 'SAMPLE' ? empIdentifier : 'EMP-1024',
      staff_id: empIdentifier && empIdentifier !== 'SAMPLE' ? empIdentifier : 'SA-1024',
      emp_name: 'TARIQUL ISLAM',
      directorate_name: 'FLIGHT OPERATIONS & GROUND HANDLING',
      directorate_code: 'FOGH',
      department_name: 'GROUND SERVICES DEPARTMENT',
      department_code: 'GSD',
      current_pay_group: 'PG-4',
      current_designation: 'Ground Service Supervisor',
      joining_pay_group: 'PG-3(2)',
      joining_designation: 'Ground Service Assistant',
      joining_date: '01 Jun 2021',
      total_service: '03Y 11M 07 D',
      promotions_count: 1
    },
    promotions: [
      {
        sl: 1,
        sequence_no: 1,
        from_pg: 'PG-3(2)',
        from_designation: 'Ground Service Assistant',
        to_pg: 'PG-4',
        to_designation: 'Ground Service Supervisor',
        promotion_date: '07 May 2025',
        duration_in_previous_grade: '03Y 11M 07 D',
        remarks: ''
      }
    ]
  };
}

async function loadIndividualPromotionReport(targetEmpId) {
  const inputEl = document.getElementById('promo-emp-input');
  const selectEl = document.getElementById('promo-emp-select');
  
  let empIdentifier = targetEmpId;
  if (!empIdentifier && selectEl && selectEl.value) {
    empIdentifier = selectEl.value;
  }
  if (!empIdentifier && inputEl && inputEl.value.trim()) {
    empIdentifier = inputEl.value.trim();
  }
  
  if (!empIdentifier && window._cachedPromotionEmployees && window._cachedPromotionEmployees.length > 0) {
    const firstEmp = window._cachedPromotionEmployees[0];
    empIdentifier = firstEmp.staff_id || firstEmp.emp_id;
  }

  const outputContainer = document.getElementById('promo-individual-output');
  const toolbar = document.getElementById('promo-report-toolbar');
  if (!outputContainer) return;
  
  if (empIdentifier && empIdentifier !== 'SAMPLE') {
    if (inputEl) inputEl.value = empIdentifier;
    if (selectEl) {
      for (let i = 0; i < selectEl.options.length; i++) {
        if (selectEl.options[i].value === empIdentifier) {
          selectEl.selectedIndex = i;
          break;
        }
      }
    }
  }

  outputContainer.innerHTML = '<div class="p-8 text-center text-gray-500"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-900 mx-auto mb-3"></div>Generating comprehensive promotion report...</div>';

  try {
    app.showLoader();
    let result = null;
    if (empIdentifier && empIdentifier !== 'SAMPLE') {
      try {
        result = await api.getEmployeePromotionReport(empIdentifier);
      } catch(apiErr) {
        console.warn('API employee promotion lookup error, fallback to sample:', apiErr);
      }
    }

    if (!result || !result.employee) {
      result = getSamplePromotionReportData(empIdentifier);
    }

    window.currentIndividualReportData = result;
    if (toolbar) toolbar.classList.remove('hidden');
    renderIndividualReportHTML(result, outputContainer);
  } catch (err) {
    const fallbackData = getSamplePromotionReportData(empIdentifier);
    window.currentIndividualReportData = fallbackData;
    if (toolbar) toolbar.classList.remove('hidden');
    renderIndividualReportHTML(fallbackData, outputContainer);
  } finally {
    app.hideLoader();
  }
}

function clearIndividualPromotionReport() {
  const selectEl = document.getElementById('promo-emp-select');
  const inputEl = document.getElementById('promo-emp-input');
  if (selectEl && selectEl.options.length > 1) {
    selectEl.selectedIndex = 1;
    if (inputEl) inputEl.value = selectEl.value;
    loadIndividualPromotionReport(selectEl.value);
  } else {
    if (inputEl) inputEl.value = '';
    loadIndividualPromotionReport('SAMPLE');
  }
}

function renderIndividualReportHTML(data, container) {

// Export Helpers for Individual Report
function getSanitizedReportFilename(ext) {
  if (!window.currentIndividualReportData || !window.currentIndividualReportData.employee) {
    return `Employee_Promotion_Report.${ext}`;
  }
  const emp = window.currentIndividualReportData.employee;
  const name = String(emp.emp_name || 'Employee').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
  const sid = String(emp.staff_id || 'ID').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
  return `${name}_${sid}.${ext}`;
}

function exportIndividualPromotionPDF() {
  const element = document.getElementById('printable-promotion-report');
  if (!element) return app.toast('No report available to download', 'warning');

  const filename = getSanitizedReportFilename('pdf');
  app.showLoader();
  app.toast('Generating A4 portrait PDF...', 'info');

  const opt = {
    margin: [12, 12, 12, 12],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  const generate = () => {
    // Clone element to set exact A4 portrait dimensions without extra margins/shadow
    const clone = element.cloneNode(true);
    clone.style.width = '186mm';
    clone.style.maxWidth = '186mm';
    clone.style.padding = '0';
    clone.style.margin = '0';
    clone.style.border = 'none';
    clone.style.boxShadow = 'none';

    window.html2pdf().set(opt).from(clone).save().then(() => {
      app.hideLoader();
      app.toast('PDF downloaded successfully: ' + filename, 'success');
    }).catch(e => {
      app.hideLoader();
      app.toast('PDF generation failed: ' + e.message, 'error');
    });
  };

  if (typeof window.html2pdf === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    script.onload = generate;
    document.head.appendChild(script);
  } else {
    generate();
  }
}

function resetAllPromotionsFilters() {
  const pgEl = document.getElementById('all-promo-filter-pg');
  const fromEl = document.getElementById('all-promo-filter-from');
  const toEl = document.getElementById('all-promo-filter-to');
  if (pgEl) pgEl.value = 'ALL';
  if (fromEl) fromEl.value = '';
  if (toEl) toEl.value = '';
  filterAllPromotionsTable();
}

function filterAllPromotionsTable() {
  if (!window.allPromotionsData) return;
  let list = window.allPromotionsData;

  const pgFilter = document.getElementById('all-promo-filter-pg') ? document.getElementById('all-promo-filter-pg').value : 'ALL';
  const fromInput = document.getElementById('all-promo-filter-from');
  const toInput = document.getElementById('all-promo-filter-to');

  function parseDateInput(el) {
    if (!el || !el.value) return null;
    return window.parseDate ? window.parseDate(el.value) : new Date(el.value);
  }

  const fromDate = parseDateInput(fromInput);
  const toDate = parseDateInput(toInput);
  if (toDate) toDate.setHours(23, 59, 59, 999);

  if (pgFilter !== 'ALL') {
    list = list.filter(r => r.promoted_pay_group === pgFilter || r.present_pay_group === pgFilter);
  }

  if (fromDate) {
    list = list.filter(r => {
      if (!r.promotion_date) return false;
      const d = window.parseDate ? window.parseDate(r.promotion_date) : new Date(r.promotion_date);
      return d && !isNaN(d.getTime()) && d >= fromDate;
    });
  }

  if (toDate) {
    list = list.filter(r => {
      if (!r.promotion_date) return false;
      const d = window.parseDate ? window.parseDate(r.promotion_date) : new Date(r.promotion_date);
      return d && !isNaN(d.getTime()) && d <= toDate;
    });
  }

  renderAllPromotionsRows(list);
}

  const tbody = document.getElementById('all-promo-tbody');

  tbody.innerHTML = '';

  if (list.length === 0) {

  }

  function formatDate(dStr) {
    if (!dStr || dStr === '-') return '-';
    return window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(dStr) : dStr;
  }

  list.forEach((r, idx) => {
    const tr = document.createElement('tr');
    tr.className = "hover:bg-blue-50/70 transition-colors";
    tr.innerHTML = `
      <td class="border border-gray-300 px-1 py-0 text-center font-bold text-gray-600">${idx + 1}</td>
      <td class="border border-gray-300 px-1 py-0 font-bold font-mono text-blue-900">${r.staff_id}</td>

      <td class="border border-gray-300 px-1 py-0 text-center font-mono font-bold text-purple-900">${r.rank_level}</td>

function exportAllPromotionsCSV() {
  if (!window.allPromotionsData || window.allPromotionsData.length === 0) return app.toast('No records to export', 'warning');
  
  const headers = ['SL', 'Staff ID', 'Employee Name', 'Department', 'Present Pay Group', 'Promoted Pay Group', 'Promoted Designation', 'Rank Level', 'Sequence No', 'Promotion Date', 'Time in Previous Grade'];
  let csv = headers.join(',') + '\n';

  window.allPromotionsData.forEach((r, i) => {
    const row = [
      i + 1,
      `"${r.staff_id}"`,
      `"${r.emp_name}"`,
      `"${r.department}"`,
      `"${r.present_pay_group} (${r.present_designation})"`,
      `"${r.promoted_pay_group}"`,
      `"${r.promoted_designation}"`,
      r.rank_level,
      r.sequence_no,
      `"${window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(r.promotion_date) : r.promotion_date}"`,
      `"${r.time_in_previous_grade}"`
    ];
    csv += row.join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `All_Employees_Promotions_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  app.toast('CSV exported successfully', 'success');
}

async function loadPromotionEligibilityData() {
  const tbody = document.getElementById('eligibility-tbody');
  tbody.innerHTML = '<tr><td colspan="11" class="p-4 text-center text-gray-500"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-900 mx-auto mb-2"></div>Evaluating promotion criteria across active workforce...</td></tr>';

  try {
    app.showLoader();
    const data = await api.getPromotionEligibility();
    window.promotionEligibilityData = data;

    // Update summary stats
    const statTotal = document.getElementById('eligibility-stat-total');
    const stat3yr = document.getElementById('eligibility-stat-3yr');
    const stat5yr = document.getElementById('eligibility-stat-5yr');
    if (statTotal) statTotal.innerText = data.length;
    if (stat3yr) stat3yr.innerText = data.filter(e => e.years_in_grade >= 3).length;
    if (stat5yr) stat5yr.innerText = data.filter(e => e.years_in_grade >= 5).length;

    filterEligibilityTable();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="11" class="p-4 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`;
  } finally {
    app.hideLoader();
  }
}

function filterEligibilityTable() {
  if (!window.promotionEligibilityData) return;
  let list = window.promotionEligibilityData;

  const depFilter = document.getElementById('eligibility-filter-dep') ? document.getElementById('eligibility-filter-dep').value : 'ALL';
  const expFilter = document.getElementById('eligibility-filter-exp') ? document.getElementById('eligibility-filter-exp').value : '3';
  const search = document.getElementById('eligibility-search-text') ? document.getElementById('eligibility-search-text').value.toLowerCase().trim() : '';

  if (depFilter !== 'ALL') {
    list = list.filter(e => e.department === depFilter);
  }

  if (expFilter === '3') {
    list = list.filter(e => e.years_in_grade >= 3);
  } else if (expFilter === '5') {
    list = list.filter(e => e.years_in_grade >= 5);
  } else if (expFilter === '2') {
    list = list.filter(e => e.years_in_grade >= 2);
  }

  if (search) {
    list = list.filter(e => 
      String(e.staff_id || '').toLowerCase().includes(search) || 
      String(e.emp_name || '').toLowerCase().includes(search) ||
      String(e.present_pay_group || '').toLowerCase().includes(search)
    );
  }

  renderEligibilityRows(list);
}

function renderEligibilityRows(list) {
  const tbody = document.getElementById('eligibility-tbody');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="p-4 text-center text-gray-500">No employees meet the selected eligibility criteria.</td></tr>';
    return;
  }

  function formatDate(dStr) {
    if (!dStr || dStr === '-') return '-';
    return window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(dStr) : dStr;
  }

  list.forEach((r, idx) => {
    const tr = document.createElement('tr');
    tr.className = "hover:bg-blue-50/70 transition-colors";
    tr.innerHTML = `
      <td class="border border-gray-300 px-1 py-0 text-center font-bold text-gray-600">${idx + 1}</td>
      <td class="border border-gray-300 px-1 py-0 font-bold font-mono text-blue-900">${r.staff_id}</td>
      <td class="border border-gray-300 px-1 py-0 font-medium text-gray-900 truncate max-w-[160px]" title="${r.emp_name}">${r.emp_name}</td>
      <td class="border border-gray-300 px-1 py-0 text-gray-700">${r.department}</td>
      <td class="border border-gray-300 px-1 py-0 font-bold text-gray-800">${r.present_pay_group}</td>
      <td class="border border-gray-300 px-1 py-0 text-gray-700">${r.present_designation}</td>
      <td class="border border-gray-300 px-1 py-0 text-gray-700">${formatDate(r.current_grade_since)}</td>
      <td class="border border-gray-300 px-1 py-0 font-mono font-bold text-blue-950">${r.time_in_grade}</td>
      <td class="border border-gray-300 px-1 py-0 font-medium text-purple-900 bg-purple-50/30">${r.next_pay_group} (${r.next_designation})</td>
      <td class="border border-gray-300 px-1 py-0 text-center">
        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${r.eligibility_badge}">${r.eligibility_status}</span>
      </td>
      <td class="border border-gray-300 px-1 py-0 text-center">
        <button onclick="viewEmployeeIndividualReport('${r.staff_id}')" class="bg-blue-100 text-blue-800 hover:bg-blue-200 px-1.5 py-0.5 rounded text-[11px] font-bold border border-blue-300" title="View Full Promotion History">
          History
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/**
 * ==========================================
 * HRM WORKFORCE MODULE CONTROLLER
 * ==========================================
 * Handles dynamic cascading dropdowns, table generation matching reference image,
 * multi-variable distribution, enterprise airline HR analytics, and instant 0ms reactive filtering.
 */
var WorkforceModule = window.WorkforceModule = {
  currentTab: 'setup',
  currentDistView: 'shift',

  // Master Cache
  masterData: null,
  employees: [],
  setups: [],

  // Current Filter State
  selectedDirId: 'ALL',
  selectedDepId: 'ALL',
  selectedStationId: 'ALL',

  init: async function() {
    try {
      app.showLoader();
      const [mMaster, mEmployees] = await Promise.all([
        api.getMasterData(),
        api.getHrmDetails().catch(() => [])
      ]);

      this.masterData = mMaster || {};
      this.employees = Array.isArray(mEmployees) ? mEmployees : [];
      this.setups = Array.isArray(this.masterData.workforce_setup) ? this.masterData.workforce_setup : [];

      this.populateDropdownFilters();
      this.renderSetupReport();
    } catch (e) {
      console.error('WorkforceModule init error:', e);
      app.toast('Failed to load workforce records: ' + e.message, 'error');
    } finally {
      app.hideLoader();
    }
  },

  switchTab: function(tabName) {
    this.currentTab = tabName;
    ['setup', 'distribution', 'analytics', 'summary'].forEach(t => {
      const btn = document.getElementById('wf-btn-' + t);
      const ws = document.getElementById('wf-workspace-' + t);
      if (btn) {
        if (t === tabName) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (ws) {
        if (t === tabName) ws.classList.remove('hidden');
        else ws.classList.add('hidden');
      }
    });

    if (tabName === 'setup') {
      this.renderSetupReport();
    } else if (tabName === 'distribution') {
      this.renderDistributionReport();
    } else if (tabName === 'analytics') {
      this.renderAnalyticsDashboard();
    } else if (tabName === 'summary') {
      this.renderStationSummaryTable();
    }
  },

  /**
   * Dynamically populates Directorate, Department, and Station filters
   * Only includes options that actually exist in the database.
   */
  populateDropdownFilters: function() {
    const dirSelect = document.getElementById('wf-filter-dir');
    const depSelect = document.getElementById('wf-filter-dep');
    const stnSelect = document.getElementById('wf-filter-stn');
    if (!dirSelect || !depSelect || !stnSelect) return;

    const directorates = this.masterData.directorates || [];
    const departments = this.masterData.departments || [];
    const stations = this.masterData.stations || [];

    // Find distinct directorate IDs present in setups or departments
    const validDirIds = new Set();
    this.setups.forEach(s => { if (s.dir_id) validDirIds.add(String(s.dir_id).trim()); });
    departments.forEach(d => { if (d.dir_id) validDirIds.add(String(d.dir_id).trim()); });
    this.employees.forEach(e => { if (e.dir_id) validDirIds.add(String(e.dir_id).trim()); });

    dirSelect.innerHTML = '<option value="ALL">All Directorates</option>';
    directorates.forEach(dir => {
      if (validDirIds.size === 0 || validDirIds.has(String(dir.dir_id).trim())) {
        const opt = document.createElement('option');
        opt.value = dir.dir_id;
        opt.textContent = dir.dir_name || dir.dir_code;
        dirSelect.appendChild(opt);
      }
    });

    this.updateDepartmentDropdown();
    this.updateStationDropdown();
  },

  /**
   * Updates department options based on selected directorate
   */
  updateDepartmentDropdown: function() {
    const depSelect = document.getElementById('wf-filter-dep');
    if (!depSelect) return;

    const departments = this.masterData.departments || [];
    const dirId = this.selectedDirId;

    // Filter departments belonging to selected directorate
    let filteredDeps = departments;
    if (dirId !== 'ALL') {
      filteredDeps = departments.filter(d => String(d.dir_id).trim() === dirId);
    }

    // Only display departments that have setups or employees
    const validDepIds = new Set();
    this.setups.forEach(s => {
      if (dirId === 'ALL' || String(s.dir_id).trim() === dirId) {
        if (s.dep_id) validDepIds.add(String(s.dep_id).trim());
      }
    });
    this.employees.forEach(e => {
      if (dirId === 'ALL' || String(e.dir_id).trim() === dirId) {
        if (e.dep_id) validDepIds.add(String(e.dep_id).trim());
      }
    });

    depSelect.innerHTML = '<option value="ALL">All Departments</option>';
    filteredDeps.forEach(dep => {
      if (validDepIds.size === 0 || validDepIds.has(String(dep.dep_id).trim())) {
        const opt = document.createElement('option');
        opt.value = dep.dep_id;
        opt.textContent = dep.dep_name || dep.dep_letter_code || dep.dep_code;
        depSelect.appendChild(opt);
      }
    });

    // Reset selected department if no longer in options
    if (this.selectedDepId !== 'ALL') {
      const match = Array.from(depSelect.options).some(o => o.value === this.selectedDepId);
      if (!match) {
        this.selectedDepId = 'ALL';
        depSelect.value = 'ALL';
      } else {
        depSelect.value = this.selectedDepId;
      }
    }
  },

  /**
   * Updates station options based on active setups and employees
   */
  updateStationDropdown: function() {
    const stnSelect = document.getElementById('wf-filter-stn');
    if (!stnSelect) return;

    const stations = this.masterData.stations || [];
    const dirId = this.selectedDirId;
    const depId = this.selectedDepId;

    const validStnIds = new Set();
    this.setups.forEach(s => {
      if (dirId !== 'ALL' && String(s.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(s.dep_id).trim() !== depId) return;
      if (s.station_id) validStnIds.add(String(s.station_id).trim());
    });
    this.employees.forEach(e => {
      if (dirId !== 'ALL' && String(e.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(e.dep_id).trim() !== depId) return;
      if (e.station_id) validStnIds.add(String(e.station_id).trim());
    });

    stnSelect.innerHTML = '<option value="ALL">All Stations</option>';
    stations.forEach(stn => {
      if (validStnIds.size === 0 || validStnIds.has(String(stn.station_id).trim()) || validStnIds.has(String(stn.station_code).trim())) {
        const opt = document.createElement('option');
        opt.value = stn.station_id;
        opt.textContent = `${stn.station_code} - ${stn.station_name || stn.station_location || ''}`;
        stnSelect.appendChild(opt);
      }
    });

    if (this.selectedStationId !== 'ALL') {
      const match = Array.from(stnSelect.options).some(o => o.value === this.selectedStationId);
      if (!match) {
        this.selectedStationId = 'ALL';
        stnSelect.value = 'ALL';
      } else {
        stnSelect.value = this.selectedStationId;
      }
    }
  },

  onDirectorateChange: function() {
    const dirSelect = document.getElementById('wf-filter-dir');
    this.selectedDirId = dirSelect ? dirSelect.value : 'ALL';
    this.updateDepartmentDropdown();
    this.updateStationDropdown();
    this.renderSetupReport();
  },

  onDepartmentChange: function() {
    const depSelect = document.getElementById('wf-filter-dep');
    this.selectedDepId = depSelect ? depSelect.value : 'ALL';

    // If department is selected and directorate is ALL, auto-select parent directorate
    if (this.selectedDepId !== 'ALL' && this.selectedDirId === 'ALL') {
      const depObj = (this.masterData.departments || []).find(d => String(d.dep_id).trim() === this.selectedDepId);
      if (depObj && depObj.dir_id) {
        this.selectedDirId = String(depObj.dir_id).trim();
        const dirSelect = document.getElementById('wf-filter-dir');
        if (dirSelect) dirSelect.value = this.selectedDirId;
      }
    }

    this.updateStationDropdown();
    this.renderSetupReport();
  },

  onStationChange: function() {
    const stnSelect = document.getElementById('wf-filter-stn');
    this.selectedStationId = stnSelect ? stnSelect.value : 'ALL';
    this.renderSetupReport();
  },

  resetFilters: function() {
    this.selectedDirId = 'ALL';
    this.selectedDepId = 'ALL';
    this.selectedStationId = 'ALL';
    const dirSelect = document.getElementById('wf-filter-dir');
    const depSelect = document.getElementById('wf-filter-dep');
    const stnSelect = document.getElementById('wf-filter-stn');
    if (dirSelect) dirSelect.value = 'ALL';
    this.updateDepartmentDropdown();
    this.updateStationDropdown();
    if (depSelect) depSelect.value = 'ALL';
    if (stnSelect) stnSelect.value = 'ALL';
    this.renderSetupReport();
  },

  /**
   * Aggregates Set Up vs Existing Headcount vs Required Deficit
   * Strictly produces the layout and aesthetic of the user's reference image.
   */
  renderSetupReport: function() {
    const container = document.getElementById('wf-setup-table-container');
    const statusEl = document.getElementById('wf-filter-status');
    if (!container) return;

    const dirId = this.selectedDirId;
    const depId = this.selectedDepId;
    const stnId = this.selectedStationId;

    const payGroups = this.masterData.pay_groups || [];
    const departments = this.masterData.departments || [];
    const directorates = this.masterData.directorates || [];
    const stations = this.masterData.stations || [];

    // Lookup maps
    const pgMap = {};
    payGroups.forEach(pg => {
      pgMap[pg.pg_id] = pg;
      if (pg.designation_short) pgMap[String(pg.designation_short).trim().toUpperCase()] = pg;
      if (pg.pay_group) pgMap[String(pg.pay_group).trim().toUpperCase()] = pg;
    });

    // Update status text
    if (statusEl) {
      const dirObj = directorates.find(d => String(d.dir_id).trim() === dirId);
      const depObj = departments.find(d => String(d.dep_id).trim() === depId);
      const stnObj = stations.find(s => String(s.station_id).trim() === stnId);

      let parts = [];
      if (dirObj) parts.push(`Directorate: <strong class="text-teal-800">${dirObj.dir_name}</strong>`);
      else parts.push(`Directorates: <strong class="text-teal-800">All</strong>`);

      if (depObj) parts.push(`Department: <strong class="text-teal-800">${depObj.dep_name}</strong>`);
      if (stnObj) parts.push(`Station: <strong class="text-teal-800">${stnObj.station_code}</strong>`);

      statusEl.innerHTML = parts.join(' &nbsp;•&nbsp; ');
    }

    const matrix = {};

    function getGroupKey(desig, pgName) {
      return (String(desig || '-').trim().toUpperCase()) + '|' + (String(pgName || '-').trim().toUpperCase());
    }

    function getOrCreateGroup(desig, pgName, rankLvl) {
      const key = getGroupKey(desig, pgName);
      if (!matrix[key]) {
        matrix[key] = {
          designation: desig || '-',
          pay_group: pgName || '-',
          rank_level: Number(rankLvl) || 0,
          setup: 0,
          existing: 0,
          required: 0
        };
      }
      return matrix[key];
    }

    // 1. Process Sanctioned Setups
    this.setups.forEach(s => {
      if (dirId !== 'ALL' && String(s.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(s.dep_id).trim() !== depId) return;
      if (stnId !== 'ALL' && String(s.station_id).trim() !== stnId) return;

      const pgObj = pgMap[s.pay_group_id] || pgMap[s.designation_id];
      const desigObj = pgMap[s.designation_id] || pgObj;

      const desig = desigObj ? (desigObj.designation_short || desigObj.designation) : (s.designation_id || '-');
      const pgName = pgObj ? pgObj.pay_group : (s.pay_group_id || '-');
      const rankLvl = pgObj ? pgObj.rank_level : (desigObj ? desigObj.rank_level : 0);

      const entry = getOrCreateGroup(desig, pgName, rankLvl);
      entry.setup += (Number(s.set_up) || 0);
    });

    // 2. Process Active Personnel
    this.employees.forEach(emp => {
      if (emp.status === 'Retired') return; // Exclude retired employees

      if (dirId !== 'ALL' && String(emp.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(emp.dep_id).trim() !== depId) return;
      if (stnId !== 'ALL' && String(emp.station_id).trim() !== stnId) return;

      const desig = emp.designation ? String(emp.designation).replace(/,.*\(Add\. Charge\)/i, '').trim() : '-';
      const pgName = emp.pay_group || '-';
      const rankLvl = emp.rank_level || 0;

      const entry = getOrCreateGroup(desig, pgName, rankLvl);
      entry.existing += 1;
    });

    // 3. Compute Required Deficit and apply dynamic exclusion
    const rows = [];
    let totalSetup = 0;
    let totalExisting = 0;
    let totalRequired = 0;

    for (const k in matrix) {
      if (matrix.hasOwnProperty(k)) {
        const row = matrix[k];
        row.required = row.setup - row.existing;

        // Dynamic Exclusion: Exclude any group without currently assigned personnel or setup
        if (row.setup === 0 && row.existing === 0) {
          continue;
        }

        totalSetup += row.setup;
        totalExisting += row.existing;
        totalRequired += row.required;
        rows.push(row);
      }
    }

    // Update Top Summary Badges
    const bSetup = document.getElementById('wf-badge-setup');
    const bExist = document.getElementById('wf-badge-existing');
    const bReq = document.getElementById('wf-badge-required');
    if (bSetup) bSetup.innerText = totalSetup.toLocaleString();
    if (bExist) bExist.innerText = totalExisting.toLocaleString();
    if (bReq) bReq.innerText = totalRequired.toLocaleString();

    // 4. Sort rows descending by rank_level, then by designation
    rows.sort((a, b) => {
      if (b.rank_level !== a.rank_level) return b.rank_level - a.rank_level;
      return a.designation.localeCompare(b.designation);
    });

    // If no records match
    if (rows.length === 0) {
      container.innerHTML = `
        <div class="p-8 text-center text-gray-400 border border-dashed border-gray-300 rounded-lg">
          <span class="material-icons text-4xl mb-2 text-gray-300">work_outline</span>
          <h4 class="font-bold text-gray-600 text-sm">No Active Personnel or Setup Records Found</h4>
          <p class="text-xs text-gray-400 mt-1">There are no sanctioned setups or active officers matching the current filter criteria.</p>
        </div>
      `;
      return;
    }

    // 5. Generate Table HTML strictly adhering to the sample image aesthetic
    let html = `
      <table class="workforce-setup-table" id="workforce-matrix-table">
        <thead>
          <tr>
            <th style="width: 28%;">Designation</th>
            <th class="center-col" style="width: 18%;">Pay Group</th>
            <th class="num-col" style="width: 18%;">Setup</th>
            <th class="num-col" style="width: 18%;">Existing</th>
            <th class="num-col" style="width: 18%;">Required</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach(r => {
      html += `
        <tr>
          <td>${r.designation}</td>
          <td class="center-col">${r.pay_group}</td>
          <td class="num-col">${r.setup}</td>
          <td class="num-col">${r.existing}</td>
          <td class="num-col">${r.required}</td>
        </tr>
      `;
    });

    // Total Summary Row
    html += `
        <tr class="total-row">
          <td style="text-align: center;">Total</td>
          <td></td>
          <td class="num-col">${totalSetup}</td>
          <td class="num-col">${totalExisting}</td>
          <td class="num-col">${totalRequired}</td>
        </tr>
      </tbody>
    </table>
    `;

    container.innerHTML = html;
  },

  /**
   * Tab 2: Workforce Distribution Reporting
   * Multi-variable consolidated cross-tabulations across departments, shifts, sections, and stations.
   */
  switchDistView: function(viewType) {
    this.currentDistView = viewType;
    ['shift', 'section', 'desig', 'station'].forEach(v => {
      const btn = document.getElementById('wf-dist-btn-' + v);
      if (btn) {
        if (v === viewType || (v === 'desig' && viewType === 'designation')) {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded bg-teal-800 text-white shadow-sm';
        } else {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded bg-gray-100 hover:bg-gray-200 text-gray-700';
        }
      }
    });
    this.renderDistributionReport();
  },

  renderDistributionReport: function() {
    const container = document.getElementById('wf-dist-content-container');
    const totalEl = document.getElementById('wf-dist-total-headcount');
    if (!container) return;

    const activeEmps = this.employees.filter(e => e.status !== 'Retired');
    if (totalEl) totalEl.innerText = activeEmps.length.toLocaleString();

    const view = this.currentDistView;

    if (view === 'shift') {
      // 1. Department x Shift Matrix
      const shifts = this.masterData.shifts || [];
      const shiftColMap = {};
      shifts.forEach(s => { if (s.shift_name) shiftColMap[s.shift_name] = true; });
      const shiftCols = Object.keys(shiftColMap);
      if (shiftCols.indexOf('General') === -1) shiftCols.push('General');
      if (shiftCols.indexOf('Others') === -1) shiftCols.push('Others');

      const depShiftMatrix = {};
      activeEmps.forEach(e => {
        const dep = e.department || 'General';
        if (!depShiftMatrix[dep]) {
          depShiftMatrix[dep] = { department: dep, dep_name: e.dep_name || dep, total: 0 };
          shiftCols.forEach(col => { depShiftMatrix[dep][col] = 0; });
        }
        const sh = e.shift && shiftCols.indexOf(e.shift) !== -1 ? e.shift : 'Others';
        depShiftMatrix[dep][sh] = (depShiftMatrix[dep][sh] || 0) + 1;
        depShiftMatrix[dep].total += 1;
      });

      const rows = Object.values(depShiftMatrix);
      rows.sort((a, b) => b.total - a.total);

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Departmental Operational Shift Distribution Matrix</h4>
          <p class="text-xs text-gray-500">Cross-tabulation of on-roll personnel deployed across 24/7 flight operations shifts</p>
        </div>
        <table class="workforce-setup-table">
          <thead>
            <tr>
              <th>Department</th>
              ${shiftCols.map(c => `<th class="num-col">${c}</th>`).join('')}
              <th class="num-col font-bold">Total Staff</th>
            </tr>
          </thead>
          <tbody>
      `;

      let colTotals = {};
      shiftCols.forEach(c => { colTotals[c] = 0; });
      let grandTotal = 0;

      rows.forEach(r => {
        grandTotal += r.total;
        html += `
          <tr>
            <td><strong>${r.department}</strong> <span class="text-xs text-gray-500">(${r.dep_name})</span></td>
            ${shiftCols.map(c => {
              colTotals[c] += (r[c] || 0);
              return `<td class="num-col">${r[c] || 0}</td>`;
            }).join('')}
            <td class="num-col font-bold">${r.total}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td style="text-align: center;">Total</td>
            ${shiftCols.map(c => `<td class="num-col">${colTotals[c]}</td>`).join('')}
            <td class="num-col">${grandTotal}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;

    } else if (view === 'section') {
      // 2. Department x Section Breakdown
      const secMatrix = {};
      activeEmps.forEach(e => {
        const dep = e.department || 'General';
        const sec = e.placement && e.placement !== '-' ? e.placement : 'General Section';
        const key = dep + '|' + sec;
        if (!secMatrix[key]) {
          secMatrix[key] = { department: dep, dep_name: e.dep_name || dep, section: sec, headcount: 0 };
        }
        secMatrix[key].headcount += 1;
      });

      const rows = Object.values(secMatrix);
      rows.sort((a, b) => {
        if (a.department !== b.department) return a.department.localeCompare(b.department);
        return b.headcount - a.headcount;
      });

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Detailed Sectional Distribution by Department</h4>
          <p class="text-xs text-gray-500">Internal section staffing allocation (Ramp, Baggage, Check-in, Cargo, Security)</p>
        </div>
        <table class="workforce-setup-table">
          <thead>
            <tr>
              <th style="width: 30%;">Department</th>
              <th style="width: 40%;">Section / Functional Area</th>
              <th class="num-col" style="width: 30%;">Active Headcount</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalCount = 0;
      rows.forEach(r => {
        totalCount += r.headcount;
        html += `
          <tr>
            <td><strong>${r.department}</strong> <span class="text-xs text-gray-500">(${r.dep_name})</span></td>
            <td>${r.section}</td>
            <td class="num-col">${r.headcount}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td style="text-align: center;" colspan="2">Total Active Personnel</td>
            <td class="num-col">${totalCount}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;

    } else if (view === 'designation') {
      // 3. Designation & Rank Matrix
      const desigMatrix = {};
      activeEmps.forEach(e => {
        const desig = e.designation ? String(e.designation).replace(/,.*\(Add\. Charge\)/i, '').trim() : '-';
        const key = desig + '|' + (e.pay_group || '-');
        if (!desigMatrix[key]) {
          desigMatrix[key] = {
            designation: desig,
            pay_group: e.pay_group || '-',
            rank_level: e.rank_level || 0,
            headcount: 0
          };
        }
        desigMatrix[key].headcount += 1;
      });

      const rows = Object.values(desigMatrix);
      rows.sort((a, b) => {
        if (b.rank_level !== a.rank_level) return b.rank_level - a.rank_level;
        return b.headcount - a.headcount;
      });

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Designation &amp; Pay Group Distribution</h4>
          <p class="text-xs text-gray-500">Consolidated employee deployment ranked by seniority grade</p>
        </div>
        <table class="workforce-setup-table">
          <thead>
            <tr>
              <th style="width: 40%;">Designation</th>
              <th class="center-col" style="width: 30%;">Pay Group</th>
              <th class="num-col" style="width: 30%;">Active Headcount</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalCount = 0;
      rows.forEach(r => {
        totalCount += r.headcount;
        html += `
          <tr>
            <td>${r.designation}</td>
            <td class="center-col">${r.pay_group}</td>
            <td class="num-col">${r.headcount}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td style="text-align: center;" colspan="2">Total Active Personnel</td>
            <td class="num-col">${totalCount}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;

    } else if (view === 'station') {
      // 4. Station Allocation
      const stnMatrix = {};
      activeEmps.forEach(e => {
        const stn = e.posting && e.posting !== '-' ? e.posting : 'Unassigned';
        stnMatrix[stn] = (stnMatrix[stn] || 0) + 1;
      });

      const stations = this.masterData.stations || [];
      const rows = Object.keys(stnMatrix).map(k => {
        const stnObj = stations.find(s => s.station_code === k);
        return {
          station_code: k,
          station_name: stnObj ? stnObj.station_name : '-',
          station_type: stnObj ? stnObj.station_type : 'Spoke',
          headcount: stnMatrix[k]
        };
      });
      rows.sort((a, b) => b.headcount - a.headcount);

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Station Workforce Allocation Breakdown</h4>
          <p class="text-xs text-gray-500">Personnel distribution across domestic and international stations</p>
        </div>
        <table class="workforce-setup-table">
          <thead>
            <tr>
              <th style="width: 25%;">Station Code</th>
              <th style="width: 35%;">Station Name</th>
              <th class="center-col" style="width: 20%;">Type</th>
              <th class="num-col" style="width: 20%;">Headcount</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalCount = 0;
      rows.forEach(r => {
        totalCount += r.headcount;
        html += `
          <tr>
            <td><strong>${r.station_code}</strong></td>
            <td>${r.station_name}</td>
            <td class="center-col">${r.station_type}</td>
            <td class="num-col">${r.headcount}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td style="text-align: center;" colspan="3">Total Assigned Across Stations</td>
            <td class="num-col">${totalCount}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;
    }
  },

  /**
   * Tab 3: Enterprise Airline HR Analytics Dashboard
   */
  renderAnalyticsDashboard: function() {
    const container = document.getElementById('wf-analytics-container');
    if (!container) return;

    const setups = this.setups;
    const employees = this.employees.filter(e => e.status !== 'Retired');
    const stations = this.masterData.stations || [];
    const departments = this.masterData.departments || [];

    const totalSetup = setups.reduce((sum, s) => sum + (Number(s.set_up) || 0), 0);
    const totalExisting = employees.length;
    const totalRequired = totalSetup - totalExisting;
    const fulfillmentRate = totalSetup > 0 ? Math.round((totalExisting / totalSetup) * 100) : 100;

    // Hub vs Spoke
    const hubCodes = stations.filter(s => String(s.station_type || '').toLowerCase() === 'hub' || ['DAC', 'HSIA'].includes(String(s.station_code).toUpperCase())).map(s => s.station_code);
    let hubCount = 0, spokeCount = 0;
    employees.forEach(e => {
      if (hubCodes.includes(e.posting)) hubCount++;
      else spokeCount++;
    });

    // Operational Manning (Ramp, Flight Ops, Ground Services, Security, Engineering)
    let operationalCount = 0, adminCount = 0;
    employees.forEach(e => {
      const d = String(e.department || '').toUpperCase();
      if ((e.shift && e.shift !== '-' && e.shift !== 'General') || ['GS', 'TQC', 'OPS', 'SEC', 'ENG', 'RAMP'].includes(d)) {
        operationalCount++;
      } else {
        adminCount++;
      }
    });

    // Pay Group Pyramid
    let execCount = 0, supervisoryCount = 0, operationalPgCount = 0;
    employees.forEach(e => {
      const r = e.rank_level || 0;
      if (r >= 9) execCount++;
      else if (r >= 5) supervisoryCount++;
      else operationalPgCount++;
    });

    // Upcoming Retirements
    const now = new Date();
    const oneYr = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
    const threeYrs = new Date(now.getFullYear() + 3, now.getMonth(), now.getDate());
    const fiveYrs = new Date(now.getFullYear() + 5, now.getMonth(), now.getDate());

    let ret1Yr = 0, ret3Yrs = 0, ret5Yrs = 0;
    employees.forEach(e => {
      if (e.retirement_date) {
        const retD = window.parseDate ? window.parseDate(e.retirement_date) : new Date(e.retirement_date);
        if (retD && retD >= now) {
          if (retD <= oneYr) ret1Yr++;
          if (retD <= threeYrs) ret3Yrs++;
          if (retD <= fiveYrs) ret5Yrs++;
        }
      }
    });

    // Departmental Health
    const depHealth = {};
    departments.forEach(d => {
      depHealth[d.dep_id] = {
        dep_id: d.dep_id,
        dep_code: d.dep_letter_code || d.dep_code,
        dep_name: d.dep_name,
        setup: 0,
        existing: 0
      };
    });
    setups.forEach(s => {
      if (depHealth[s.dep_id]) depHealth[s.dep_id].setup += (Number(s.set_up) || 0);
    });
    employees.forEach(e => {
      if (depHealth[e.dep_id]) depHealth[e.dep_id].existing += 1;
    });

    const depHealthList = Object.values(depHealth).filter(d => d.setup > 0 || d.existing > 0);
    depHealthList.forEach(d => {
      d.deficit = d.setup - d.existing;
      d.fulfillment = d.setup > 0 ? Math.round((d.existing / d.setup) * 100) : 100;
      if (d.fulfillment >= 90) d.healthBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      else if (d.fulfillment >= 75) d.healthBadge = 'bg-yellow-100 text-yellow-800 border-yellow-300';
      else d.healthBadge = 'bg-rose-100 text-rose-800 border-rose-300';
    });
    depHealthList.sort((a, b) => a.fulfillment - b.fulfillment);

    let html = `
      <!-- Top 4 Airline HR KPI Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        
        <!-- Card 1: Setup vs Existing -->
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-teal-600">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Workforce Fulfillment</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${fulfillmentRate}%</h3>
            <span class="text-xs font-semibold ${totalRequired > 0 ? 'text-rose-600' : 'text-emerald-600'}">
              ${totalRequired > 0 ? totalRequired + ' Deficit' : 'Staffed'}
            </span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-teal-600 h-full rounded-full" style="width: ${Math.min(fulfillmentRate, 100)}%;"></div>
          </div>
          <p class="text-[11px] text-gray-500 mt-2"><strong>${totalExisting.toLocaleString()}</strong> Active on <strong>${totalSetup.toLocaleString()}</strong> Setup</p>
        </div>

        <!-- Card 2: Frontline Operational Ratio -->
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-sky-600">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Operational Manning Ratio</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${totalExisting > 0 ? Math.round((operationalCount / totalExisting) * 100) : 0}%</h3>
            <span class="text-xs font-semibold text-sky-700">Flight &amp; Station Ops</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-sky-600 h-full rounded-full" style="width: ${totalExisting > 0 ? (operationalCount / totalExisting) * 100 : 0}%;"></div>
          </div>
          <p class="text-[11px] text-gray-500 mt-2"><strong>${operationalCount}</strong> Frontline vs <strong>${adminCount}</strong> Admin/HQ</p>
        </div>

        <!-- Card 3: Hub vs Spoke Network -->
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-indigo-600">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Hub vs Spoke Network</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${totalExisting > 0 ? Math.round((hubCount / totalExisting) * 100) : 0}% / ${totalExisting > 0 ? Math.round((spokeCount / totalExisting) * 100) : 0}%</h3>
            <span class="text-xs font-semibold text-indigo-700">Hub / Outstations</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden flex">
            <div class="bg-indigo-600 h-full" style="width: ${totalExisting > 0 ? (hubCount / totalExisting) * 100 : 0}%;"></div>
            <div class="bg-amber-500 h-full" style="width: ${totalExisting > 0 ? (spokeCount / totalExisting) * 100 : 0}%;"></div>
          </div>
          <p class="text-[11px] text-gray-500 mt-2"><strong>${hubCount}</strong> Hub Base vs <strong>${spokeCount}</strong> Outstations</p>
        </div>

        <!-- Card 4: Succession / Retirement Horizon -->
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-amber-500">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Retirement Pipeline</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${ret1Yr}</h3>
            <span class="text-xs font-semibold text-amber-700">Retiring in 1 Yr</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-amber-500 h-full rounded-full" style="width: ${Math.min((ret1Yr / (totalExisting || 1)) * 500, 100)}%;"></div>
          </div>
          <p class="text-[11px] text-gray-500 mt-2">3-Yr: <strong>${ret3Yrs}</strong> | 5-Yr Horizon: <strong>${ret5Yrs}</strong></p>
        </div>

      </div>

      <!-- Two Column Analytical Breakdown -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        
        <!-- Left: Departmental Staffing Health Progress Meters -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
          <div class="flex items-center justify-between mb-3 border-b border-gray-100 pb-2">
            <div>
              <h4 class="text-sm font-bold text-gray-800">Departmental Staffing Health Index</h4>
              <p class="text-xs text-gray-500">Fulfillment percentage against sanctioned setup</p>
            </div>
            <span class="text-[11px] bg-slate-100 text-gray-600 px-2 py-0.5 rounded font-semibold">${depHealthList.length} Departments</span>
          </div>

          <div class="space-y-3">
            ${depHealthList.map(d => `
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="font-semibold text-gray-700">${d.dep_name} <strong class="text-gray-400">(${d.dep_code})</strong></span>
                  <span class="font-bold ${d.fulfillment >= 90 ? 'text-emerald-700' : d.fulfillment >= 75 ? 'text-amber-700' : 'text-rose-700'}">
                    ${d.existing} / ${d.setup} (${d.fulfillment}%)
                  </span>
                </div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden flex">
                  <div class="${d.fulfillment >= 90 ? 'bg-emerald-500' : d.fulfillment >= 75 ? 'bg-amber-500' : 'bg-rose-500'} h-full rounded-full transition-all duration-500" style="width: ${Math.min(d.fulfillment, 100)}%;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Right: Pay Group Hierarchy & Succession Pyramid -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3 border-b border-gray-100 pb-2">
              <div>
                <h4 class="text-sm font-bold text-gray-800">Workforce Hierarchy &amp; Staffing Pyramid</h4>
                <p class="text-xs text-gray-500">Tiered composition across executive, supervisory, and operational staff</p>
              </div>
              <span class="text-[11px] bg-teal-50 text-teal-800 border border-teal-200 px-2 py-0.5 rounded font-semibold">Airline Structure</span>
            </div>

            <!-- Pyramid Visual Stack -->
            <div class="flex flex-col items-center space-y-2 py-4">
              
              <!-- Tier 1: Executive Leadership (PG 9-11) -->
              <div class="w-1/3 bg-purple-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-[10px] font-bold uppercase tracking-wider block opacity-80">Executive Leadership (PG 9-11)</span>
                <span class="text-lg font-black">${execCount} Personnel</span>
                <span class="text-[10px] block opacity-75">${totalExisting > 0 ? Math.round((execCount / totalExisting) * 100) : 0}% of Total</span>
              </div>

              <!-- Tier 2: Supervisory & Officers (PG 5-8) -->
              <div class="w-2/3 bg-sky-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-[10px] font-bold uppercase tracking-wider block opacity-80">Supervisory &amp; Officers (PG 5-8)</span>
                <span class="text-lg font-black">${supervisoryCount} Personnel</span>
                <span class="text-[10px] block opacity-75">${totalExisting > 0 ? Math.round((supervisoryCount / totalExisting) * 100) : 0}% of Total</span>
              </div>

              <!-- Tier 3: Ground Operations & Tech (PG 1-4) -->
              <div class="w-full bg-teal-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-[10px] font-bold uppercase tracking-wider block opacity-80">Ground Operations, GSE &amp; Assistants (PG 1-4)</span>
                <span class="text-lg font-black">${operationalPgCount} Personnel</span>

    `;

  /**
   * Tab 4: Station Operational Staffing Summary Table
   */
  renderStationSummaryTable: function() {
    const container = document.getElementById('wf-summary-table-container');
    if (!container) return;

    const stations = this.masterData.stations || [];
    const setups = this.setups;
    const employees = this.employees.filter(e => e.status !== 'Retired');

    const stnData = stations.map(st => {
      const stSetups = setups.filter(s => String(s.station_id).trim() === String(st.station_id).trim());
      const stEmps = employees.filter(e => String(e.station_id).trim() === String(st.station_id).trim() || String(e.posting).trim() === String(st.station_code).trim());

      const setupCount = stSetups.reduce((sum, s) => sum + (Number(s.set_up) || 0), 0);
      const existingCount = stEmps.length;
      const deficit = setupCount - existingCount;
      const fulfillment = setupCount > 0 ? Math.round((existingCount / setupCount) * 100) : 100;

      let statusBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      let statusText = 'Adequate';
      if (fulfillment < 75) {
        statusBadge = 'bg-rose-100 text-rose-800 border-rose-300';
        statusText = 'Critical Deficit';
      } else if (fulfillment < 90) {
        statusBadge = 'bg-amber-100 text-amber-800 border-amber-300';
        statusText = 'Moderate Deficit';
      }

      return {
        station_code: st.station_code,
        station_name: st.station_name || '-',
        station_type: st.station_type || 'Spoke',
        setup: setupCount,
        existing: existingCount,
        required: deficit,
        fulfillment: fulfillment,
        statusText: statusText,
        statusBadge: statusBadge
      };
    });

    stnData.sort((a, b) => b.required - a.required);

    let html = `
      <table class="workforce-setup-table">
        <thead>
          <tr>
            <th style="width: 15%;">Station Code</th>
            <th style="width: 25%;">Station Name</th>
            <th class="center-col" style="width: 15%;">Type</th>
            <th class="num-col" style="width: 12%;">Setup</th>
            <th class="num-col" style="width: 12%;">Existing</th>
            <th class="num-col" style="width: 12%;">Required</th>
            <th class="center-col" style="width: 15%;">Coverage Status</th>
          </tr>
        </thead>
        <tbody>
    `;

    let totalSetup = 0, totalExisting = 0, totalRequired = 0;
    stnData.forEach(r => {
      totalSetup += r.setup;
      totalExisting += r.existing;
      totalRequired += r.required;

      html += `
        <tr>
          <td><strong>${r.station_code}</strong></td>
          <td>${r.station_name}</td>
          <td class="center-col">${r.station_type}</td>
          <td class="num-col">${r.setup}</td>
          <td class="num-col">${r.existing}</td>
          <td class="num-col">${r.required}</td>
          <td class="center-col">
            <span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold border ${r.statusBadge}">
              ${r.statusText} (${r.fulfillment}%)
            </span>
          </td>
        </tr>
      `;
    });

    html += `
        <tr class="total-row">
          <td style="text-align: center;" colspan="3">Network Total</td>
          <td class="num-col">${totalSetup}</td>
          <td class="num-col">${totalExisting}</td>
          <td class="num-col">${totalRequired}</td>
          <td class="center-col"><strong>${totalSetup > 0 ? Math.round((totalExisting / totalSetup) * 100) : 100}% Overall</strong></td>
        </tr>
      </tbody>
    </table>
    `;

    container.innerHTML = html;
  },

  /**
   * Exports the currently active view to CSV
   */
  exportCurrentViewCSV: function() {
    const table = document.querySelector('#tmpl-hrm_workforce table') || document.querySelector('.workforce-setup-table');
    if (!table) {
      app.toast('No table data available to export.', 'warning');
      return;
    }

    let csv = [];
    const rows = table.querySelectorAll('tr');
    rows.forEach(r => {
      let cols = [];
      r.querySelectorAll('th, td').forEach(c => {
        let text = c.innerText.replace(/"/g, '""').trim();
        cols.push(`"${text}"`);
      });
      csv.push(cols.join(','));
    });

    const csvContent = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv.join('\n'));
    const link = document.createElement('a');
    link.setAttribute('href', csvContent);
    link.setAttribute('download', `workforce_report_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    app.toast('Report exported to CSV successfully.', 'success');
  },

  exportSummaryCSV: function() {
    this.exportCurrentViewCSV();
  },

  printReport: function() {
    window.print();
  }
};

/**
 * Lifecycle hook called automatically when view 'hrm_workforce' is loaded
 */
async function hrm_workforce_init() {
  await WorkforceModule.init();
}
</script>
