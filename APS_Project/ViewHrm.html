<script>
/**
 * ============================================================================
 * SANDVIORA AVIOSOLUTION - Human Resource Management (HRM) View Controller
 * ============================================================================
 * File: ViewHrm.html
 * Architectural Role: Client-Side Controller for Enterprise Human Resources
 * 
 * Description:
 * Implements the complete front-end user experience for all human resources
 * operations across the airline. Connects reactive UI components, interactive
 * spreadsheet grids, and analytical dashboards to backend HrmService APIs.
 * 
 * 9 Primary Submenu Modules:
 * 1. Dashboard (`renderDashboard`):
 *    Operational KPI stat cards (Total Staff, Officers & Supervisors, Pending Promotions).
 * 2. Input Records (`renderInputRecords`, `openInputForm`, `submitDynamicForm`):
 *    Selectable catalog for 10 forms: Placements, Employees, Postings, Promotions,
 *    Extensions, Addl Charges, Acting, Separation, Emp Migrations, Disciplinary Cases.
 * 3. View Forms (`renderViewForms`, `openViewGrid`):
 *    Structured data grid viewer with real-time search, sorting, and pagination.
 * 4. Employees List (`renderEmployeesList`):
 *    Spreadsheet view with 7 interactive sub-views (Precise List, All Employees,
 *    On Job, Retired, Officer & Sup, TH, and Pay Group filters).
 * 5. Service History (`renderServiceHistory`):
 *    Chronological placement timeline with automated ending dates and longest-service analytics.
 * 6. Promotion Intelligence (`renderPromotionModule`):
 *    Individual progression report cards, all promotion records with From/To date
 *    filtering, and the 3-Year Promotion Eligibility assessment engine.
 * 7. Workforce Deficit & Distribution (`renderWorkforcesModule`):
 *    Workforce Sanction Setup vs Existing Headcount vs Required Deficit analysis.
 * 8. Allowance Calculation (`renderAllowanceModule`):
 *    Monthly payroll and overtime adjustment calculator.
 * 9. Reports Hub (`renderReportsHub`):
 *    Consolidated reports download and printing center.
 * ============================================================================
 */
var hrmViews = window.hrmViews = {
  activeView: 'dashboard',
  masterData: null,
  cachedEmployees: [],
  currentEmpSubView: 'details',
  currentEmpFilterPg: 'ALL',
  currentEmpFilterPosting: 'ALL',
  currentEmpFilterStatus: 'ALL',

  init: function() {
    this.loadMasterData();
    this.renderDashboard();
  },

  loadMasterData: function(forceRefresh) {
    var self = this;
    api.getMasterData(forceRefresh).then(function(data) {
      self.masterData = data;
    }).catch(function(err) {
      console.warn('Master data load warning:', err);
    });
  },

  parsePayGroupRank: function(pgStr) {
    var s = String(pgStr || '').trim().toUpperCase();
    if (!s) return 0;
    // Match 3(2) or 3(II) or 3-2 or 3.2
    if (/3\s*[\(\-_\.]\s*(2|II)/i.test(s) || /PG\s*0?3\s*[\(\-_\.]\s*(2|II)/i.test(s)) return 3.2;
    // Match 3(1) or 3(I) or 3-1 or 3.1
    if (/3\s*[\(\-_\.]\s*(1|I)/i.test(s) || /PG\s*0?3\s*[\(\-_\.]\s*(1|I)/i.test(s)) return 3.1;
    // Match standalone PG-3 or 3
    if (/^(?:PG[\s\-_]*)?0?3$/i.test(s)) return 3.1;
    // Match PG-1, PG-01, 1, TH, Traffic Helper
    if (/^(?:PG[\s\-_]*)?0?1$/i.test(s) || s === 'TH' || s.indexOf('TRAFFIC HELPER') !== -1) return 1.0;
    // Match PG-2, PG-02, 2
    if (/^(?:PG[\s\-_]*)?0?2$/i.test(s)) return 2.0;
    // Match PG-4, PG-04, 4
    if (/^(?:PG[\s\-_]*)?0?4$/i.test(s)) return 4.0;
    // Match multi-digit numbers PG-10, PG-11, PG-5...
    var m = s.match(/(?:PG[\s\-_]*)?(\d+)/i);
    if (m) return parseInt(m[1], 10);
    return 0;
  },

  isPayGroup1: function(empOrPg) {
    var pg = typeof empOrPg === 'string' ? empOrPg : (empOrPg ? empOrPg.pay_group : '');
    var rank = this.parsePayGroupRank(pg);
    if (rank === 1.0) return true;
    var s = String(pg || '').trim().toUpperCase();
    return s === 'TH' || s.indexOf('TRAFFIC HELPER') !== -1 || /^(?:PG[\s\-_]*)?0?1$/i.test(s);
  },

  isOfficerOrSup: function(empOrPg) {
    if (!empOrPg) return false;
    var pg = typeof empOrPg === 'string' ? empOrPg : (empOrPg ? empOrPg.pay_group : '');
    var s = String(pg || '').trim().toUpperCase();
    var desig = (typeof empOrPg === 'object' && empOrPg) ? String(empOrPg.designation || empOrPg.base_designation || '').toUpperCase() : '';
    var rank = (typeof empOrPg === 'object' && empOrPg) ? Number(empOrPg.rank_level || 0) : 0;

    // 1. Check for 3(2) or 3(II) first
    if (
      /3\s*[\(\-_\/\.]\s*(?:2|II)\b/i.test(s) ||
      /3\s*[\(\-_\/\.]\s*2\b/i.test(s) ||
      s.indexOf('3(2)') !== -1 || s.indexOf('3 (2)') !== -1 ||
      s.indexOf('3(II)') !== -1 || s.indexOf('3(ii)') !== -1 ||
      s.indexOf('3/2') !== -1 || s.indexOf('3-2') !== -1 || s.indexOf('3.2') !== -1
    ) {
      return true;
    }

    // 2. Check for PG-4 through PG-15 (or single digits 4..9, 10..15)
    var numMatch = s.match(/(?:PG[\s\-_]*)?(\d+)/i);
    if (numMatch) {
      var n = parseInt(numMatch[1], 10);
      if (n >= 4) return true;
    }

    // 3. Rank level check
    if (rank >= 3.2 || rank >= 4) {
      return true;
    }

    // 4. Designation check (unless they are explicitly PG-1, PG-2, or PG-3(1))
    var isLower = /^(?:PG[\s\-_]*)?0?1$/i.test(s) || s === 'TH' ||
                  /^(?:PG[\s\-_]*)?0?2$/i.test(s) ||
                  /3\s*[\(\-_\/\.]\s*(?:1|I)\b/i.test(s) ||
                  /^(?:PG[\s\-_]*)?0?3$/i.test(s);
    if (!isLower) {
      if (desig.indexOf('SUPERVISOR') !== -1 || desig.indexOf('OFFICER') !== -1 || 
          desig.indexOf('MANAGER') !== -1 || desig.indexOf('DIRECTOR') !== -1 ||
          desig.indexOf('DGM') !== -1 || desig.indexOf('GM') !== -1 || desig.indexOf('AGM') !== -1) {
        return true;
      }
    }

    return false;
  },

              <span class="material-icons">groups</span>

          </div>

          <div class="kpi-card">

          </div>

            <div>

            </div>

              <span class="material-icons">person_off</span>
            </div>
          </div>

          <div class="kpi-card">
            <div>
              <p class="kpi-label">Promotion Batches</p>

              <span class="material-icons">trending_up</span>
            </div>
          </div>
        </div>

        <!-- Visual Analytics & Submenu Summaries -->
        <div class="analytics-two-col-grid">
          <!-- Pay Group Seniority Breakdown -->
          <div class="content-card">
            <div class="card-header-bar">
              <h3 class="card-header-title">Pay Group Seniority Breakdown</h3>
              <span style="font-size: 0.825rem; color: var(--text-muted); font-weight: 700;">Headcount per Pay Group</span>
            </div>
            <div id="dash-pg-bars" style="display: flex; flex-direction: column; gap: 0.65rem;">
              <div style="font-size: 0.875rem; color: var(--text-muted); text-align: center; padding: 1.5rem 0;">Loading pay group metrics...</div>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="content-card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <div class="card-header-bar">
                <h3 class="card-header-title">Quick Actions</h3>
              </div>
              <div class="action-menu-list">
                <button type="button" class="quick-nav-btn" onclick="app.loadView('hrm_input')">
                  <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-icons" style="color: var(--brand-teal); font-size: 20px;">edit_document</span>
                    <span style="font-size: 0.875rem; font-weight: 700;">New Data Input</span>
                  </div>
                  <span class="material-icons" style="font-size: 18px; color: var(--text-muted);">arrow_forward</span>
                </button>
                <button type="button" class="quick-nav-btn" onclick="app.loadView('hrm_employees')">
                  <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-icons" style="color: #2563eb; font-size: 20px;">view_list</span>
                    <span style="font-size: 0.875rem; font-weight: 700;">Employees Spreadsheet</span>
                  </div>
                  <span class="material-icons" style="font-size: 18px; color: var(--text-muted);">arrow_forward</span>
                </button>
                <button type="button" class="quick-nav-btn" onclick="app.loadView('hrm_promotion')">
                  <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="material-icons" style="color: #7c3aed; font-size: 20px;">workspace_premium</span>
                    <span style="font-size: 0.875rem; font-weight: 700;">Promotion Intelligence</span>

                  <span class="material-icons" style="font-size: 18px; color: var(--text-muted);">arrow_forward</span>
                </button>
                <button type="button" class="quick-nav-btn" onclick="app.loadView('hrm_workforce')">

                    <span class="material-icons" style="color: #d97706; font-size: 20px;">groups_2</span>
                    <span style="font-size: 0.875rem; font-weight: 700;">Workforce Deficit Setup</span>
                  </div>
                  <span class="material-icons" style="font-size: 18px; color: var(--text-muted);">arrow_forward</span>
                </button>
              </div>
            </div>
            <div style="padding-top: 1rem; border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted);">
              <span>Database: Connected</span>
              <span style="font-weight: 700; color: var(--brand-teal);">Enterprise HRIS</span>
            </div>
          </div>

      </div>

    api.getHrmDetails().then(function(employees) {
      hrmViews.cachedEmployees = employees;
      var total = employees.length;
      var active = employees.filter(function(e) { return e.status === 'Active'; }).length;
      var ext = employees.filter(function(e) { return e.status === 'Extension'; }).length;
      var ret = employees.filter(function(e) { return e.status === 'Retired'; }).length;

      document.getElementById('dash-stat-total').textContent = total;
      document.getElementById('dash-stat-active').textContent = active + ext;
      document.getElementById('dash-stat-ext').textContent = ext > 0 ? '(' + ext + ' on Extension)' : 'Full Active Duty';
      document.getElementById('dash-stat-retired').textContent = ret;

      var pgMap = {};
      employees.forEach(function(e) {
        var pg = e.pay_group || 'Unassigned';
        pgMap[pg] = (pgMap[pg] || 0) + 1;
      });

      var barsContainer = document.getElementById('dash-pg-bars');
      if (barsContainer) {
        var html = '';
        var maxCount = 1;
        for (var k in pgMap) { if (pgMap[k] > maxCount) maxCount = pgMap[k]; }

        for (var pgKey in pgMap) {
          var count = pgMap[pgKey];
          var pct = Math.round((count / maxCount) * 100);
          html += `
            <div style="display: flex; align-items: center; font-size: 0.85rem;">

              </div>
              <span style="width: 45px; text-align: right; font-weight: 800; color: var(--text-primary);">${count}</span>
            </div>
          `;
        }
        barsContainer.innerHTML = html || '<div style="font-size: 0.875rem; color: var(--text-muted); text-align: center;">No pay group records found.</div>';
      }
    });

    api.getPromotionBatches().then(function(batches) {
      var promoCount = document.getElementById('dash-stat-promos');
      if (promoCount) promoCount.textContent = batches.length;
    });

  // =========================================================================
  // SUBMENU 2: INPUT RECORDS (Selectable List -> Form with Save)
  // =========================================================================
  // =========================================================================
  // SUBMENU 2: INPUT RECORDS (Single Line Form Tabs -> Instant Form View)
  // =========================================================================
  currentInputFormKey: 'placements',

  renderInputRecords: function(formKey) {
    this.activeView = 'input';
    var mount = document.getElementById('hrm-content-mount');
    if (!mount) return;

    var selectedKey = formKey || this.currentInputFormKey || 'placements';
    this.currentInputFormKey = selectedKey;

    var html = `
      <div style="padding: 1rem 1.25rem; width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto;">
        <!-- Single-Line Form Button Tabs Bar -->
        <div class="form-tabs-bar" id="hrm-input-tabs-bar">
    `;

    HRM_FORM_SEQUENCE.forEach(function(item) {
      var isActive = item.key === selectedKey ? 'active' : '';
      html += `
        <button type="button" class="form-tab-btn ${isActive}" data-form="${item.key}" onclick="hrmViews.switchInputForm('${item.key}')">
          <span class="material-icons">${item.icon || 'edit_document'}</span>
          <span>${item.name}</span>
        </button>
      `;
    });

    html += `
        </div>
        <!-- Active Form Mount Stage -->
        <div id="hrm-input-form-stage" style="flex: 1;"></div>
      </div>
    `;

    mount.innerHTML = html;
    this.openInputForm(selectedKey);
  },

  switchInputForm: function(formKey) {
    this.currentInputFormKey = formKey;
    document.querySelectorAll('#hrm-input-tabs-bar .form-tab-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.form === formKey);
    });
    this.openInputForm(formKey);
  },

  openInputForm: function(formKey) {
    var schema = AppSchemas[formKey];
    if (!schema) return app.toast('Schema not found for ' + formKey, 'error');

    var mount = document.getElementById('hrm-input-form-stage');
    if (!mount) return;

    var isPromotion = formKey === 'promotions';

    var html = `
      <div class="form-shell-container animate-scale-up">
        <div class="form-shell-header">
          <div style="display: flex; align-items: center; gap: 0.65rem; min-width: 0;">
            <div style="width: 32px; height: 32px; border-radius: var(--radius-sm); background: rgba(45, 212, 191, 0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span class="material-icons" style="color: var(--brand-teal-light); font-size: 1.2rem;">edit_note</span>
            </div>
            <div style="min-width: 0;">
              <h3 style="font-size: 0.9375rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1.25; margin: 0; color: #ffffff;">${schema.title}</h3>

          </div>
          <div style="display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;">
            <span style="background: rgba(45, 212, 191, 0.12); color: var(--brand-teal-light); border: 1px solid rgba(45, 212, 191, 0.3); font-size: 0.65rem; font-weight: 800; padding: 0.18rem 0.55rem; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 4px;">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--brand-teal-light); display: inline-block;"></span> DATA INPUT FORM
            </span>
          </div>
        </div>

        <form id="dynamic-input-form" style="padding: 0.85rem 1.1rem; display: flex; flex-direction: column; gap: 0.6rem;" onsubmit="hrmViews.handleFormSubmit(event, '${formKey}')">
    `;

    // Special Bulk Entry Checkbox for Promotion Form
    if (isPromotion) {
      html += `
        <div style="padding: 0.75rem; background: var(--brand-teal-light); border: 1px solid var(--brand-teal); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <span class="material-icons" style="color: var(--brand-teal-dark);">group_add</span>
            <div>
              <h4 style="font-size: 0.75rem; font-weight: 800; color: #042f2e; text-transform: uppercase;">Multiple Employees Promotion Entry</h4>
              <p style="font-size: 0.6875rem; color: #115e59;">Check this box to input multiple Staff IDs separated by commas on the same promotion date</p>
            </div>
          </div>
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: #042f2e;">
            <input type="checkbox" id="promo-bulk-toggle" style="width: 16px; height: 16px;" onchange="hrmViews.togglePromotionBulkMode(this.checked)">
            <span>Multiple Entry</span>
          </label>
        </div>
      `;
    }

    html += `<div class="form-two-column-grid">`;

    schema.fields.forEach(function(field) {
      var isFullWidth = field.type === 'textarea' || field.name === 'remarks' || field.name === 'reference_no';
      var fullClass = isFullWidth ? 'full-width' : '';

      html += `
        <div class="form-group ${fullClass}" id="group-${field.name}">
          <label>${field.label} ${field.required ? '<span style="color: var(--status-danger);">*</span>' : ''}</label>
      `;

      if (field.type === 'select') {
        html += `<select name="${field.name}" id="field-${field.name}" class="form-input" ${field.required ? 'required' : ''}>`;
        html += `<option value="">-- ${field.placeholder || 'Select ' + field.label} --</option>`;
        if (field.options) {
          field.options.forEach(function(opt) {
            html += `<option value="${opt}">${opt}</option>`;
          });
        }
        html += `</select>`;
      } else if (field.type === 'dependable_select') {
        html += `<select name="${field.name}" id="field-${field.name}" class="form-input" ${field.required ? 'required' : ''}>`;
        html += `<option value="">-- ${field.placeholder || 'Select ' + field.label} --</option>`;
        html += `</select>`;
      } else if (field.type === 'universal_date') {
        html += `<input type="text" name="${field.name}" id="field-${field.name}" class="form-input universal-date-field" placeholder="${field.placeholder || '20102022'}" ${field.required ? 'required' : ''} />`;
      } else if (field.type === 'checkbox') {
        html += `

            <input type="checkbox" name="${field.name}" id="field-${field.name}" style="width: 16px; height: 16px;" ${field.default ? 'checked' : ''} />

      } else if (field.type === 'image_upload') {
        html += `

            <input type="file" id="field-${field.name}-file" accept="image/*" class="form-input" style="padding: 0.35rem;" onchange="hrmViews.handleImagePreview(this, 'field-${field.name}')" />

            <div id="field-${field.name}-preview" style="width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); background: var(--surface-alt); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
              <span class="material-icons" style="color: var(--text-muted); font-size: 16px;">image</span>

      } else {
        html += `<input type="${field.type || 'text'}" name="${field.name}" id="field-${field.name}" class="form-input" placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''} ${field.readonly ? 'readonly' : ''} />`;
      }

    });

    if (isPromotion) {
      html += `
        <div id="promo-bulk-staff-box" class="form-group full-width" style="display: none; flex-direction: column;">
          <label style="color: var(--brand-teal-dark);">

          <textarea name="multiple_staff_id" id="field-multiple_staff_id" rows="3" class="form-input" placeholder="e.g. 1001, 1004, 1025, 1088, 1092"></textarea>
          <span style="font-size: 0.6875rem; color: var(--text-muted); margin-top: 0.25rem;">Seniority sequence numbers (1, 2, 3...) will be assigned automatically in the order written.</span>
        </div>
      `;
    }

    html += `
          </div>

          <div class="form-shell-footer">
            <button type="button" class="btn-cancel" onclick="document.getElementById('dynamic-input-form').reset()">
              <span class="material-icons" style="font-size: 16px;">restart_alt</span>
              <span>Reset</span>
            </button>
            <button type="submit" id="btn-form-save" class="btn-primary-action">
              <span class="material-icons" style="font-size: 16px;">save</span>
              <span>Save Record</span>
            </button>
          </div>
        </form>
      </div>
    `;

    mount.innerHTML = html;

    document.querySelectorAll('.universal-date-field').forEach(function(inp) {
      Components.attachUniversalDateMask(inp);
    });

    this.populateFormSelects(schema);
  },

  populateFormSelects: async function(schema) {
    var self = this;
    if (!self.masterData) {
      try {
        self.masterData = await api.getMasterData();
      } catch (e) {
        console.warn('Initial masterData load in populateFormSelects:', e);
      }
    }

    for (var i = 0; i < schema.fields.length; i++) {
      var f = schema.fields[i];
      if (f.type === 'select' && f.source) {
        var sel = document.getElementById('field-' + f.name);
        if (!sel) continue;

        var list = (self.masterData && self.masterData[f.source]) || [];
        if (!list || list.length === 0) {
          try {
            list = await api.read(f.source);
            if (!self.masterData) self.masterData = {};
            self.masterData[f.source] = list;
          } catch(err) {
            console.warn('Fallback read for ' + f.source + ':', err);
          }
        }

        if (list && list.length > 0) {
          sel.innerHTML = `<option value="">-- ${f.placeholder || 'Select ' + f.label} --</option>`;
          var seen = {};
          list.forEach(function(item) {
            var val = item[f.sourceKey] || item.id || item.code || item[Object.keys(item)[0]];
            var disp = item[f.sourceDisplay] || item.name || val;
            if (f.source === 'work_locations') {
              var stnTag = (item.station_id || item.station_code) ? '[' + (item.station_id || item.station_code) + '] ' : '';
              disp = stnTag + (item.location_name || item.location_code || val);
            } else if (f.source === 'organization_units') {
              disp = (item.unit_name || item.unit_code || val) + (item.unit_type ? ' [' + item.unit_type + ']' : '');
            } else if (f.source === 'pay_groups') {
              disp = (item.designation || item.pay_group || val) + (item.pay_group ? ' (' + item.pay_group + ')' : '');
            } else if (f.source === 'employees') {
              disp = (item.name || item.staff_id) + ' (' + item.staff_id + ')';
            } else if (f.source === 'stations') {
              disp = (item.station_code ? '[' + item.station_code + '] ' : '') + (item.station_name || val);
            } else if (f.source === 'disciplinary_cases') {
              disp = 'Case #' + (item.case_id || val) + (item.case_type ? ' (' + item.case_type + ')' : '') + (item.staff_id ? ' - Staff: ' + item.staff_id : '');
            }
            if (val && !seen[val]) {
              seen[val] = true;
              var opt = document.createElement('option');
              opt.value = val;
              opt.textContent = disp || val;
              sel.appendChild(opt);
            }
          });
        }
      }
    }

    var stationSelect = document.getElementById('field-station_code');
    if (schema.table === 'placements') {
      var plLocSelect = document.getElementById('field-location_id');
      var plStnGroup = document.getElementById('group-station_code');
      if (plLocSelect) {
        plLocSelect.addEventListener('change', function() {
          var locVal = this.value;
          var locList = (self.masterData && self.masterData.work_locations) || [];
          var matchedLoc = locList.find(function(l) {
            return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(locVal).trim().toLowerCase();
          });
          var stnList = (self.masterData && self.masterData.stations) || [];
          var matchedStn = null;
          if (matchedLoc) {
            var stnId = matchedLoc.station_id || matchedLoc.station_code || '';
            if (stnId) {
              matchedStn = stnList.find(function(s) {
                return String(s.station_id || s.station_code || '').trim().toLowerCase() === String(stnId).trim().toLowerCase();
              });
            }
            if (!matchedStn && matchedLoc.location_city) {
              matchedStn = stnList.find(function(s) {
                return String(s.station_location || '').trim().toLowerCase() === String(matchedLoc.location_city).trim().toLowerCase();
              });
            }
          }

          var stnVal = matchedStn ? (matchedStn.station_code || matchedStn.station_id) : (matchedLoc ? matchedLoc.station_id : '');
          if (stationSelect && stnVal) {
            stationSelect.value = stnVal;
            hrmViews.updatePlacementDependents(stnVal);
            if (plStnGroup) plStnGroup.style.display = 'block';
          } else if (stationSelect) {
            hrmViews.updatePlacementDependents(stationSelect.value || '');
          }
        });
      }

      if (stationSelect) {
        stationSelect.addEventListener('change', function() {
          hrmViews.updatePlacementDependents(this.value);
        });
        this.updatePlacementDependents(stationSelect.value);
      } else {
        this.updatePlacementDependents('');
      }
    }

    // Dynamic Station Requirement & Linkage for Postings Form
    if (schema.table === 'postings') {
      var locSelect = document.getElementById('field-location_id');
      var stnSelect = document.getElementById('field-station_code');
      var stnGroup = document.getElementById('group-station_code');

      var updatePostingStationState = function() {
        var locVal = locSelect ? locSelect.value : '';
        var locList = (self.masterData && self.masterData.work_locations) || [];
        var matchedLoc = locList.find(function(l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(locVal).trim().toLowerCase();
        });

        var stnList = (self.masterData && self.masterData.stations) || [];
        var matchedStn = null;
        if (matchedLoc) {
          if (matchedLoc.station_id) {
            matchedStn = stnList.find(function(s) {
              return String(s.station_id || s.station_code || '').trim().toLowerCase() === String(matchedLoc.station_id).trim().toLowerCase();
            });
          }
          if (!matchedStn && matchedLoc.location_city) {
            matchedStn = stnList.find(function(s) {
              return String(s.station_location || '').trim().toLowerCase() === String(matchedLoc.location_city).trim().toLowerCase();
            });
          }
        }

        if (matchedStn) {
          var stnVal = matchedStn.station_code || matchedStn.station_id;
          if (stnSelect) {
            stnSelect.value = stnVal;
          }
          if (stnGroup) {
            stnGroup.style.display = 'block';
            var lbl = stnGroup.querySelector('label');
            if (lbl) {
              lbl.innerHTML = 'Station <span style="font-size: 0.725rem; color: var(--text-muted);">(Airport)</span>';
            }
          }
        } else {
          // Non-airport location (e.g. Head Office Balaka, Motijheel Sales Office)
          if (stnSelect) {
            stnSelect.value = '';
          }
          if (stnGroup) {
            // Automatically remain unpopulated or hidden
            stnGroup.style.display = 'none';
          }
        }
      };

      if (locSelect) {
        locSelect.addEventListener('change', updatePostingStationState);
        if (locSelect.value) {
          updatePostingStationState();
        } else if (stnGroup) {
          stnGroup.style.display = 'none';
        }
      }
    }

    // Dynamic Auto-fill & Breadcrumb for Employee Actions Form
    if (schema.table === 'employee_actions') {
      var actStaffInp = document.getElementById('field-staff_id');
      var fromUnitSel = document.getElementById('field-from_org_unit_id');
      var fromPgSel = document.getElementById('field-from_pay_group_id');
      var fromDesigInp = document.getElementById('field-from_designation');
      var toUnitSel = document.getElementById('field-to_org_unit_id');
      var actionTypeSel = document.getElementById('field-action_type');
      var discGroup = document.getElementById('group-disciplinary_case_id');

      if (actionTypeSel && discGroup) {
        var toggleDiscCase = function() {
          var isDowngrade = actionTypeSel.value === 'DOWNGRADE';
          discGroup.style.display = isDowngrade ? 'block' : 'none';
        };
        actionTypeSel.addEventListener('change', toggleDiscCase);
        toggleDiscCase();
      }

      if (actStaffInp) {
        actStaffInp.addEventListener('blur', async function() {
          var sid = this.value.trim().toUpperCase();
          if (!sid) return;
          var empList = hrmViews.cachedEmployees || [];
          if (!empList.length) {
            try {
              empList = await api.getHrmDetails();
              hrmViews.cachedEmployees = empList;
            } catch(e) {}
          }
          var matchedEmp = empList.find(function(e) {
            return String(e.staff_id || '').trim().toUpperCase() === sid;
          });
          if (matchedEmp) {
            if (fromPgSel && matchedEmp.pay_group) {
              fromPgSel.value = matchedEmp.pay_group;
            }
            if (fromDesigInp && matchedEmp.designation) {
              fromDesigInp.value = matchedEmp.designation;
            }
            if (fromUnitSel && (matchedEmp.department_code || matchedEmp.dep_id)) {
              var uCode = String(matchedEmp.department_code || matchedEmp.dep_id).trim().toUpperCase();
              var orgUnits = (self.masterData && self.masterData.organization_units) || [];
              var matchedU = orgUnits.find(function(u) {
                return String(u.unit_code || u.unit_id || '').trim().toUpperCase() === uCode;
              });
              if (matchedU) {
                fromUnitSel.value = matchedU.unit_id;
              }
            }
          }
        });
      }

      if (toUnitSel) {
        var breadcrumbEl = document.getElementById('action-ancestry-breadcrumb');
        if (!breadcrumbEl) {
          breadcrumbEl = document.createElement('div');
          breadcrumbEl.id = 'action-ancestry-breadcrumb';
          breadcrumbEl.style.cssText = 'font-size: 0.72rem; color: var(--brand-teal-light); margin-top: 4px; font-weight: 600;';
          toUnitSel.parentNode.appendChild(breadcrumbEl);
        }
        toUnitSel.addEventListener('change', function() {
          var val = this.value;
          if (!val) {
            breadcrumbEl.innerHTML = '';
            return;
          }
          api.read('organization_units').then(function(units) {
            var map = {};
            (units || []).forEach(function(u) { map[u.unit_id] = u; });
            var chain = [];
            var curr = map[val];
            while (curr) {
              chain.unshift((curr.unit_name || curr.unit_code) + ' [' + (curr.unit_type || 'UNIT') + ']');
              curr = curr.parent_unit_id ? map[curr.parent_unit_id] : null;
            }
            breadcrumbEl.innerHTML = '<span style="color: var(--text-muted);">Directorate Ancestry:</span> ' + chain.join(' ➔ ');
          });
        });
      }
    }
  },

  updatePlacementDependents: async function(stationCode) {
    var self = this;
    if (!self.masterData) {
      try {
        self.masterData = await api.getMasterData();
      } catch (e) {
        self.masterData = {};
      }
    }

    var secSelect = document.getElementById('field-sec_letterCode');
    var shiftSelect = document.getElementById('field-shift_name');

    if (secSelect) {
      secSelect.innerHTML = '<option value="">-- Select Section --</option>';
      var sections = (self.masterData && self.masterData.sections) || [];
      if (!sections.length) {
        try {
          sections = await api.read('sections');
          if (self.masterData) self.masterData.sections = sections;
        } catch(e) {}
      }
      var seenSec = {};
      sections.forEach(function(s) {
        var sStn = s.station_code || s.station_id || '';
        if (!stationCode || !sStn || sStn === stationCode) {
          var val = s.sec_letter_code || s.sec_code || s.sec_name;
          if (val && !seenSec[val]) {
            seenSec[val] = true;
            var opt = document.createElement('option');
            opt.value = val;
            opt.textContent = s.sec_name || val;
            secSelect.appendChild(opt);
          }
        }
      });
    }

    if (shiftSelect) {
      shiftSelect.innerHTML = '<option value="">-- Select Shift --</option>';
      var shifts = (self.masterData && self.masterData.shifts) || [];
      if (!shifts.length) {
        try {
          shifts = await api.read('shifts');
          if (self.masterData) self.masterData.shifts = shifts;
        } catch(e) {}
      }
      var seenShf = {};
      shifts.forEach(function(sh) {
        var sStn = sh.station_code || sh.station_id || '';
        if (!stationCode || !sStn || sStn === stationCode) {
          var val = sh.shift_name || sh.shift_code;
          if (val && !seenShf[val]) {
            seenShf[val] = true;
            var opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val + (sh.timing ? ` [${sh.timing}]` : '');
            shiftSelect.appendChild(opt);
          }
        }
      });
    }
  },

  togglePromotionBulkMode: function(isBulk) {
    var staffGroup = document.getElementById('group-staff_id');
    var bulkBox = document.getElementById('promo-bulk-staff-box');
    var staffInput = document.getElementById('field-staff_id');
    var bulkInput = document.getElementById('field-multiple_staff_id');

    if (isBulk) {
      if (staffGroup) staffGroup.style.display = 'none';
      if (bulkBox) bulkBox.style.display = 'flex';
      if (staffInput) staffInput.removeAttribute('required');
      if (bulkInput) bulkInput.setAttribute('required', 'true');
    } else {
      if (staffGroup) staffGroup.style.display = 'flex';
      if (bulkBox) bulkBox.style.display = 'none';
      if (staffInput) staffInput.setAttribute('required', 'true');
      if (bulkInput) bulkInput.removeAttribute('required');
    }
  },

  handleImagePreview: function(inputEl, targetFieldId) {
    if (inputEl.files && inputEl.files[0]) {
      var file = inputEl.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64 = e.target.result;
        document.getElementById(targetFieldId).value = base64;
        var prevBox = document.getElementById(targetFieldId + '-preview');
        if (prevBox) {
          prevBox.innerHTML = `<img src="${base64}" style="width: 100%; height: 100%; object-fit: cover;" />`;
        }
      };
      reader.readAsDataURL(file);
    }
  },

  handleFormSubmit: function(e, formKey) {
    e.preventDefault();
    var schema = AppSchemas[formKey];
    var form = document.getElementById('dynamic-input-form');
    var formData = new FormData(form);
    var payload = {};

    formData.forEach(function(val, key) { payload[key] = val; });

    var checkboxes = form.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
      if (cb.name) payload[cb.name] = cb.checked;
    });

    if (formKey === 'placements') {
      if (payload.location_id && this.masterData && this.masterData.work_locations) {
        var matchedPlcLoc = this.masterData.work_locations.find(function(l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(payload.location_id).trim().toLowerCase();
        });
        if (matchedPlcLoc) {
          payload.station_code = matchedPlcLoc.station_id || matchedPlcLoc.station_code || payload.station_code || '';
        }
      }
      if (payload.organization_unit_id && this.masterData && this.masterData.organization_units) {
        var matchedPlcUnit = this.masterData.organization_units.find(function(u) {
          return String(u.unit_id || u.unit_code || '').trim().toLowerCase() === String(payload.organization_unit_id).trim().toLowerCase();
        });
        if (matchedPlcUnit) {
          payload.sec_letterCode = matchedPlcUnit.letter_code || matchedPlcUnit.unit_code || payload.sec_letterCode || '';
        }
      }
    }

    if (formKey === 'postings') {
      if (payload.location_id && this.masterData && this.masterData.work_locations) {
        var matchedLoc = this.masterData.work_locations.find(function(l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(payload.location_id).trim().toLowerCase();
        });
        if (matchedLoc) {
          payload.location_city = matchedLoc.location_city || '';
          if (!payload.station_code) payload.station_code = matchedLoc.station_id || matchedLoc.station_code || '';
        }
      }
      if (payload.effective_from && !payload.posting_date) {
        payload.posting_date = payload.effective_from;
      }
    }

    if (formKey === 'employee_actions') {
      if (payload.staff_id) {
        var empUpdatePayload = {};
        if (payload.to_pay_group_id) {
          empUpdatePayload.pay_group = payload.to_pay_group_id;
        }
        if (payload.to_org_unit_id && this.masterData && this.masterData.organization_units) {
          var targetUnit = this.masterData.organization_units.find(function(u) {
            return String(u.unit_id || '').trim().toLowerCase() === String(payload.to_org_unit_id).trim().toLowerCase();
          });
          if (targetUnit) {
            empUpdatePayload.department_code = targetUnit.unit_code || targetUnit.unit_id;
            empUpdatePayload.dep_id = targetUnit.unit_id;
            if (targetUnit.parent_unit_id) {
              empUpdatePayload.dir_id = targetUnit.parent_unit_id;
            }
          }
        }
        if (Object.keys(empUpdatePayload).length > 0) {
          api.read('employees').then(function(emps) {
            var foundE = emps.find(function(e) {
              return String(e.staff_id || '').trim().toUpperCase() === String(payload.staff_id).trim().toUpperCase();
            });
            if (foundE) {
              api.update('employees', 'emp_id', foundE.emp_id, empUpdatePayload).catch(function(e) {
                console.warn('Syncing employee action to employee table:', e);
              });
            }
          });
        }
      }
    }

    var saveBtn = document.getElementById('btn-form-save');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span class="material-icons animate-spin" style="font-size: 16px;">sync</span> <span>Saving...</span>`;
    }

    api.create(schema.table, payload, schema.prefix, schema.pk).then(function(savedRec) {
      app.toast('Record successfully saved into ' + schema.title + '!', 'success');
      form.reset();
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span class="material-icons" style="font-size: 16px;">save</span> <span>Save Record</span>`;
      }

      // Rapid Live Database Sync: Re-fetch master data and employee records immediately
      api.getMasterData(true).then(function(md) {
        hrmViews.masterData = md;
      });
      api.getHrmDetails(true).then(function(recs) {
        hrmViews.cachedEmployees = recs;
        if (hrmViews.activeView === 'employees') {
          hrmViews.renderSpreadsheetTable();
        } else if (hrmViews.activeView === 'dashboard') {
          hrmViews.renderDashboard();
        }
      });
      if (hrmViews.gridDataCache && hrmViews.gridDataCache[formKey]) {
        hrmViews.loadGridData(formKey, true);
      }
    }).catch(function(err) {
      if (err.isDuplicate || (err.message && (err.message.indexOf('already exists') !== -1 || err.message.indexOf('Duplicate') !== -1))) {
        Components.showDuplicateModal(err.message, 'Form: ' + schema.title);
      } else {
        app.toast('Save failed: ' + err.message, 'error');
      }
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span class="material-icons" style="font-size: 16px;">save</span> <span>Save Record</span>`;
      }
    });
  },

  gridDataCache: {},
  gridCurrentPage: 1,
  gridPageSize: 20,
  gridSearchTerm: '',
  gridSearchBy: 'name',

  loadGridData: function(formKey, forceRefresh) {
    var self = this;
    var schema = AppSchemas[formKey];
    api.read(schema.table, !!forceRefresh).then(function(records) {
      self.gridDataCache[formKey] = Array.isArray(records) ? records : [];
      self.gridCurrentPage = 1;
      self.renderGridRows(formKey);
    }).catch(function(err) {
      var tbody = document.getElementById('grid-table-tbody');
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="${(schema.fields || []).length + 3}" style="text-align: center; padding: 2rem; color: var(--status-danger);">Failed to load records: ${err.message}</td></tr>`;
      }
      app.toast('Failed to load records: ' + err.message, 'error');
    });
  },

  renderGridRows: function(formKey) {
    var schema = AppSchemas[formKey];
    var all = this.gridDataCache[formKey] || [];
    var tbody = document.getElementById('grid-table-tbody');
    if (!tbody) return;

    var filtered = all;
    if (this.gridSearchTerm) {
      var term = this.gridSearchTerm.toLowerCase();
      var by = this.gridSearchBy;
      filtered = all.filter(function(r) {
        if (by === 'staff_id') {
          return String(r.staff_id || r.emp_id || '').toLowerCase().includes(term);
        } else if (by === 'name') {
          return String(r.emp_name || r.name || r.full_name || '').toLowerCase().includes(term);
        } else {
          return Object.values(r).some(function(v) {
            return String(v || '').toLowerCase().includes(term);
          });
        }
      });
    }

    var totalRows = filtered.length;
    var pageSize = this.gridPageSize === 'ALL' ? totalRows : parseInt(this.gridPageSize, 10);
    var totalPages = Math.max(1, Math.ceil(totalRows / (pageSize || 1)));
    if (this.gridCurrentPage > totalPages) this.gridCurrentPage = totalPages;

    var start = (this.gridCurrentPage - 1) * pageSize;
    var pageSlice = this.gridPageSize === 'ALL' ? filtered : filtered.slice(start, start + pageSize);

    var infoEl = document.getElementById('grid-page-info');
    if (infoEl) infoEl.textContent = `Page ${this.gridCurrentPage} of ${totalPages} (${totalRows} records)`;

    var prevBtn = document.getElementById('btn-grid-prev');
    var nextBtn = document.getElementById('btn-grid-next');
    if (prevBtn) prevBtn.disabled = this.gridCurrentPage <= 1;
    if (nextBtn) nextBtn.disabled = this.gridCurrentPage >= totalPages;

    var colCount = schema.fields.length + 3;

    if (pageSlice.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">No records found.</td></tr>`;
      return;
    }

    var html = '';
    pageSlice.forEach(function(row, idx) {
      var sl = start + idx + 1;
      var pkVal = row[schema.pk] || row.id || ('#' + sl);

      html += `
        <tr>
          <td style="text-align: center; font-weight: 700; color: var(--text-muted);">${sl}</td>
          <td style="font-weight: 700; color: var(--brand-teal); font-family: monospace;">${pkVal}</td>
      `;

      schema.fields.forEach(function(f) {
        var cellVal = row[f.name];
        if (cellVal === undefined || cellVal === null || cellVal === '') {
          cellVal = '-';
        } else {
          var md = hrmViews.masterData || {};
          if (f.name === 'location_id' && md.work_locations) {
            var matchedL = md.work_locations.find(function(l) {
              return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(cellVal).trim().toLowerCase();
            });
            if (matchedL) {
              var stnTag = (matchedL.station_id || matchedL.station_code) ? '[' + (matchedL.station_id || matchedL.station_code) + '] ' : '';
              cellVal = stnTag + (matchedL.location_name || matchedL.location_code || cellVal);
            }
          } else if ((f.name === 'organization_unit_id' || f.name === 'from_org_unit_id' || f.name === 'to_org_unit_id') && md.organization_units) {
            var matchedU = md.organization_units.find(function(u) {
              return String(u.unit_id || u.unit_code || '').trim().toLowerCase() === String(cellVal).trim().toLowerCase();
            });
            if (matchedU) {
              cellVal = (matchedU.unit_name || matchedU.unit_code) + (matchedU.unit_type ? ' [' + matchedU.unit_type + ']' : '');
            }
          } else if (f.name === 'staff_id' && md.employees) {
            var matchedE = md.employees.find(function(e) {
              return String(e.staff_id || '').trim().toLowerCase() === String(cellVal).trim().toLowerCase();
            });
            if (matchedE) {
              cellVal = (matchedE.name || matchedE.staff_id) + ' (' + cellVal + ')';
            }
          }
        }

        if (f.type === 'image_upload' && cellVal !== '-') {
          html += `<td style="white-space: nowrap;"><img src="${cellVal}" style="width: 28px; height: 28px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-light);" /></td>`;
        } else if (f.type === 'checkbox') {
          var isChecked = cellVal === true || cellVal === 'true';
          html += `<td style="white-space: nowrap;"><span class="kpi-subtext" style="color: ${isChecked ? 'var(--status-success)' : 'var(--text-muted)'}; font-weight: 700;">${isChecked ? 'Yes' : 'No'}</span></td>`;
        } else {
          html += `<td style="white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;" title="${String(cellVal).replace(/"/g, '&quot;')}">${cellVal}</td>`;
        }
      });

      html += `
          <td style="text-align: right; padding-right: 1.25rem; white-space: nowrap; position: sticky; right: 0; background-color: var(--surface-card); box-shadow: -2px 0 4px rgba(0,0,0,0.05);">
            <button type="button" class="btn-table-edit" onclick="hrmViews.openRecordEditView('${formKey}', '${pkVal}')" title="Edit this record">
              <span class="material-icons" style="font-size: 13px;">edit</span>
              <span>Edit</span>
            </button>
            <button type="button" class="btn-table-delete" style="margin-left: 0.3rem;" onclick="hrmViews.confirmRecordDelete('${formKey}', '${pkVal}')" title="Delete this record">
              <span class="material-icons" style="font-size: 13px;">delete</span>
              <span>Delete</span>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  },

  executeGridSearch: function(formKey) {

  populateEditSelects: async function(schema, row) {
    var self = this;
    if (!self.masterData) {
      try {
        self.masterData = await api.getMasterData();
      } catch (e) {
        self.masterData = {};
      }
    }

    for (var i = 0; i < schema.fields.length; i++) {
      var f = schema.fields[i];
      if ((f.type === 'select' || f.type === 'dependable_select') && f.source) {
        var sel = document.getElementById('edit-field-' + f.name);
        if (!sel) continue;
        var currentVal = String(row[f.name] !== undefined && row[f.name] !== null ? row[f.name] : '');
        var list = (self.masterData && self.masterData[f.source]) || [];
        if (!list || list.length === 0) {
          try {
            list = await api.read(f.source);
            if (!self.masterData) self.masterData = {};
            self.masterData[f.source] = list;
          } catch(err) {}
        }
        if (list && list.length > 0) {
          sel.innerHTML = `<option value="">-- ${f.placeholder || 'Select ' + f.label} --</option>`;
          var seen = {};
          var matchedCurrent = false;
          list.forEach(function(item) {
            var val = item[f.sourceKey] || item.id || item.code || item[Object.keys(item)[0]];
            var disp = item[f.sourceDisplay] || item.name || val;
            if (f.source === 'work_locations') {
              var stnTag = (item.station_id || item.station_code) ? '[' + (item.station_id || item.station_code) + '] ' : '';
              disp = stnTag + (item.location_name || item.location_code || val);
            } else if (f.source === 'organization_units') {
              disp = (item.unit_name || item.unit_code || val) + (item.unit_type ? ' [' + item.unit_type + ']' : '');
            } else if (f.source === 'pay_groups') {
              disp = (item.designation || item.pay_group || val) + (item.pay_group ? ' (' + item.pay_group + ')' : '');
            } else if (f.source === 'employees') {
              disp = (item.name || item.staff_id) + ' (' + item.staff_id + ')';
            } else if (f.source === 'stations') {
              disp = (item.station_code ? '[' + item.station_code + '] ' : '') + (item.station_name || val);
            } else if (f.source === 'disciplinary_cases') {
              disp = 'Case #' + (item.case_id || val) + (item.case_type ? ' (' + item.case_type + ')' : '') + (item.staff_id ? ' - Staff: ' + item.staff_id : '');
            }
            if (val && !seen[val]) {
              seen[val] = true;
              var opt = document.createElement('option');
              opt.value = val;
              opt.textContent = disp || val;
              if (String(val).trim().toLowerCase() === currentVal.trim().toLowerCase()) {
                opt.selected = true;
                matchedCurrent = true;
              }
              sel.appendChild(opt);
            }
          });
          if (currentVal && !matchedCurrent) {
            var customOpt = document.createElement('option');
            customOpt.value = currentVal;
            customOpt.textContent = currentVal;
            customOpt.selected = true;
            sel.appendChild(customOpt);
          }
        }
      }
    }
  },

  handleEditSubmit: function(e, formKey, pkValue) {
    e.preventDefault();
    var schema = AppSchemas[formKey];
    var form = document.getElementById('edit-record-form');
    var formData = new FormData(form);
    var payload = {};

    formData.forEach(function(val, key) { payload[key] = val; });
    var checkboxes = form.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(function(cb) { if (cb.name) payload[cb.name] = cb.checked; });

    if (formKey === 'placements') {
      if (payload.location_id && this.masterData && this.masterData.work_locations) {
        var matchedPlcLoc = this.masterData.work_locations.find(function(l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(payload.location_id).trim().toLowerCase();
        });
        if (matchedPlcLoc) {
          payload.station_code = matchedPlcLoc.station_id || matchedPlcLoc.station_code || payload.station_code || '';
        }
      }
      if (payload.organization_unit_id && this.masterData && this.masterData.organization_units) {
        var matchedPlcUnit = this.masterData.organization_units.find(function(u) {
          return String(u.unit_id || u.unit_code || '').trim().toLowerCase() === String(payload.organization_unit_id).trim().toLowerCase();
        });
        if (matchedPlcUnit) {
          payload.sec_letterCode = matchedPlcUnit.letter_code || matchedPlcUnit.unit_code || payload.sec_letterCode || '';
        }
      }
    }

    if (formKey === 'postings') {
      if (payload.location_id && this.masterData && this.masterData.work_locations) {
        var matchedLoc = this.masterData.work_locations.find(function(l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(payload.location_id).trim().toLowerCase();
        });
        if (matchedLoc) {
          payload.location_city = matchedLoc.location_city || '';
          if (!payload.station_code) payload.station_code = matchedLoc.station_id || matchedLoc.station_code || '';
        }
      }
      if (payload.effective_from && !payload.posting_date) {
        payload.posting_date = payload.effective_from;
      }
    }

    if (formKey === 'employee_actions') {
      if (payload.staff_id) {
        var empUpdatePayload2 = {};
        if (payload.to_pay_group_id) {
          empUpdatePayload2.pay_group = payload.to_pay_group_id;
        }
        if (payload.to_org_unit_id && this.masterData && this.masterData.organization_units) {
          var targetUnit2 = this.masterData.organization_units.find(function(u) {
            return String(u.unit_id || '').trim().toLowerCase() === String(payload.to_org_unit_id).trim().toLowerCase();
          });
          if (targetUnit2) {
            empUpdatePayload2.department_code = targetUnit2.unit_code || targetUnit2.unit_id;
            empUpdatePayload2.dep_id = targetUnit2.unit_id;
            if (targetUnit2.parent_unit_id) {
              empUpdatePayload2.dir_id = targetUnit2.parent_unit_id;
            }
          }
        }
        if (Object.keys(empUpdatePayload2).length > 0) {
          api.read('employees').then(function(emps) {
            var foundE2 = emps.find(function(e) {
              return String(e.staff_id || '').trim().toUpperCase() === String(payload.staff_id).trim().toUpperCase();
            });
            if (foundE2) {
              api.update('employees', 'emp_id', foundE2.emp_id, empUpdatePayload2).catch(function(e) {
                console.warn('Syncing employee action edit to employee table:', e);
              });
            }
          });
        }
      }
    }

    api.update(schema.table, schema.pk, pkValue, payload).then(function() {
      app.toast('Data successfully updated', 'success');
      hrmViews.openViewGrid(formKey);
      api.getMasterData(true).then(function(md) {
        hrmViews.masterData = md;
      });
      api.getHrmDetails(true).then(function(recs) {
        hrmViews.cachedEmployees = recs;
        if (hrmViews.activeView === 'employees') {
          hrmViews.renderSpreadsheetTable();
        } else if (hrmViews.activeView === 'dashboard') {
          hrmViews.renderDashboard();
        }
      });
    }).catch(function(err) {
      app.toast('Update failed: ' + err.message, 'error');
    });
  },

  renderSpreadsheetTable: function() {
    var self = this;
    var all = this.cachedEmployees || [];
    var view = this.currentEmpSubView;
    var filtered = all;

    var isPrecise = (view === 'precise');
    var isRetired = (view === 'retired');

    if (isRetired) {
      filtered = filtered.filter(function(e) { return e.status === 'Retired'; });
      // Arrange employees in Retirement tab so the most recent appears at the top
      filtered.sort(function(a, b) {
        var parseFn = (typeof Utils !== 'undefined' && Utils.parseDate) ? Utils.parseDate : function(d) { return new Date(d); };
        var dA = a.retirement_date ? parseFn(a.retirement_date) : 0;
        var dB = b.retirement_date ? parseFn(b.retirement_date) : 0;
        var tA = dA ? (dA.getTime ? dA.getTime() : new Date(dA).getTime()) : 0;
        var tB = dB ? (dB.getTime ? dB.getTime() : new Date(dB).getTime()) : 0;
        return tB - tA;
      });
    } else {
      // In Details List, Precise List, On Job, Officer & Sup, and TH:
      // STRICTLY EXCLUDE all retired employees!
      filtered = filtered.filter(function(e) { return e.status !== 'Retired'; });

      if (view === 'officer') {
        // Displays employees belonging to pay groups from 3(2) upwards
        filtered = filtered.filter(function(e) {
          return self.isOfficerOrSup(e);
        });
        // Sort descending by pay group rank, then by Seniority rank
        filtered.sort(function(a, b) {
          var rA = self.parsePayGroupRank(a.pay_group);
          var rB = self.parsePayGroupRank(b.pay_group);
          if (rB !== rA) return rB - rA;
          var sA = parseInt(a.seniority || 999, 10);
          var sB = parseInt(b.seniority || 999, 10);
          return sA - sB;
        });
      } else if (view === 'th') {
        // Displays only Pay Group 1 employees (Traffic Helpers)
        filtered = filtered.filter(function(e) {
          return self.isPayGroup1(e);
        });
        // Sort strictly by Seniority (determined by Date of Joining & Staff ID)
        filtered.sort(function(a, b) {
          var sA = parseInt(a.seniority || 999, 10);
          var sB = parseInt(b.seniority || 999, 10);
          if (sA !== sB) return sA - sB;
          var parseFn = (typeof Utils !== 'undefined' && Utils.parseDate) ? Utils.parseDate : function(d) { return new Date(d); };
          var dA = a.joining_date ? parseFn(a.joining_date) : 0;
          var dB = b.joining_date ? parseFn(b.joining_date) : 0;
          var tA = dA ? (dA.getTime ? dA.getTime() : new Date(dA).getTime()) : 0;
          var tB = dB ? (dB.getTime ? dB.getTime() : new Date(dB).getTime()) : 0;
          if (tA !== tB) return tA - tB;
          var staffA = String(a.staff_id || '').toUpperCase();
          var staffB = String(b.staff_id || '').toUpperCase();
          return staffA.localeCompare(staffB, undefined, { numeric: true });
        });
      }
    }

    if (this.currentEmpFilterPg !== 'ALL') {
      var pgVal = this.currentEmpFilterPg.toUpperCase();
      filtered = filtered.filter(function(e) { return String(e.pay_group || '').toUpperCase() === pgVal; });
    }
    if (this.currentEmpFilterPosting !== 'ALL') {
      var pstVal = this.currentEmpFilterPosting.toUpperCase();
      filtered = filtered.filter(function(e) { return String(e.posting || '').toUpperCase() === pstVal; });
    }

    var badge = document.getElementById('emp-count-badge');
    if (badge) badge.textContent = filtered.length + ' EMPLOYEES';

    var thead = document.getElementById('emp-spreadsheet-thead');
    var tbody = document.getElementById('emp-spreadsheet-tbody');
    if (!thead || !tbody) return;

    if (isPrecise) {
      thead.innerHTML = `

  exportSpreadsheetCSV: function() {
    var table = document.getElementById('employees-spreadsheet-table');
    if (!table) return;
    var rows = table.querySelectorAll('tr');
    var csv = [];
    rows.forEach(function(row) {
      var cols = row.querySelectorAll('th, td');
      var rowData = [];
      cols.forEach(function(col) {
        var text = col.innerText.replace(/"/g, '""');
        rowData.push('"' + text + '"');
      });
      csv.push(rowData.join(','));
    });
    var blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'Employees_Spreadsheet_' + new Date().toISOString().slice(0, 10) + '.csv';
    link.click();
  },

  printPromoReport: function() {
    var rep = this.cachedCurrentPromoRep;
    var origTitle = document.title;
    if (rep) {
      var cleanName = (rep.name || 'Employee').trim().replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
      document.title = rep.report_id || (cleanName + '_' + (rep.staff_id || ''));
    }
    window.print();
    setTimeout(function() {
      document.title = origTitle;
    }, 1000);
  },

  savePromoReportPDF: function() {
    if (!this.cachedCurrentPromoRep) return;
    var rep = this.cachedCurrentPromoRep;
    var origTitle = document.title;
    var cleanName = (rep.name || 'Employee').trim().replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    var filename = rep.report_id || (cleanName + '_' + (rep.staff_id || ''));
    document.title = filename;
    window.print();
    setTimeout(function() {
      document.title = origTitle;
    }, 1000);
  },

  downloadPromoReportWord: function() {
    var card = document.getElementById('printable-promo-report');
    if (!card) return;
    var rep = this.cachedCurrentPromoRep || {};
    var cleanName = (rep.name || 'Employee').trim().replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    var filename = (rep.report_id || (cleanName + '_' + (rep.staff_id || 'Promotion'))) + '.docx';
    var htmlContent = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head>
        <meta charset='utf-8'>
        <title>Promotion Progression Report</title>
        <style>
          body { font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff; color: #000000; }
          table { border-collapse: collapse; }
        </style>
      </head>
      <body>${card.innerHTML}</body>
      </html>
    `;
    var blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  },

  parseClientDate: function(val) {
    if (!val) return null;
    if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
    var s = String(val).trim();
    var m = s.match(/^(\d{1,2})[-\/\.]([A-Za-z]{3}|\d{1,2})[-\/\.](\d{4})/);
    if (m) {
      var d = parseInt(m[1], 10);
      var mPart = m[2];
      var y = parseInt(m[3], 10);
      var monthIdx = -1;
      if (/^\d+$/.test(mPart)) {
        monthIdx = parseInt(mPart, 10) - 1;
      } else {
        var months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
        monthIdx = months.indexOf(mPart.toLowerCase());
      }
      if (monthIdx >= 0 && monthIdx <= 11) {
        return new Date(y, monthIdx, d);
      }
    }
    var mIso = s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
    if (mIso) {
      return new Date(parseInt(mIso[1], 10), parseInt(mIso[2], 10) - 1, parseInt(mIso[3], 10));
    }
    var dt = new Date(s);
    return isNaN(dt.getTime()) ? null : dt;
  },

  cachedAllPromos: [],
  filterPromoAll: function() {
    var all = this.cachedAllPromos || [];
    var tbody = document.getElementById('promo-all-tbody');
    if (!tbody) return;

    var pgVal = document.getElementById('promo-all-filter-pg') ? document.getElementById('promo-all-filter-pg').value : 'ALL';
    var fromVal = document.getElementById('promo-all-from') ? document.getElementById('promo-all-from').value.trim() : '';
    var toVal = document.getElementById('promo-all-to') ? document.getElementById('promo-all-to').value.trim() : '';

    var filtered = all;
    if (pgVal !== 'ALL') {
      filtered = filtered.filter(function(p) {
        var prom = String(p.promoted_pg || p.promoted_pg_id || '').toUpperCase();
        return prom === pgVal.toUpperCase();
      });
    }

    if (fromVal) {
      var dFrom = hrmViews.parseClientDate(fromVal);
      if (dFrom) {
        filtered = filtered.filter(function(p) {
          var dP = hrmViews.parseClientDate(p.promotion_date);
          return dP && dP >= dFrom;
        });
      }
    }

    if (toVal) {
      var dTo = hrmViews.parseClientDate(toVal);
      if (dTo) {
        dTo.setHours(23, 59, 59, 999);
        filtered = filtered.filter(function(p) {
          var dP = hrmViews.parseClientDate(p.promotion_date);
          return dP && dP <= dTo;
        });
      }
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; padding: 2rem; color: var(--text-muted);">No promotion records match filter criteria.</td></tr>`;
      return;
    }

    var html = '';
    filtered.forEach(function(p, idx) {
      html += `
        <tr>
          <td style="text-align: center; font-weight: 700; color: var(--text-muted);">${p.sl || ('0' + (idx + 1)).slice(-2)}</td>
          <td style="font-weight: 700; color: var(--text-secondary);">${p.reference_no || '-'}</td>

          <td>${p.promotion_date || '-'}</td>
          <td style="text-align: center; font-weight: 700;">${p.seniority || p.sequence_no || '-'}</td>
          <td style="text-align: center; font-weight: 800;">${p.sequence_number || p.sequence_no || '-'}</td>
          <td>${p.duration_in_pg || '-'}</td>
          <td style="color: var(--text-secondary); font-size: 0.7rem;">${p.remarks || '-'}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  },
