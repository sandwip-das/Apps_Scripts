<script>
/**
 * ============================================================================
 * SANDVIORA AVIOSOLUTION - Master Enterprise UI Component Engine
 * ============================================================================
 * File: Components.html
 * Architectural Role: Reusable Pure Vanilla UI Elements, Modals & Keystroke Masking
 * 
 * Description:
 * Implements core client-side user interface abstractions without any third-party
 * frameworks or libraries:
 * 
 * Components Provided:
 * 1. Universal 8-Digit Date Mask (`attachUniversalDateMask`):
 *    Strict keystroke interception for date inputs (20102022 -> 20-Oct-2022).
 *    Enforces the zero-native-datepicker architectural constraint.
 * 2. Selectable Form List Shell (`renderSelectableFormList`):
 *    Renders radio-card catalog for choosing form categories to edit or view.
 * 3. Delete Confirmation Modal (`showConfirmModal`):
 *    Accessible modal dialog for destructive deletion confirmation.
 * 4. Duplicate Entry Interception Modal (`showDuplicateModal`):
 *    High-visibility amber alert modal displayed when backend prevents duplicate data.
 * ============================================================================
 */

var Components = window.Components = {
  
  /**
   * Month abbreviations used for formatting dates on the client side.
   */
  dateMonthsShort: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],

  // ==========================================================================
  // SECTION 1: Universal 8-Digit Date Keystroke Mask
  // ==========================================================================

  /**
   * Attaches universal 8-digit date formatting to any input element.
   * User types: 20102022 -> Input displays: 20-Oct-2022.
   * Stores ISO format (YYYY-MM-DD) into `dataset.isoDate` for backend transmission.
   * 
   * Strict adherence: No native HTML5 datepickers are permitted.
   * 
   * @param {HTMLInputElement} inputEl - Target text input DOM element.
   */
  attachUniversalDateMask: function(inputEl) {
    if (!inputEl) return;
    inputEl.setAttribute('type', 'text');
    inputEl.setAttribute('placeholder', 'DDMMYYYY (e.g. 20102022)');
    inputEl.setAttribute('maxlength', '11');
    inputEl.classList.add('universal-date-input');

    inputEl.addEventListener('input', function(e) {
      var val = this.value.replace(/[^0-9]/g, '');
      if (val.length > 8) val = val.substring(0, 8);

      if (val.length === 8) {
        var day = parseInt(val.substring(0, 2), 10);
        var month = parseInt(val.substring(2, 4), 10);
        var year = parseInt(val.substring(4, 8), 10);

        // Validate calendar ranges
        if (month >= 1 && month <= 12 && day >= 1 && day <= 31 && year >= 1900 && year <= 2100) {
          var mStr = Components.dateMonthsShort[month - 1];
          var formatted = ('0' + day).slice(-2) + '-' + mStr + '-' + year;
          this.value = formatted;
          this.dataset.isoDate = year + '-' + ('0' + month).slice(-2) + '-' + ('0' + day).slice(-2);
          this.style.borderColor = '#10b981'; // Green border indicator for valid date
        } else {
          this.style.borderColor = '#ef4444'; // Red border indicator for invalid date
        }
      } else {
        this.style.borderColor = '';
      }
    });

    inputEl.addEventListener('blur', function() {
      var val = this.value.trim();
      if (!val) return;
      // Re-format on blur if 8 raw digits were pasted without hyphens
      if (!val.includes('-') && val.replace(/[^0-9]/g, '').length === 8) {
        var digits = val.replace(/[^0-9]/g, '');
        var day = parseInt(digits.substring(0, 2), 10);
        var month = parseInt(digits.substring(2, 4), 10);
        var year = parseInt(digits.substring(4, 8), 10);
        if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
          this.value = ('0' + day).slice(-2) + '-' + Components.dateMonthsShort[month - 1] + '-' + year;
        }
      }
    });
  },

  // ==========================================================================
  // SECTION 2: Selectable Form List Component
  // ==========================================================================

  /**
   * Renders the Selectable List View for Input Records & View Forms.
   * Displays a vertical stack of selectable radio cards for form navigation.
   * 
   * @param {string} containerId - Target mount element ID.
   * @param {Object} options - Configuration options.
   * @param {Array<Object>} [options.sequence] - Array of form descriptor objects ({ key, name, icon }).
   * @param {string} [options.mode='input'] - 'input' (renders input forms) or 'view' (renders data grids).
   * @param {string} [options.handler='hrmViews'] - Global controller name handling form actions.
   * @param {string} [options.title] - Custom header title.
   * @param {string} [options.subtitle] - Custom subtitle.
   */
  renderSelectableFormList: function(containerId, options) {
    var container = document.getElementById(containerId);
    if (!container) return;

    options = options || {};
    var sequence = options.sequence || HRM_FORM_SEQUENCE;
    var mode = options.mode || 'input'; // 'input' or 'view'
    var handlerName = options.handler || 'hrmViews';
    var title = options.title || (mode === 'input' ? 'Select Data Input Form' : 'Select Form Category to View Records');
    var subtitle = options.subtitle || (mode === 'input' ? 'Choose any form below and click OK to open the data entry form' : 'Choose any form below and click OK to open the structured data grid');

    var html = `
      <div class="selectable-list-shell">
        <div class="selectable-list-header">
          <h2>${title}</h2>
          <p>${subtitle}</p>
        </div>

        <div class="selectable-list-container" id="form-list-items">
    `;

    sequence.forEach(function(item, idx) {
      var isSelected = idx === 0 ? 'selected' : '';
      html += `
        <div class="selectable-list-item ${isSelected}" data-key="${item.key}" onclick="Components.selectFormListItem(this)">
          <div class="item-icon-box">
            <span class="material-icons">${item.icon || 'description'}</span>
          </div>
          <div class="item-text-box">
            <h4 class="item-title">${(typeof AppSchemas !== 'undefined' && AppSchemas[item.key] && AppSchemas[item.key].title) ? AppSchemas[item.key].title : item.name}</h4>
            <p class="item-desc">${(typeof AppSchemas !== 'undefined' && AppSchemas[item.key] && AppSchemas[item.key].subtitle) ? AppSchemas[item.key].subtitle : ('Access and manage ' + item.name + ' records')}</p>
          </div>
          <div class="item-radio-indicator">
            <span class="material-icons radio-icon" style="color: var(--brand-teal);">${idx === 0 ? 'radio_button_checked' : 'radio_button_unchecked'}</span>
          </div>
        </div>
      `;
    });

    html += `
        </div>

        <div class="selectable-list-footer">
          <button type="button" class="btn-primary-action" onclick="Components.confirmFormSelection('${mode}', '${handlerName}')">
            <span class="material-icons" style="font-size: 1.1rem;">check_circle</span>
            <span>OK</span>
          </button>
        </div>
      </div>
    `;

    container.innerHTML = html;
  },

  /**
   * Handles user click on a selectable radio-card list item.
   * Updates visual active states and radio button icons.
   * 
   * @param {HTMLElement} el - Clicked list item element.
   */
  selectFormListItem: function(el) {
    var items = document.querySelectorAll('.selectable-list-item');
    items.forEach(function(item) {
      item.classList.remove('selected');
      var icon = item.querySelector('.radio-icon');
      if (icon) icon.textContent = 'radio_button_unchecked';
    });

    el.classList.add('selected');
    var activeIcon = el.querySelector('.radio-icon');
    if (activeIcon) activeIcon.textContent = 'radio_button_checked';
  },

  /**
   * Confirms the active selection from the selectable form list and navigates to the target view.
   * 
   * @param {string} mode - 'input' or 'view'.
   * @param {string} handlerName - Name of the view controller object (e.g. 'hrmViews', 'orgViews').
   */
  confirmFormSelection: function(mode, handlerName) {
    var selected = document.querySelector('.selectable-list-item.selected');
    if (!selected) {
      return app.toast('Please select a form from the list.', 'warning');
    }
    var key = selected.dataset.key;
    var handler = window[handlerName] || window.hrmViews;
    if (mode === 'input') {
      if (handler && typeof handler.openInputForm === 'function') {
        handler.openInputForm(key);
      }
    } else {
      if (handler && typeof handler.openViewGrid === 'function') {
        handler.openViewGrid(key);
      }
    }
  },

  // ==========================================================================
  // SECTION 3: Confirmation & Duplicate Alert Modals
  // ==========================================================================

  /**
   * Displays a prominent confirmation modal dialog (primarily used for deletions).
   * 
   * @param {Object} options - Modal options.
   * @param {string} [options.title='Confirm Deletion'] - Dialog title.
   * @param {string} [options.message] - Dialog description message.
   * @param {Function} [options.onConfirm] - Callback executed when user confirms.
   * @param {Function} [options.onCancel] - Callback executed when user cancels.
   */
  showConfirmModal: function(options) {
    var existing = document.getElementById('custom-confirm-modal');
    if (existing) existing.remove();

    var modal = document.createElement('div');
    modal.id = 'custom-confirm-modal';
    modal.className = 'custom-modal-overlay';

    modal.innerHTML = `
      <div class="custom-modal-card animate-scale-up">
        <div class="modal-header-icon" style="background: var(--status-danger-bg); color: var(--status-danger);">
          <span class="material-icons" style="font-size: 1.75rem;">warning</span>
        </div>
        <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-top: 0.5rem;">${options.title || 'Confirm Deletion'}</h3>
        <p style="font-size: 0.8125rem; color: var(--text-secondary); margin-top: 0.5rem; text-align: center; line-height: 1.5;">
          ${options.message || 'Are you sure you want to permanently delete this record? This action cannot be undone.'}
        </p>
        <div class="modal-btn-row">
          <button type="button" class="btn-cancel" id="btn-modal-cancel">
            Cancel
          </button>
          <button type="button" class="btn-danger-confirm" id="btn-modal-confirm">
            <span class="material-icons" style="font-size: 0.875rem;">delete</span>
            <span>Confirm Delete</span>
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById('btn-modal-cancel').onclick = function() {
      modal.remove();
      if (options.onCancel) options.onCancel();
    };

    document.getElementById('btn-modal-confirm').onclick = function() {
      modal.remove();
      if (options.onConfirm) options.onConfirm();
    };
  },

  /**
   * Prominent Pop-up Modal for Duplicate Entry Interception.
   * Displays an immediate visual warning when the database rejects duplicate data.
   * 
   * @param {string} message - Primary explanation text.
   * @param {string} [details] - Detailed error message or matched key values.
   */
  showDuplicateModal: function(message, details) {
    var existing = document.getElementById('custom-duplicate-modal');
    if (existing) existing.remove();

    var modal = document.createElement('div');
    modal.id = 'custom-duplicate-modal';
    modal.className = 'custom-modal-overlay';
    modal.style.zIndex = '99999';

    modal.innerHTML = `
      <div class="custom-modal-card animate-scale-up" style="max-width: 440px; text-align: center; border: 1.5px solid var(--status-warning); padding: 1.5rem 1.25rem;">
        <div class="modal-header-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; width: 56px; height: 56px; margin: 0 auto 0.75rem auto; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          <span class="material-icons" style="font-size: 2.25rem;">content_copy</span>
        </div>
        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin: 0 0 0.5rem 0; letter-spacing: 0.02em;">Data Already Exists!</h3>
        <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin: 0 0 0.75rem 0; padding: 0 0.5rem;">
          ${message || 'This record or key identifier is already registered in the database. Duplicate entries are strictly prevented.'}
        </p>
        ${details ? `<div style="font-size: 0.75rem; color: var(--text-muted); background: var(--surface-alt); padding: 0.5rem; border-radius: var(--radius-sm); margin-bottom: 1rem; word-break: break-word;">${details}</div>` : ''}
        <div style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;">
          <button type="button" class="btn-primary-action" id="btn-duplicate-modal-ok" style="min-width: 130px; font-weight: 700; background: #f59e0b; border-color: #d97706; color: #ffffff;">
            <span class="material-icons" style="font-size: 1.1rem;">check_circle</span>
            <span>OK, Understood</span>
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById('btn-duplicate-modal-ok').onclick = function() {
      modal.remove();
    };
  }
};
</script>
