<script>
/**
 * ============================================================================
 * SANDVIORA AVIOSOLUTION - High-Speed Client API Gateway & Caching Engine
 * ============================================================================
 * File: Api.html
 * Architectural Role: Frontend-to-Backend Remote Procedure Call (RPC) Bridge
 * 
 * Description:
 * Manages all asynchronous communication between the browser and Google Apps Script
 * server endpoints (google.script.run). Incorporates a high-performance multi-tier
 * caching architecture that eliminates latency and provides instant 0ms view navigation.
 * 
 * Multi-Tier Caching Architecture:
 * 1. In-Memory RAM Cache (`_memCache`):
 *    Instant 0ms local data resolution within the active single-page session.
 * 2. SessionStorage Persistence (`_getFromStorage`, `_setToStorage`):
 *    Preserves downloaded datasets across view changes with automated 15-minute TTL.
 * 3. In-Flight Request De-duplication (`_inflight`):
 *    Merges concurrent identical RPC requests into a single promise to minimize
 *    redundant Google Apps Script executions.
 * 4. Automated Cache Invalidation (`invalidateCache`):
 *    Mutations (Create, Update, Delete) automatically update local arrays and
 *    purge dependent aggregated read models (master_data, hrm_details).
 * ============================================================================
 */

var api = window.api = {
  /**
   * Primary in-memory RAM cache for instantaneous data resolution.
   * @private
   */
  _memCache: {},

  /**
   * Registry of active in-flight promises to deduplicate simultaneous requests.
   * @private
   */
  _inflight: {},

  /**
   * SessionStorage key namespace prefix.
   * @private
   */
  _STORAGE_PREFIX: 'sandviora_cache_',

  /**
   * Universal Startup Cache Purge:
   * Immediately clears any stale persisted database cache keys from previous sessions.
   */
  _purgeResidualStorage: function() {
    try {
      if (typeof sessionStorage !== 'undefined') {
        var sKeys = [];
        for (var i = 0; i < sessionStorage.length; i++) {
          var k = sessionStorage.key(i);
          if (k && k.indexOf(this._STORAGE_PREFIX) === 0) sKeys.push(k);
        }
        sKeys.forEach(function(k) { sessionStorage.removeItem(k); });
      }
      if (typeof localStorage !== 'undefined') {
        var lKeys = [];
        for (var j = 0; j < localStorage.length; j++) {
          var lk = localStorage.key(j);
          if (lk && lk.indexOf(this._STORAGE_PREFIX) === 0) lKeys.push(lk);
        }
        lKeys.forEach(function(lk) { localStorage.removeItem(lk); });
      }
    } catch (e) {}
  },

  _getFromStorage: function(key) {
    // Disabled: Live Google Sheets database is the single source of truth
    return null;
  },

  _setToStorage: function(key, data, ttlMs) {
    // Disabled: Prevent phantom/ghost data retention across sessions
  },

  _removeFromStorage: function(key) {
    try {
      if (typeof sessionStorage !== 'undefined') sessionStorage.removeItem(this._STORAGE_PREFIX + key);
      if (typeof localStorage !== 'undefined') localStorage.removeItem(this._STORAGE_PREFIX + key);
    } catch (e) {}
  },

  // ==========================================================================
  // SECTION 1: Core RPC Transport & Promise Management
  // ==========================================================================

  /**
   * Invokes a server-side Google Apps Script function with timeout and deduplication.
   * 
   * @param {string} serverFunction - Name of server function declared in Router.gs.
   * @param {...*} args - Arguments to pass to the server function.
   * @returns {Promise<*>} Resolves with response.data on success; rejects with Error on failure.
   */
  call: function(serverFunction, ...args) {
    // Generate unique signature key for this specific RPC call
    var callKey = serverFunction + (args.length ? '_' + JSON.stringify(args) : '');
    
    // In-flight deduplication: return existing active promise if already pending
    if (this._inflight[callKey]) {
      return this._inflight[callKey];
    }

    var self = this;
    var promise = new Promise((resolve, reject) => {
      // 30-second client timeout safeguard
      var timer = setTimeout(function() {
        delete self._inflight[callKey];
        reject(new Error('Server request timed out for ' + serverFunction));
      }, 30000);

      var cleanArgs = args.map(function(a) { return a === undefined ? null : a; });

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        var runner = google.script.run
          .withSuccessHandler(response => {
            clearTimeout(timer);
            delete self._inflight[callKey];
            if (response && response.status === 'success') {
              resolve(response.data);
            } else {
              var msg = (response && response.message) || 'Server error';
              var isDup = (response && response.status === 'duplicate') || msg.indexOf('already exists') !== -1 || msg.indexOf('Duplicate') !== -1;
              var err = new Error(msg);
              err.isDuplicate = isDup;
              reject(err);
            }
          })
          .withFailureHandler(error => {
            clearTimeout(timer);
            delete self._inflight[callKey];
            var msg = (error && error.message) || String(error);
            var isDup = msg.indexOf('already exists') !== -1 || msg.indexOf('Duplicate') !== -1;
            var err = new Error(msg);
            err.isDuplicate = isDup;
            reject(err);
          });

        if (typeof runner[serverFunction] === 'function') {
          try {
            runner[serverFunction].apply(runner, cleanArgs);
          } catch (e) {
            clearTimeout(timer);
            delete self._inflight[callKey];
            reject(new Error("Server endpoint '" + serverFunction + "' invocation error: " + (e.message || e)));
          }
        } else {
          clearTimeout(timer);
          delete self._inflight[callKey];
          console.warn("Server endpoint '" + serverFunction + "' not found on runner.");
          resolve([]);
        }
      } else {
        clearTimeout(timer);
        delete self._inflight[callKey];
        console.warn('Google Apps Script environment not detected.');
        resolve([]);
      }
    });

    this._inflight[callKey] = promise;
    return promise;
  },

  // ==========================================================================
  // SECTION 2: Master Reference Data & Aggregated Read Models
  // ==========================================================================

  /**
   * Fetches consolidated master dropdown reference data (stations, pay groups, etc.).
   * Resolves instantly from RAM cache or SessionStorage whenever possible.
   * 
   * @param {boolean} [forceRefresh=false] - Bypasses cache if true.
   * @returns {Promise<Object>} Master reference dictionary.
   */
  getMasterData: async function(forceRefresh = false) {
    var cacheKey = 'master_data';
    if (!forceRefresh && this._memCache[cacheKey]) {
      return this._memCache[cacheKey];
    }
    var data = await this.call('api_get_master_data', forceRefresh);
    if (data) {
      this._memCache[cacheKey] = data;
    }
    return data;
  },

  /**
   * Fetches the unified canonical employee read model powering all 7 employee views.
   * 
   * @param {boolean} [forceRefresh=false] - Bypasses cache if true.
   * @returns {Promise<Array<Object>>} Array of enriched employee detail records.
   */
  getHrmDetails: async function(forceRefresh = false) {
    var cacheKey = 'hrm_details';
    if (!forceRefresh && this._memCache[cacheKey]) {
      return this._memCache[cacheKey];
    }
    var data = await this.call('api_get_hrm_details', forceRefresh);
    if (Array.isArray(data)) {
      this._memCache[cacheKey] = data;
    }
    return data || [];
  },

  // ==========================================================================
  // SECTION 3: Standard CRUD Operations with Instant Live Invalidation
  // ==========================================================================

  /**
   * Reads all active records from a specified database table.
   * 
   * @param {string} table - Target table name.
   * @param {boolean} [forceRefresh=false] - Bypasses cache if true.
   * @returns {Promise<Array<Object>>} Array of table record objects.
   */
  read: async function(table, forceRefresh = false) {
    var cacheKey = 'tbl_' + table;
    if (!forceRefresh && this._memCache[cacheKey]) {
      return this._memCache[cacheKey];
    }
    const data = await this.call('api_read', table);
    if (Array.isArray(data)) {
      this._memCache[cacheKey] = data;
    }
    return data || [];
  },

  /**
   * Creates a new record in a database table.
   * Immediately invalidates client-side caches so that data is rendered rapidly.
   * 
   * @param {string} table - Target table name.
   * @param {Object} data - Key-value pair payload of row data.
   * @param {string} [pkPrefix] - Optional primary key prefix.
   * @param {string} [pkColName] - Optional primary key column name.
   * @returns {Promise<Object>} Created record with assigned primary key and audit timestamps.
   */
  create: async function(table, data, pkPrefix, pkColName) {
    const res = await this.call('api_create', table, data, pkPrefix, pkColName);
    var savedRec = res || data;
    this.invalidateCache(table);
    return savedRec;
  },

  /**
   * Updates an existing record in a database table.
   * Immediately invalidates client-side caches so updated data is rendered rapidly.
   * 
   * @param {string} table - Target table name.
   * @param {string} pkCol - Primary key column name.
   * @param {string|number} id - Target record primary key value.
   * @param {Object} data - Updated field values.
   * @returns {Promise<Object>} Updated record.
   */
  update: async function(table, pkCol, id, data) {
    const res = await this.call('api_update', table, pkCol, id, data);
    this.invalidateCache(table);
    return res;
  },

  /**
   * Deletes a record from a database table.
   * Immediately invalidates client-side caches so deleted data is removed from UI.
   * 
   * @param {string} table - Target table name.
   * @param {string} pkCol - Primary key column name.
   * @param {string|number} id - Target record primary key value.
   * @returns {Promise<Object>} Deletion result confirmation.
   */
  delete: async function(table, pkCol, id) {
    const res = await this.call('api_delete', table, pkCol, id);
    this.invalidateCache(table);
    return res;
  },

  // ==========================================================================
  // SECTION 4: Domain-Specific Service Proxies
  // ==========================================================================

  getServiceHistory: async function(empId, mode) {
    return this.call('api_get_service_history', empId, mode);
  },

  getPromotionBatches: async function() {
    return this.call('api_get_promotion_batches');
  },

  getEmployeePromotionReport: async function(empId) {
    return this.call('api_get_employee_promotion_report', empId);
  },

  getAllPromotionsDetailed: async function() {
    return this.call('api_get_all_promotions_detailed');
  },

  getPromotionEligibility: async function(filters) {
    return this.call('api_get_promotion_eligibility', filters);
  },

  getWorkforceSetupReport: async function(filters) {
    return this.call('api_get_workforce_setup_report', filters);
  },

  getWorkforceDistribution: async function(filters) {
    return this.call('api_get_workforce_distribution', filters);
  },

  getWorkforceAnalytics: async function() {
    return this.call('api_get_workforce_analytics');
  },

  calculateAllowance: async function(data) {
    return this.call('api_calculate_allowance', data);
  },

  // ==========================================================================
  // SECTION 5: Cache Lifecycle & Synchronization
  // ==========================================================================

  /**
   * Invalidate cached data for a specific table and dependent read models.
   * @param {string} [table] - Table name.
   */
  invalidateCache: function(table) {
    if (table) {
      delete this._memCache['tbl_' + table];
    } else {
      this._memCache = {};
    }
    delete this._memCache['master_data'];
    delete this._memCache['hrm_details'];
    this._purgeResidualStorage();
  },

  /**
   * Completely clears all RAM caches and persistent storage entries.
   */
  clearAllCaches: function() {
    this._memCache = {};
    this._inflight = {};
    this._purgeResidualStorage();
  },

  // Backward compatibility alias methods
  createRecord: function(table, data, pkPrefix, pkColName) {
    return this.create(table, data, pkPrefix, pkColName);
  },

  updateRecord: function(table, pkCol, id, data) {
    return this.update(table, pkCol, id, data);
  },

  deleteRecord: function(table, pkCol, id) {
    return this.delete(table, pkCol, id);
  },

  readRecords: function(table, forceRefresh) {
    return this.read(table, forceRefresh);
  },

  /**
   * Synchronizes database tables and clears client caches.
   */
  syncDatabaseTables: async function() {
    const res = await this.call('api_sync_tables_and_audit');
    this.clearAllCaches();
    return res;
  }
};

// Immediately wipe any lingering cache from previous versions on startup
try {
  api._purgeResidualStorage();
} catch (e) {}
</script>
