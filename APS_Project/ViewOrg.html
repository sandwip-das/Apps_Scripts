<!-- ORG Input Records -->
<template id="tmpl-org_input">
  <div class="mb-4">
    <h2 class="text-2xl font-bold text-gray-800">ORG Input Records</h2>
    <p class="text-sm text-gray-500">Create new organization structure &amp; workforce setup records</p>
  </div>
  
  <!-- Form Tabs in Ordered Sequence -->
  <div id="org-input-buttons" class="flex space-x-2 mb-4 overflow-x-auto pb-2">
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'directorates')">Directorates Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'departments')">Departments Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'sections')">Sections Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'shifts')">Shifts Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'pay_groups')">Pay Group Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'stations')">Stations Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgInputForm(this, 'workforce_setup')">Set Up Form</button>
  </div>

  <div id="org-form-container">
    <div class="p-8 text-center text-gray-400 border-2 border-dashed border-gray-200 rounded-xl">
      <span class="material-icons text-4xl mb-2">touch_app</span>
      <p>Select a form above to create a record.</p>
    </div>
  </div>
</template>

<!-- ORG View Forms -->
<template id="tmpl-org_view">
  <div class="mb-4">
    <h2 class="text-2xl font-bold text-gray-800">ORG View Forms</h2>
    <p class="text-sm text-gray-500">View, search, edit, and export organization structure &amp; workforce setups</p>
  </div>

  <!-- Table View Tabs in Ordered Sequence -->
  <div id="org-view-buttons" class="flex space-x-2 mb-4 overflow-x-auto pb-2">
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'directorates')">Directorates Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'departments')">Departments Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'sections')">Sections Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'shifts')">Shifts Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'pay_groups')">Pay Group Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'stations')">Stations Form</button>
    <button class="px-3 py-2 bg-white border border-gray-200 shadow-sm rounded-md text-sm hover:bg-blue-50 text-gray-700 whitespace-nowrap font-medium transition-colors" onclick="switchOrgViewGrid(this, 'workforce_setup')">Set Up Form</button>
  </div>

  <div id="org-grid-container">
    <div class="p-8 text-center text-gray-400 border-2 border-dashed border-gray-200 rounded-xl">
      <span class="material-icons text-4xl mb-2">touch_app</span>
      <p>Select a table above to view data.</p>
    </div>
  </div>
</template>

<script>
function switchOrgInputForm(btn, schemaKey) {
  const container = document.getElementById('org-input-buttons');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.classList.remove('bg-blue-900', 'text-white', 'border-blue-950', 'shadow-md');
      b.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
    });
  }
  if (btn) {
    btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
    btn.classList.add('bg-blue-900', 'text-white', 'border-blue-950', 'shadow-md');
  }
  Components.renderForm(schemaKey, 'org-form-container');
}

function switchOrgViewGrid(btn, schemaKey) {
  const container = document.getElementById('org-view-buttons');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.classList.remove('bg-blue-900', 'text-white', 'border-blue-950', 'shadow-md');
      b.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
    });
  }
  if (btn) {
    btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
    btn.classList.add('bg-blue-900', 'text-white', 'border-blue-950', 'shadow-md');
  }
  Components.renderGrid(schemaKey, 'org-grid-container');
}

async function org_input_init() {
  const container = document.getElementById('org-input-buttons');
  if (container && container.firstElementChild) {
    container.firstElementChild.click();
  }
}

async function org_view_init() {
  const container = document.getElementById('org-view-buttons');
  if (container && container.firstElementChild) {
    container.firstElementChild.click();
  }
}

async function org_dashboard_init() {
  try {
    app.showLoader();
    const [masterData, setups] = await Promise.all([
      api.getMasterData(),
      api.read('workforce_setup').catch(() => [])
    ]);
    const setStat = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
    setStat('stat-dir', (masterData.directorates || []).length);
    setStat('stat-dep', (masterData.departments || []).length);
    setStat('stat-sec', (masterData.sections || []).length);
    setStat('stat-sh', (masterData.shifts || []).length);
    setStat('stat-pg', (masterData.pay_groups || []).length);
    setStat('stat-st', (masterData.stations || []).length);
    setStat('stat-setup', (setups || []).length);
  } catch (e) {
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}
</script>
