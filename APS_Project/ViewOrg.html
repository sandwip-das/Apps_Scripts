<script>
async function org_dashboard_init() {
  try {
    app.showLoader();
    const [directorates, departments, stations, sections, payGroups, shifts] = await Promise.all([
      api.read('directorates').catch(()=>[]),
      api.read('departments').catch(()=>[]),
      api.read('stations').catch(()=>[]),
      api.read('sections').catch(()=>[]),
      api.read('pay_groups').catch(()=>[]),
      api.read('shifts').catch(()=>[])
    ]);

    const setStat = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
    setStat('stat-dir', directorates.length);
    setStat('stat-dep', departments.length);
    setStat('stat-st', stations.length);
    setStat('stat-sec', sections.length);
    setStat('stat-pg', payGroups.length);
    setStat('stat-sh', shifts.length);
  } catch (e) {
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}
</script>
