    detectUnitTier: function (u) {
      if (!u) return 'UNIT';
      var explicitType = String(u.unit_type || '').trim().toUpperCase();
      var explicitTier = {
        'EXECUTIVE': 'CORPORATE',
        'CORPORATE': 'CORPORATE',
        'CEO': 'CORPORATE',
        'MD & CEO': 'CORPORATE',
        'DIRECTORATE': 'DIRECTORATE',
        'DIVISION': 'DIVISION',
        'DEPARTMENT': 'DEPARTMENT',
        'WING': 'WING',
        'SUB-WING': 'WING',
        'SECTION': 'SECTION',
        'UNIT': 'UNIT',
        'TEAM': 'UNIT'
      };
      if (explicitTier[explicitType]) return explicitTier[explicitType];
      var rawCode = String(u.unit_code || '').trim().toUpperCase();
      var cleanCode = rawCode.replace(/[^A-Z]/g, '');
      var prefix3 = cleanCode.slice(0, 3);

      if (prefix3 === 'COR' || prefix3 === 'CEO' || rawCode.startsWith('COR') || rawCode.startsWith('CEO') || rawCode.startsWith('MD') || rawCode.startsWith('HQ')) {
        return 'CORPORATE';
      }
      if (prefix3 === 'DIR' || rawCode.startsWith('DIR')) {
        return 'DIRECTORATE';
      }
      if (prefix3 === 'DIV' || rawCode.startsWith('DIV')) {
        return 'DIVISION';
      }
      if (prefix3 === 'DEP' || rawCode.startsWith('DEP')) {
        return 'DEPARTMENT';
      }
      if (prefix3 === 'WIN' || prefix3 === 'WNG' || rawCode.startsWith('WIN') || rawCode.startsWith('WNG')) {
        return 'WING';
      }
      if (prefix3 === 'SEC' || rawCode.startsWith('SEC')) {
        return 'SECTION';
      }
      if (prefix3 === 'UNI' || prefix3 === 'UNT' || rawCode.startsWith('UNI') || rawCode.startsWith('UNT')) {
        return 'UNIT';
      }

      var lCode = String(u.letter_code || '').trim().toUpperCase();
      var lClean = lCode.replace(/[^A-Z]/g, '');
      var lPrefix3 = lClean.slice(0, 3);
      if (lPrefix3 === 'COR' || lPrefix3 === 'CEO' || lCode.startsWith('COR') || lCode.startsWith('CEO') || lCode.startsWith('MD')) return 'CORPORATE';
      if (lPrefix3 === 'DIR' || lCode.startsWith('DIR')) return 'DIRECTORATE';
      if (lPrefix3 === 'DIV' || lCode.startsWith('DIV')) return 'DIVISION';
      if (lPrefix3 === 'DEP' || lCode.startsWith('DEP')) return 'DEPARTMENT';
      if (lPrefix3 === 'WIN' || lPrefix3 === 'WNG' || lCode.startsWith('WIN')) return 'WING';
      if (lPrefix3 === 'SEC' || lCode.startsWith('SEC')) return 'SECTION';
      if (lPrefix3 === 'UNI' || lPrefix3 === 'UNT' || lCode.startsWith('UNI')) return 'UNIT';

      var uType = String(u.unit_type || '').trim().toUpperCase();
      if (uType === 'CORPORATE' || uType === 'CEO' || uType === 'MD & CEO') return 'CORPORATE';
      if (uType === 'DIRECTORATE' || uType === 'HEADQUARTER') return 'DIRECTORATE';
      if (uType === 'DIVISION') return 'DIVISION';
      if (uType === 'DEPARTMENT') return 'DEPARTMENT';
      if (uType === 'WING' || uType === 'SUB-WING') return 'WING';
      if (uType === 'SECTION') return 'SECTION';
      if (uType === 'UNIT' || uType === 'TEAM') return 'UNIT';

      var uName = String(u.unit_name || '').trim().toUpperCase();
      if (uName.indexOf('DIRECTORATE') !== -1) return 'DIRECTORATE';
      if (uName.indexOf('DIVISION') !== -1) return 'DIVISION';
      if (uName.indexOf('DEPARTMENT') !== -1) return 'DEPARTMENT';
      if (uName.indexOf('WING') !== -1) return 'WING';
      if (uName.indexOf('SECTION') !== -1) return 'SECTION';
      if (uName.indexOf('CORPORATE') !== -1 || uName.indexOf('CEO') !== -1 || uName.indexOf('MANAGING DIRECTOR') !== -1) return 'CORPORATE';

      if (!u.parent_unit_id) return 'CORPORATE';

      return 'UNIT';
    },

    buildHierarchyTreeOptions: function (units) {
      if (!units || !units.length) return [];
      var unitMap = {};
      var childrenMap = {};
      var typePriority = {
        'CORPORATE': 1, 'MD & CEO': 1, 'CEO': 1,
        'DIRECTORATE': 2, 'HEADQUARTER': 2,
        'DIVISION': 3,
        'DEPARTMENT': 4,
        'WING': 5,
        'SECTION': 6,
        'UNIT': 7, 'TEAM': 7
      };

      units.forEach(function (u) {
        if (!u.unit_id) return;
        unitMap[u.unit_id] = u;
        var pId = (u.parent_unit_id || '').trim();
        if (!childrenMap[pId]) childrenMap[pId] = [];
        childrenMap[pId].push(u);
      });

      var sortUnits = function (list) {
        return list.slice().sort(function (a, b) {
          var pA = typePriority[orgViews.detectUnitTier(a)] || 99;
          var pB = typePriority[orgViews.detectUnitTier(b)] || 99;
          if (pA !== pB) return pA - pB;
          return String(a.unit_name || '').localeCompare(String(b.unit_name || ''));
        });
      };

      var roots = [];
      units.forEach(function (u) {
        var pId = (u.parent_unit_id || '').trim();
        if (!pId || !unitMap[pId]) {
          roots.push(u);
        }
      });
      roots = sortUnits(roots);

      var treeList = [];
      var visited = {};

      var traverse = function (node, depth) {
        if (visited[node.unit_id]) return;
        visited[node.unit_id] = true;

        var indent = '';
        for (var i = 0; i < depth; i++) {
          indent += '\u00A0\u00A0\u00A0\u00A0';
        }
        var prefix = depth === 0 ? '' : (indent + '↳ ');
        var label = prefix + (node.unit_name || node.unit_code);

        treeList.push({
          unit_id: node.unit_id,
          unit_code: node.unit_code,
          unit_name: node.unit_name,
          unit_type: node.unit_type,
          label: label,
          depth: depth,
          raw: node
        });

        var children = childrenMap[node.unit_id] || [];
        var sortedChildren = sortUnits(children);
        sortedChildren.forEach(function (child) {
          traverse(child, depth + 1);
        });
      };

      roots.forEach(function (r) {
        traverse(r, 0);
      });

      units.forEach(function (u) {
        if (!visited[u.unit_id]) {
          traverse(u, 0);
        }
      });

      return treeList;
    },

                if (schema.table === 'designations' && f.name === 'unit_id') {
                  var deptUnits = (list || []).filter(function (u) {
                    var tier = orgViews.detectUnitTier(u);
                    var uType = String(u.unit_type || '').trim().toUpperCase();
                    var uName = String(u.unit_name || '').trim().toUpperCase();
                    return tier === 'DEPARTMENT' || uType === 'DEPARTMENT' || uType === 'DIVISION' || uName.indexOf('DEPARTMENT') !== -1;
                  });
                  deptUnits.sort(function (a, b) {
                    return String(a.unit_name || '').localeCompare(String(b.unit_name || ''));
                  });
                  deptUnits.forEach(function (dept) {
                    var opt = document.createElement('option');
                    opt.value = dept.unit_id;
                    opt.textContent = dept.unit_name || dept.unit_code || dept.unit_id;
                    opt.dataset.unitName = dept.unit_name || '';
                    opt.dataset.unitType = dept.unit_type || 'DEPARTMENT';
                    opt.dataset.unitCode = dept.unit_code || '';
                    sel.appendChild(opt);
                  });
                  continue;
                }
                var treeNodes = self.buildHierarchyTreeOptions(list);
                treeNodes.forEach(function (node) {
                  var opt = document.createElement('option');
                  opt.value = node.unit_id;
                  opt.textContent = node.label;
                  opt.dataset.unitName = node.unit_name || '';
                  opt.dataset.unitType = node.unit_type || '';
                  opt.dataset.unitCode = node.unit_code || '';
                  sel.appendChild(opt);
                });
                continue;
              }
              var itemsToRender = list.slice();
              var isPgCodeField = (f.source === 'pay_groups' && f.name.indexOf('designation') === -1);
              if (isPgCodeField) {
                var uniquePgs = {};
                list.forEach(function (item) {
                  var p = String(item.pay_group || '').trim();
                  if (p) uniquePgs[p] = true;
                });
                var stdOrder = ['PG-1', 'PG-3(2)', 'PG-4', 'PG-5', 'PG-6', 'PG-7', 'PG-8', 'PG-9', 'PG-10', 'PG-11', 'PG-12', 'LOCAL'];
                var sorted = Object.keys(uniquePgs).sort(function (a, b) {
                  var iA = stdOrder.indexOf(a);
                  var iB = stdOrder.indexOf(b);
                  if (iA !== -1 && iB !== -1) return iA - iB;
                  if (iA !== -1) return -1;
                  if (iB !== -1) return 1;
                  return a.localeCompare(b);
                });
                itemsToRender = sorted.map(function (p) { return { pay_group: p }; });
              } else if (f.source === 'stations' && f.name === 'city') {
                var citiesSeen = {};
                var uniqueCities = [];
                list.forEach(function (item) {
                  var c = (item.city || '').trim();
                  if (c && !citiesSeen[c.toUpperCase()]) {
                    citiesSeen[c.toUpperCase()] = true;
                    uniqueCities.push({ city: c });
                  }
                });
                uniqueCities.sort(function (a, b) {
                  return a.city.localeCompare(b.city);
                });
                itemsToRender = uniqueCities;
              }
              var seen = {};
              itemsToRender.forEach(function (item) {
                var val = item[f.sourceKey] || item.location_id || item.location_code || item.id || item.code;
                var disp = item[f.sourceDisplay] || item.name || val;
                if (f.source === 'stations' && f.name === 'city') {
                  val = item.city;
                  disp = item.city;
                } else if (f.source === 'stations') {
                  disp = item.station_code || item.station_id || val;
                } else if (f.source === 'work_locations') {
                  val = item.location_id || item.location_code || item.id || item.code || val;
                  disp = item.location_name || item.location_code || val;
                } else if (f.source === 'positions') {
                  disp = item.position_title || item.position_code || val;
                } else if (f.source === 'shifts') {
                  disp = item.shift_name || item.shift_code || val;
                } else if (f.source === 'pay_groups') {
                  if (isPgCodeField) {
                    disp = item.pay_group || val;
                    val = item.pay_group || val;
                  } else if (f.name === 'designation') {
                    disp = item.designation || val;
                  } else {
                    disp = item.designation || item.pay_group || val;
                  }
                } else if (f.source === 'organization_units') {
                  disp = item.unit_name || item.unit_code || val;
                }
                var dedupeKey = (f.source === 'shifts') ? (item.shift_name || val) : (isPgCodeField ? (item.pay_group || val) : ((f.source === 'pay_groups') ? (item.designation || val) : ((f.source === 'work_locations') ? (item.location_id || item.location_code || val) : val)));
                if (val && !seen[dedupeKey]) {
                  seen[dedupeKey] = true;
                  var opt = document.createElement('option');
                  opt.value = val;
                  opt.textContent = disp || val;
                  opt.dataset.designation = item.designation || '';
                  opt.dataset.payGroup = item.pay_group || '';
                  opt.dataset.unitId = item.unit_id || '';
                  opt.dataset.unitType = item.unit_type || '';
                  opt.dataset.stationId = item.station_id || item.station_code || '';
                  opt.dataset.locationCode = item.location_code || '';
                  opt.dataset.locationName = item.location_name || '';
                  sel.appendChild(opt);
                }
              });
            } else if (f.name === 'parent_unit_id') {
              sel.innerHTML = `<option value="">-- None (Top-Level / Corporate Authority) --</option>`;
            }
          } catch (err) {
            console.warn('Error populating select for ' + f.source, err);
          }
        }
      }

      // Work Location to Station Dependency (for forms referencing work_locations)
      var locSel = document.getElementById('field-location_id');
      var stnSel = document.getElementById('field-station_id') || document.getElementById('field-station_code');
      if (locSel && stnSel && schema.table !== 'work_locations') {
        locSel.addEventListener('change', function () {
          var selOpt = this.options[this.selectedIndex];
          var linkedStn = selOpt ? (selOpt.dataset.stationId || '') : '';
          self.updateLocationStationDependency(document.getElementById('org-dynamic-form'), this.value, linkedStn);
        });
        // Initialize dependent station state without hiding controls
        if (locSel.value) {
          var initOpt = locSel.options[locSel.selectedIndex];
          var initStn = initOpt ? (initOpt.dataset.stationId || '') : '';
          self.updateLocationStationDependency(document.getElementById('org-dynamic-form'), locSel.value, initStn);
        }
      }

      // Work Location - Station & City Relational Dependency (Station is primary driver)
      if (schema.table === 'work_locations') {
        var wStnSel = document.getElementById('field-station_id') || document.getElementById('field-station_code');
        var wCitySel = document.getElementById('field-city');
        var wCountryInp = document.getElementById('field-country');
        var wRegionSel = document.getElementById('field-region');

        if (wStnSel) {
          wStnSel.addEventListener('change', function () {
            var selStn = this.value;
            if (!selStn) return;
            api.read('stations').then(function (stations) {
              var foundStn = (stations || []).find(function (s) {
                return String(s.station_code || s.station_id || '').trim().toUpperCase() === String(selStn).trim().toUpperCase();
              });
              if (foundStn) {
                if (wCitySel && foundStn.city) {
                  wCitySel.value = foundStn.city;
                }
                var sType = String(foundStn.station_type || '').toLowerCase();
                var sCity = String(foundStn.city || '').trim().toUpperCase();
                var isForeignStn = sType.indexOf('foreign') !== -1;
                var isBangladesh = !isForeignStn || (sType.indexOf('base') !== -1 || sType.indexOf('home') !== -1) ||
                  ['DHAKA', 'CHITTAGONG', 'SYLHET', 'COX\'S BAZAR', 'JESSORE', 'SAIDPUR', 'RAJSHAHI', 'BARISAL'].indexOf(sCity) !== -1;

                if (wCountryInp) {
                  if (foundStn.country && String(foundStn.country).trim().toLowerCase() !== 'foreign') {
                    wCountryInp.value = foundStn.country;
                  } else if (isBangladesh) {
                    wCountryInp.value = 'Bangladesh';
                  } else {
                    wCountryInp.value = '';
                  }
                }
                if (wRegionSel) {
                  if (isBangladesh) {
                    wRegionSel.value = 'Home';
                  } else if (foundStn.region) {
                    wRegionSel.value = foundStn.region;
                  }
                }
              }
            });
          });
        }

        if (wCitySel) {
          wCitySel.addEventListener('change', function () {
            var selCity = this.value;
            if (!selCity) return;
            api.read('stations').then(function (stations) {
              var currStnVal = wStnSel ? wStnSel.value : '';
              var matchingStations = (stations || []).filter(function (s) {
                return !selCity || String(s.city || '').trim().toLowerCase() === String(selCity).trim().toLowerCase();
              });
              if (wStnSel) {
                wStnSel.innerHTML = '<option value="">-- None / Head Office (Non-Airport Facility) --</option>';
                matchingStations.forEach(function (s) {
                  var sCode = s.station_code || s.station_id;
                  var opt = document.createElement('option');
                  opt.value = sCode;
                  opt.textContent = sCode;
                  if (sCode === currStnVal) opt.selected = true;
                  wStnSel.appendChild(opt);
                });
              }
              if (wCountryInp && !wCountryInp.value) {
                var matchedCStn = (stations || []).find(function (s) {
                  return String(s.city || '').trim().toLowerCase() === String(selCity).trim().toLowerCase();
                });
                if (matchedCStn) {
                  var mType = String(matchedCStn.station_type || '').toLowerCase();
                  var mCity = String(matchedCStn.city || '').trim().toUpperCase();
                  var isBdCity = (mType.indexOf('foreign') === -1 || mType.indexOf('base') !== -1 || mType.indexOf('home') !== -1) ||
                    ['DHAKA', 'CHITTAGONG', 'SYLHET', 'COX\'S BAZAR', 'JESSORE', 'SAIDPUR', 'RAJSHAHI', 'BARISAL'].indexOf(mCity) !== -1;
                  if (isBdCity) {
                    wCountryInp.value = 'Bangladesh';
                    if (wRegionSel && !wRegionSel.value) wRegionSel.value = 'Home';
                  }
                }
              }
            });
          });
        }
      }

      if (schema.table === 'organization_units') {
        var pSel = document.getElementById('field-parent_unit_id');
        var previewText = document.getElementById('org-hierarchy-preview-text');

        var updateHierarchyPreview = function () {
          if (!previewText) return;
          var pVal = pSel ? pSel.value : '';

          if (!pVal) {
            previewText.innerHTML = '<em>No parent selected. This unit will be created at the Top-Level (Apex / Directorate Level).</em>';
          } else {
            Promise.all([
              api.read('organization_units').catch(function () { return []; }),
              api.getMasterData().catch(function () { return null; })
            ]).then(function (res) {
              var units = (res[0] && res[0].length > 0) ? res[0] : ((res[1] && res[1].organization_units) || []);
              var map = {};
              (units || []).forEach(function (u) { map[u.unit_id] = u; });
              var chain = [];
              var curr = map[pVal];
              var parentU = curr;
              while (curr) {
                chain.unshift(curr.unit_name || curr.unit_code);
                curr = curr.parent_unit_id ? map[curr.parent_unit_id] : null;
              }
              chain.push('<strong style="color: #0f766e;">[New Sub-Unit]</strong>');
              previewText.innerHTML = '<span style="color: #0f766e; font-weight: 800;">Ancestry Path:</span> ' + chain.join(' ➔ ');

              // Auto-suggest parent location and station to child unit if not manually selected
              if (parentU) {
                if (locSel && !locSel.value && parentU.location_id) {
                  locSel.value = parentU.location_id;
                  self.updateLocationStationDependency(document.getElementById('org-dynamic-form'), parentU.location_id, parentU.station_id);
                }
                if (stnSel && !stnSel.value && parentU.station_id) {
                  stnSel.value = parentU.station_id;
                }
              }
            });
          }
        };

        if (pSel) pSel.addEventListener('change', updateHierarchyPreview);
      }

      if (schema.table === 'workforce_setup') {
        var wsUnitSel = document.getElementById('field-unit_id');
        var wsPgSel = document.getElementById('field-pay_group');
        var wsDesigSel = document.getElementById('field-designation');
        var wsPosSel = document.getElementById('field-position_id');

        var updateWsPayGroups = function (selectedUnitId) {
          Promise.all([
            api.read('pay_groups').catch(function () { return []; }),
            api.read('organization_units').catch(function () { return []; })
          ]).then(function (res) {
            var pgs = res[0] || [];
            var orgUnits = res[1] || [];
            var matchedU = null;
            if (selectedUnitId) {
              matchedU = orgUnits.find(function (u) {
                return String(u.unit_id || u.unit_code || '').trim().toUpperCase() === String(selectedUnitId).trim().toUpperCase();
              });
            }
            var ancestorIds = {};
            var chain = [];
            if (matchedU) {
              var currU = matchedU;
              var visitedU = {};
              while (currU && !visitedU[currU.unit_id]) {
                visitedU[currU.unit_id] = true;
                chain.unshift(currU.unit_name || currU.unit_code);
                if (currU.unit_id) ancestorIds[String(currU.unit_id).trim().toUpperCase()] = true;
                if (currU.unit_code) ancestorIds[String(currU.unit_code).trim().toUpperCase()] = true;
                var parentId = currU.parent_unit_id ? String(currU.parent_unit_id).trim().toUpperCase() : null;
                currU = parentId ? orgUnits.find(function (ou) {
                  return String(ou.unit_id || ou.unit_code || '').trim().toUpperCase() === parentId;
                }) : null;
              }
            }

            var prevWsEl = document.getElementById('ws-hierarchy-preview-text');
            if (prevWsEl) {
              if (chain.length > 0) {
                prevWsEl.innerHTML = '<span style="color: #0f766e; font-weight: 800;">Ancestry Path:</span> ' + chain.join(' ➔ ');
              } else {
                prevWsEl.innerHTML = '<em>Select an Organization Unit to preview its Directorate, Department, and Section hierarchy chain.</em>';
              }
            }

            var filtered = pgs.filter(function (pg) {
              var pgU = String(pg.unit_id || '').trim().toUpperCase();
              if (!pgU || pgU === 'ALL' || pgU === 'CORPORATE') return true;
              if (ancestorIds[pgU]) return true;
              return false;
            });

            if (!selectedUnitId) filtered = pgs;

            // Extract unique clean pay groups
            var uniquePgs = {};
            filtered.forEach(function (item) {
              var p = (item.pay_group || '').trim();
              if (p) uniquePgs[p] = true;
            });

            var stdOrder = ['PG-1', 'PG-3(2)', 'PG-4', 'PG-5', 'PG-6', 'PG-7', 'PG-8', 'PG-9', 'PG-10', 'PG-11', 'PG-12', 'LOCAL'];
            var sortedPgs = Object.keys(uniquePgs).sort(function (a, b) {
              var iA = stdOrder.indexOf(a);
              var iB = stdOrder.indexOf(b);
              if (iA !== -1 && iB !== -1) return iA - iB;
              if (iA !== -1) return -1;
              if (iB !== -1) return 1;
              return a.localeCompare(b);
            });

            if (wsPgSel) {
              var currentPg = wsPgSel.value;
              wsPgSel.innerHTML = '<option value="">-- Select Pay Group --</option>';
              sortedPgs.forEach(function (pg) {
                var opt = document.createElement('option');
                opt.value = pg;
                opt.textContent = pg; // ONLY clean single pay group name
                if (pg === currentPg) opt.selected = true;
                wsPgSel.appendChild(opt);
              });
            }

            // Populate Designations
            var populateDesignations = function (targetPg) {
              if (!wsDesigSel) return;
              if (wsDesigSel.tagName === 'SELECT') {
                var currentDesig = wsDesigSel.value;
                var desigList = filtered.filter(function (item) {
                  if (!targetPg) return true;
                  return String(item.pay_group || '').trim().toUpperCase() === String(targetPg).trim().toUpperCase();
                });
                var seenD = {};
                wsDesigSel.innerHTML = '<option value="">-- Select Designation --</option>';
                desigList.forEach(function (item) {
                  var d = (item.designation || '').trim();
                  if (d && !seenD[d]) {
                    seenD[d] = true;
                    var opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d; // ONLY clean designation name
                    opt.dataset.payGroup = item.pay_group || '';
                    if (d === currentDesig) opt.selected = true;
                    wsDesigSel.appendChild(opt);
                  }
                });
              }
            };

            populateDesignations(wsPgSel ? wsPgSel.value : '');

            if (wsPgSel) {
              wsPgSel.onchange = function () {
                populateDesignations(this.value);
              };
            }

            if (wsDesigSel && wsDesigSel.tagName === 'SELECT') {
              wsDesigSel.onchange = function () {
                var selOpt = this.options[this.selectedIndex];
                if (selOpt && selOpt.dataset.payGroup && wsPgSel && !wsPgSel.value) {
                  wsPgSel.value = selOpt.dataset.payGroup;
                }
                if (wsPosSel && !wsPosSel.value && this.value) {
                  wsPosSel.value = this.value;
                }
              };
            }
          });
        };

        if (wsUnitSel) {
          wsUnitSel.addEventListener('change', function () {
            updateWsPayGroups(this.value);
          });
        }
        if (wsPosSel) {
          wsPosSel.addEventListener('change', function () {
            var selectedPos = this.value;
            if (selectedPos && wsDesigSel && !wsDesigSel.value) {
              wsDesigSel.value = selectedPos;
            }
          });
        }
      }

      if (schema.table === 'designations') {
        var categorySelect = document.getElementById('field-pg_category');
        var designationPgSelect = document.getElementById('field-pay_group');
        var categoryRows = [];
        api.read('pay_groups').then(function(rows) {
          categoryRows = rows || [];
          if (categorySelect) {
            var categories = {};
            categoryRows.forEach(function(row) { if (row.pg_category) categories[row.pg_category] = true; });
            categorySelect.innerHTML = '<option value="">-- Select category --</option>';
            Object.keys(categories).sort().forEach(function(category) {
              var option = document.createElement('option'); option.value = category; option.textContent = category; categorySelect.appendChild(option);
            });
          }
          if (categorySelect) categorySelect.dispatchEvent(new Event('change'));
        });
        if (categorySelect && designationPgSelect) {
          categorySelect.addEventListener('change', function() {
            var category = this.value;
            designationPgSelect.innerHTML = '<option value="">-- Select pay group --</option>';
            var seenPg = {};
            var stdOrder = ['PG-1', 'PG-3(2)', 'PG-4', 'PG-5', 'PG-6', 'PG-7', 'PG-8', 'PG-9', 'PG-10', 'PG-11', 'PG-12', 'LOCAL'];
            var matchedPgs = [];
            categoryRows.filter(function(row) { return !category || String(row.pg_category) === category; }).forEach(function(row) {
              var p = String(row.pay_group || '').trim();
              if (p && !seenPg[p]) {
                seenPg[p] = true;
                matchedPgs.push(p);
              }
            });
            matchedPgs.sort(function(a, b) {
              var iA = stdOrder.indexOf(a);
              var iB = stdOrder.indexOf(b);
              if (iA !== -1 && iB !== -1) return iA - iB;
              if (iA !== -1) return -1;
              if (iB !== -1) return 1;
              return a.localeCompare(b);
            });
            matchedPgs.forEach(function(pg) {
              var option = document.createElement('option');
              option.value = pg;
              option.textContent = pg;
              designationPgSelect.appendChild(option);
            });
          });
        }
      }

      if (schema.table === 'pay_groups') {
        var pgInput = document.getElementById('field-pay_group');
        var rankInput = document.getElementById('field-rank_level');
        var rankMap = {
          'PG-1': 1, 'PG-3(2)': 4, 'PG-4': 5, 'PG-5': 6, 'PG-6': 7,
          'PG-7': 8, 'PG-8': 9, 'PG-9': 10, 'PG-10': 11, 'PG-11': 12, 'PG-12': 13
        };
        if (pgInput && rankInput) {
          pgInput.addEventListener('change', function () {
            var val = (this.value || '').trim();
            if (rankMap[val] !== undefined) {
              rankInput.value = rankMap[val];
            }
          });
        }
      }
    },

    updateLocationStationDependency: async function (container, selectedLocId, selectedStationId) {
      if (!container) return;
      var stnSelect = container.querySelector('[name="station_id"]') || container.querySelector('[name="station_code"]');
      if (!stnSelect) return;

      if (!selectedLocId) return;

      try {
        var locations = await api.read('work_locations');
        var loc = (locations || []).find(function (l) {
          return String(l.location_id || l.location_code || '').trim().toLowerCase() === String(selectedLocId).trim().toLowerCase();
        });

        if (loc && loc.station_id) {
          stnSelect.value = selectedStationId || loc.station_id;
        }
      } catch (e) {
        console.warn('Error updating location-station dependency:', e);
      }
    },

    handleFormSubmit: function (e, formKey) {
      e.preventDefault();
      var schema = AppSchemas[formKey];
      if (!schema) return;

      var form = document.getElementById('org-dynamic-form');
      if (!form) return;

      var saveBtn = document.getElementById('btn-org-save');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="material-icons animate-spin" style="font-size: 16px;">sync</span> Saving...';
      }

      var formData = new FormData(form);
      var payload = {};
      formData.forEach(function (val, key) {
        payload[key] = val;
      });

      if (formKey === 'workforce_setup') {
        var sNum = payload.sanctioned_posts || payload.staff_number || payload.set_up;
        if (sNum !== undefined && sNum !== '') {
          payload.sanctioned_posts = sNum;
          payload.staff_number = sNum;
          payload.set_up = sNum;
        }
        var wsPgEl = document.getElementById('field-pay_group');
        if (wsPgEl && wsPgEl.selectedIndex >= 0) {
          var selOpt = wsPgEl.options[wsPgEl.selectedIndex];
          if (selOpt && selOpt.dataset.payGroup) {
            payload.pay_group = selOpt.dataset.payGroup;
          }
          if (selOpt && selOpt.dataset.designation && !payload.designation) {
            payload.designation = selOpt.dataset.designation;
          }
        }
        if (payload.position_id && !payload.designation) {
          payload.designation = payload.position_id;
        }
        if (payload.station_code && !payload.station_id) {
          payload.station_id = payload.station_code;
        }
        if (payload.duty_pattern && !payload.shift_type) {
          payload.shift_type = payload.duty_pattern;
        }
      } else if (formKey === 'shifts') {
        if (!payload.unit_id && payload.dep_id) {
          payload.unit_id = payload.dep_id;
        }
        delete payload.station_code;
        delete payload.station_id;
        delete payload.dep_id;
      }

      api.create(schema.table, payload, schema.prefix, schema.pk)
        .then(function (savedRec) {
          app.toast('Record successfully saved in ' + schema.title, 'success');
          form.reset();
          if (orgViews.masterData && orgViews.masterData[schema.table]) {
            orgViews.masterData[schema.table].push(savedRec || payload);
          }
          if (schema.table === 'organization_units') {
            orgViews.populateFormSelects(schema);
            var prevEl = document.getElementById('org-hierarchy-preview-text');
            if (prevEl) {
              prevEl.innerHTML = '<em>No parent selected. This unit will be created at the Top-Level (Corporate / Root Authority).</em>';
            }
          } else if (schema.table === 'workforce_setup') {
            orgViews.populateFormSelects(schema);
            var wsPrevEl = document.getElementById('ws-hierarchy-preview-text');
            if (wsPrevEl) {
              wsPrevEl.innerHTML = '<em>Select an Organization Unit to preview its Directorate, Department, and Section hierarchy chain.</em>';
            }
          } else if (schema.table === 'pay_groups') {
            orgViews.populateFormSelects(schema);
            var pgPrevEl = document.getElementById('pg-reporting-preview-text');
            if (pgPrevEl) {
              pgPrevEl.innerHTML = '<em>Select an Organization Unit and Immediate Reporting Boss to preview the corporate reporting chain.</em>';
            }
          }
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span class="material-icons" style="font-size: 16px;">save</span> <span>Save Record</span>';
          }
          if (typeof orgViews.loadGridData === 'function') {
            orgViews.loadGridData(formKey, false);
          }
        })
        .catch(function (err) {
          if (err.isDuplicate || (err.message && (err.message.indexOf('already exists') !== -1 || err.message.indexOf('Duplicate') !== -1))) {
            Components.showDuplicateModal(err.message, 'Form: ' + schema.title);
          } else {
            app.toast('Save failed: ' + err.message, 'error');
          }
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span class="material-icons" style="font-size: 16px;">save</span> <span>Save Record</span>';
          }
        });
    },

    openViewGrid: function (formKey) {

        formKey = 'organization_units';
      }
      var schema = AppSchemas[formKey];

          { key: 'DIRECTORATE', label: 'Directorates' },
          { key: 'DIVISION', label: 'Divisions' },
          { key: 'DEPARTMENT', label: 'Departments' },

          tierFilterHtml += `<button type="button" class="tier-filter-pill ${isAct}" id="tier-pill-${t.key}" data-tier="${t.key}" onclick="orgViews.filterTier('${t.key}')" style="padding: 2px 7px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; border: 1px solid; ${actBg} cursor: pointer; transition: all 0.15s ease;"><span class="tier-label">${t.label}</span> <span class="tier-badge-count" id="tier-count-${t.key}" style="opacity: 0.85; font-size: 10px; font-weight: 800;"></span></button>`;

          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-icons" style="color: #0f766e; font-size: 18px;">${schema.table === 'organization_units' ? 'account_tree' : 'table_chart'}</span>
            <h3 style="font-size: 0.8125rem; font-weight: 800; text-transform: uppercase; color: #0f172a;">${viewTitle} - Records View</h3>
          </div>
          ${tierFilterHtml}
          <button type="button" class="btn-cancel" style="padding: 0.25rem 0.55rem; color: #ffffff; background: #0f766e; border-color: #0f766e; font-size: 11px; margin-left: ${formKey === 'organization_units' ? '0' : 'auto'};" onclick="orgViews.loadGridData('${formKey}', true)">
            <span class="material-icons" style="font-size: 13px;">sync</span>
            <span>Refresh</span>
          </button>
        </div>

        <div class="table-container" style="flex: 1; min-height: 0; overflow: auto; background-color: #ffffff; border: none;">
          <table class="standard-data-table" id="org-data-table" style="width: max-content; table-layout: auto; border-collapse: separate; border-spacing: 0;">
            <thead>

              <tr><td colspan="${schema.fields.length + 3}" style="text-align: center; padding: 1.5rem; color: #64748b;"><span class="material-icons animate-spin" style="font-size: 16px; vertical-align: middle; margin-right: 0.4rem;">sync</span>Loading records...</td></tr>

    filterTier: function (tier) {
      this.selectedTier = tier;
      document.querySelectorAll('.tier-filter-pill').forEach(function (pill) {
        var isMatch = pill.dataset.tier === tier;
        pill.classList.toggle('active', isMatch);
        pill.style.background = isMatch ? '#0f766e' : '#ffffff';
        pill.style.color = isMatch ? '#ffffff' : '#1e293b';
        pill.style.borderColor = isMatch ? '#0f766e' : '#cbd5e1';
      });
      if (this.gridContext && this.gridContext.records) {
        this.renderTableRows(this.gridContext);
      }
    },

    renderTableRows: function (ctx) {
      var tbody = document.getElementById('org-grid-body');
      if (!tbody || !ctx) return;

      var records = ctx.records || [];
      var schema = ctx.schema;
      var formKey = ctx.formKey;
      var unitMap = ctx.unitMap || {};
      var childMap = ctx.childMap || {};
      var locMap = ctx.locMap || {};
      var stnMap = ctx.stnMap || {};
      var tier = this.selectedTier || 'ALL';

      var filtered = records.slice();
      if (formKey === 'organization_units') {
        var hierarchyOrder = {
          'CORPORATE': 1,
          'DIRECTORATE': 2,
          'DIVISION': 3,
          'DEPARTMENT': 4,
          'WING': 5,
          'SECTION': 6,
          'UNIT': 7
        };

        filtered.sort(function (a, b) {
          var tA = orgViews.detectUnitTier(a);
          var tB = orgViews.detectUnitTier(b);
          var pA = hierarchyOrder[tA] || 99;
          var pB = hierarchyOrder[tB] || 99;
          if (pA !== pB) return pA - pB;
          return String(a.unit_name || '').localeCompare(String(b.unit_name || ''));
        });

        if (tier !== 'ALL') {
          filtered = filtered.filter(function (r) {
            return orgViews.detectUnitTier(r) === tier;
          });
        }
      }

      if (filtered.length === 0) {
        var colSpan = schema.fields.length + (formKey === 'organization_units' ? 4 : 3);
        tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align: center; padding: 2rem; color: #64748b;">No records found matching ${tier !== 'ALL' ? tier : 'criteria'}.</td></tr>`;
        return;
      }

      var bHtml = '';
      filtered.forEach(function (r, idx) {
        var pkVal = r[schema.pk] || r.id || ('#' + (idx + 1));
        bHtml += `<tr>`;
        bHtml += `<td style="text-align: center; font-weight: 700; color: #64748b;">${idx + 1}</td>`;
        bHtml += `<td style="font-weight: 700; color: #0f766e; font-family: monospace;">${pkVal}</td>`;
        schema.fields.forEach(function (f) {
          var val = r[f.name];
          if (formKey === 'organization_units' && f.name === 'parent_unit_id') {
            var rawParent = (val === null || val === undefined) ? '' : String(val).trim();
            if (!rawParent || rawParent.toUpperCase() === 'NULL' || rawParent === '-') {
              bHtml += `<td style="white-space: nowrap; color: #94a3b8; text-align: center;">-</td>`;
            } else {
              var parentU = unitMap[rawParent] || unitMap[rawParent.toUpperCase()];
              var parentName = parentU ? (parentU.unit_name || parentU.unit_code || '-').trim() : rawParent;
              bHtml += `<td style="white-space: nowrap; font-weight: 600; color: #0f172a;">${parentName}</td>`;
            }
          } else if (f.name === 'location_id') {
            var locDisp = (val && locMap[val]) ? locMap[val] : (val || '-');
            bHtml += `<td style="white-space: nowrap; color: #0f172a;">${locDisp}</td>`;
          } else if (f.name === 'station_id' || f.name === 'station_code') {
            var rawStn = val || r.station_code || r.station_id || r.station || '';
            var stnCode = String(rawStn).trim().toUpperCase();
            bHtml += `<td style="white-space: nowrap; font-family: monospace; font-weight: 700; color: #0f172a;">${stnCode || '-'}</td>`;
          } else if (f.name === 'unit_id' || f.name === 'dep_id') {
            var uObj = (val && (unitMap[val] || unitMap[String(val).trim().toUpperCase()])) ? (unitMap[val] || unitMap[String(val).trim().toUpperCase()]) : null;
            var uDisp = uObj ? (uObj.unit_name || uObj.unit_code || val) : (val || '-');
            bHtml += `<td style="white-space: nowrap; font-weight: 600; color: #0f172a;">${uDisp}</td>`;
          } else if (f.name === 'position_id') {
            var pDisp = (val && (ctx.posMap || {})[val]) ? ((ctx.posMap || {})[val].position_title || (ctx.posMap || {})[val].position_code) : (val || '-');
            bHtml += `<td style="white-space: nowrap; color: #0f172a;">${pDisp}</td>`;
          } else if (formKey === 'organization_units' && f.name === 'unit_type') {
            var rawType = (val === null || val === undefined) ? '' : String(val).trim();
            if (!rawType || rawType.toUpperCase() === 'NULL' || rawType === '-') {
              bHtml += `<td style="white-space: nowrap; color: #94a3b8; text-align: center;">-</td>`;
            } else {
              var uType = rawType.toUpperCase();
              var badgeBg = '#f1f5f9';
              var badgeText = '#0f172a';
              var badgeBorder = '#cbd5e1';
              if (uType === 'MD & CEO' || uType === 'CEO' || uType === 'CORPORATE' || uType === 'EXECUTIVE') {
                badgeBg = '#fee2e2'; badgeText = '#991b1b'; badgeBorder = '#f87171';
              } else if (uType === 'DIRECTORATE' || uType === 'HEADQUARTER') {
                badgeBg = '#ffedd5'; badgeText = '#9a3412'; badgeBorder = '#fb923c';
              } else if (uType === 'DIVISION') {
                badgeBg = '#fef3c7'; badgeText = '#92400e'; badgeBorder = '#fcd34d';
              } else if (uType === 'DEPARTMENT') {
                badgeBg = '#dcfce7'; badgeText = '#166534'; badgeBorder = '#4ade80';
              } else if (uType === 'WING' || uType === 'SUB-WING') {
                badgeBg = '#e0e7ff'; badgeText = '#3730a3'; badgeBorder = '#818cf8';
              } else if (uType === 'SECTION') {
                badgeBg = '#f3e8ff'; badgeText = '#6b21a8'; badgeBorder = '#c084fc';
              } else if (uType === 'UNIT' || uType === 'TEAM') {
                badgeBg = '#ccfbf1'; badgeText = '#0f766e'; badgeBorder = '#2dd4bf';
              }
              bHtml += `<td style="white-space: nowrap;"><span style="background: ${badgeBg}; color: ${badgeText}; border: 1px solid ${badgeBorder}; padding: 1px 6px; border-radius: 3px; font-weight: 700; font-size: 10px; display: inline-block;">${rawType}</span></td>`;
            }
          } else {
            var strVal = (val === null || val === undefined) ? '' : String(val).trim();
            if (!strVal || strVal.toUpperCase() === 'NULL') {
              bHtml += `<td style="white-space: nowrap; color: #94a3b8; text-align: center;">-</td>`;
            } else {
              bHtml += `<td style="white-space: nowrap; color: #0f172a;">${strVal}</td>`;
            }
          }
        });
        if (formKey === 'organization_units') {
          var pkNorm = String(pkVal || '').trim().toUpperCase();
          var codeNorm = String(r.unit_code || '').trim().toUpperCase();
          var nameNorm = String(r.unit_name || '').trim().toUpperCase();
          var childrenList = childMap[pkNorm] || (codeNorm ? childMap[codeNorm] : null) || (nameNorm ? childMap[nameNorm] : null) || [];
          if (childrenList.length > 0) {
            var childTitles = childrenList.map(function (c) { return c.name + (c.unit_type ? ' [' + c.unit_type + ']' : ''); }).join(', ');
            bHtml += `<td style="white-space: nowrap;"><span style="background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; padding: 2px 7px; border-radius: 4px; font-weight: 700; font-size: 11px;" title="${childTitles}">${childrenList.length} Sub-unit(s)</span></td>`;
          } else {
            bHtml += `<td style="white-space: nowrap; color: #94a3b8; font-size: 11px; text-align: center;">-</td>`;
          }
        }
        bHtml += `
        <td style="text-align: right; padding-right: 0.5rem; white-space: nowrap; position: sticky; right: 0; background-color: #ffffff; box-shadow: -2px 0 4px rgba(0,0,0,0.05);">
          <button type="button" class="btn-table-edit" onclick="orgViews.openRecordEditView('${formKey}', '${pkVal}')" title="Edit this record">
            <span class="material-icons" style="font-size: 12px;">edit</span>
            <span>Edit</span>
          </button>
          <button type="button" class="btn-table-delete" style="margin-left: 0.2rem;" onclick="orgViews.deleteRecord('${formKey}', '${pkVal}')" title="Delete this record">
            <span class="material-icons" style="font-size: 12px;">delete</span>
            <span>Delete</span>
          </button>
        </td>
      `;
        bHtml += `</tr>`;
      });
      tbody.innerHTML = bHtml;
    },

    loadGridData: function (formKey, forceRefresh) {
      if (formKey === 'directorates' || formKey === 'departments' || formKey === 'sections') {
        formKey = 'organization_units';
      }
      var schema = AppSchemas[formKey];
      if (!schema) return;

      var headerRow = document.getElementById('org-grid-header');
      var tbody = document.getElementById('org-grid-body');
      if (!headerRow || !tbody) return;

      var thHtml = `<th style="text-align: center; position: sticky; top: 0; background-color: #f1f5f9; z-index: 10; border-bottom: 2px solid #cbd5e1; white-space: nowrap;">SL</th>`;
      thHtml += `<th style="position: sticky; top: 0; background-color: #f1f5f9; z-index: 10; border-bottom: 2px solid #cbd5e1; white-space: nowrap;">Record ID</th>`;
      schema.fields.forEach(function (f) {
        var colLabel = f.label;
        if (formKey === 'organization_units' && f.name === 'parent_unit_id') {
          colLabel = 'Parent Unit';
        }
        thHtml += `<th style="position: sticky; top: 0; background-color: #f1f5f9; z-index: 10; border-bottom: 2px solid #cbd5e1; white-space: nowrap;">${colLabel}</th>`;
      });
      if (formKey === 'organization_units') {
        thHtml += `<th style="position: sticky; top: 0; background-color: #f1f5f9; z-index: 10; border-bottom: 2px solid #cbd5e1; white-space: nowrap;">Sub Units</th>`;
      }
      thHtml += `<th style="text-align: right; padding-right: 0.5rem; position: sticky; top: 0; right: 0; background-color: #f1f5f9; z-index: 15; border-bottom: 2px solid #cbd5e1; box-shadow: -2px 0 4px rgba(0,0,0,0.05); white-space: nowrap;">Action</th>`;
      headerRow.innerHTML = thHtml;

      var self = this;
      var getRef = function (tbl) {
        if (self.masterData && self.masterData[tbl] && self.masterData[tbl].length > 0) {
          return Promise.resolve(self.masterData[tbl]);
        }
        return api.read(tbl, false).catch(function () { return []; });
      };

      Promise.all([
        api.read(schema.table, !!forceRefresh),
        getRef('work_locations'),
        getRef('stations'),
        getRef('organization_units'),
        getRef('positions'),
        getRef('pay_groups')
      ]).then(function (results) {
        var records = results[0];
        var workLocations = results[1] || [];
        var stations = results[2] || [];
        var allUnits = results[3] || [];
        var allPositions = results[4] || [];
        var allPayGroups = results[5] || [];

        var locMap = {};
        workLocations.forEach(function (l) {
          locMap[l.location_id] = l.location_name || l.location_code || l.location_id;
          if (l.location_code) locMap[l.location_code] = l.location_name || l.location_code;
        });

        var stnMap = {};
        stations.forEach(function (s) {
          var sCode = String(s.station_code || s.station_id || '').trim().toUpperCase();
          if (sCode) {
            stnMap[sCode] = sCode;
            if (s.station_id) stnMap[String(s.station_id).trim().toUpperCase()] = sCode;
          }
        });

        var unitMap = {};
        var childMap = {};

        // 1. Build canonical unit index by ID, Code, and Name
        var canonicalParentById = {};
        var keyToCanonicalId = {};

        (allUnits || []).forEach(function (u) {
          if (!u) return;
          if (u.is_deleted === true || u.is_deleted === 'TRUE' || String(u.status || '').trim().toUpperCase() === 'DELETED') return;

          var uid = String(u.unit_id || '').trim();
          var ucode = String(u.unit_code || '').trim();
          var uname = String(u.unit_name || '').trim();

          if (uid) {
            unitMap[uid] = u;
            unitMap[uid.toUpperCase()] = u;
            canonicalParentById[uid.toUpperCase()] = u;
            keyToCanonicalId[uid.toUpperCase()] = uid.toUpperCase();
          }
          if (ucode) {
            unitMap[ucode] = u;
            unitMap[ucode.toUpperCase()] = u;
            if (uid) keyToCanonicalId[ucode.toUpperCase()] = uid.toUpperCase();
          }
          if (uname) {
            if (uid) keyToCanonicalId[uname.toUpperCase()] = uid.toUpperCase();
          }
        });

        // 2. Build accurate child map linking child units to parent identifiers
        (allUnits || []).forEach(function (u) {
          if (!u) return;
          if (u.is_deleted === true || u.is_deleted === 'TRUE' || String(u.status || '').trim().toUpperCase() === 'DELETED') return;

          var rawParent = String(u.parent_unit_id || '').trim();
          if (!rawParent || rawParent.toUpperCase() === 'NULL' || rawParent === '-') return;

          var parentNorm = rawParent.toUpperCase();
          var canonicalParentKey = keyToCanonicalId[parentNorm] || parentNorm;
          var parentUnitObj = canonicalParentById[canonicalParentKey] || canonicalParentById[parentNorm];

          var childName = (u.unit_name || u.unit_code || u.unit_id || '').trim();
          var childObj = {
            unit_id: u.unit_id,
            unit_code: u.unit_code,
            name: childName,
            unit_type: u.unit_type
          };

          var regChildKey = function (k) {
            if (!k) return;
            var normK = String(k).trim().toUpperCase();
            if (!childMap[normK]) childMap[normK] = [];
            var already = childMap[normK].some(function (c) {
              return c.unit_id && u.unit_id ? (String(c.unit_id).trim() === String(u.unit_id).trim()) : (c.name === childName);
            });
            if (!already) {
              childMap[normK].push(childObj);
            }
          };

          regChildKey(parentNorm);
          regChildKey(canonicalParentKey);
          if (parentUnitObj) {
            if (parentUnitObj.unit_id) regChildKey(parentUnitObj.unit_id);
            if (parentUnitObj.unit_code) regChildKey(parentUnitObj.unit_code);
            if (parentUnitObj.unit_name) regChildKey(parentUnitObj.unit_name);
          }
        });

        var posMap = {};
        (allPositions || []).forEach(function (p) {
          posMap[p.position_id] = p;
          if (p.position_code) posMap[p.position_code] = p;
          if (p.position_title) posMap[p.position_title] = p;
        });

        var pgMap = {};
        (allPayGroups || []).forEach(function (pg) {
          pgMap[pg.pg_id] = pg;
        });

        self.gridContext = {
          records: records,
          schema: schema,
          formKey: formKey,
          unitMap: unitMap,
          posMap: posMap,
          pgMap: pgMap,
          childMap: childMap,
          locMap: locMap,
          stnMap: stnMap
        };

        if (formKey === 'organization_units') {
          var counts = { ALL: 0, CORPORATE: 0, DIRECTORATE: 0, DIVISION: 0, DEPARTMENT: 0, WING: 0, SECTION: 0, UNIT: 0 };
          (records || []).forEach(function (r) {
            if (r.is_deleted === true || r.is_deleted === 'TRUE' || String(r.status || '').trim().toUpperCase() === 'DELETED') return;
            counts.ALL++;
            var t = self.detectUnitTier(r);
            if (counts[t] !== undefined) counts[t]++;
          });
          Object.keys(counts).forEach(function (k) {
            var cEl = document.getElementById('tier-count-' + k);
            if (cEl) cEl.innerText = '(' + counts[k] + ')';
            var pill = document.getElementById('tier-pill-' + k);
            if (pill && k !== 'ALL') {
              pill.style.display = counts[k] > 0 ? 'inline-flex' : 'none';
            }
          });
        }

        self.renderTableRows(self.gridContext);
      }).catch(function (err) {
        tbody.innerHTML = `<tr><td colspan="${schema.fields.length + 4}" style="text-align: center; padding: 2rem; color: var(--status-danger);">Failed to load: ${err.message}</td></tr>`;
      });
    },

    openRecordEditView: function (formKey, pkVal) {
      var schema = AppSchemas[formKey];
      var self = this;
      api.read(schema.table).then(function (records) {
        var strPk = String(pkVal || '').trim().toLowerCase();
        var row = (records || []).find(function (r) {
          var rPk = r[schema.pk] || (schema.pk ? r[schema.pk.toLowerCase()] : null) || r.id || r._rowNumber;
          return String(rPk || '').trim().toLowerCase() === strPk || String(r._rowNumber || '').trim() === strPk.replace(/^#/, '');
        });
        if (!row) return app.toast('Record not found', 'error');

        var mount = document.getElementById('org-view-mount');
        if (!mount) return;
        mount.scrollTop = 0;

        var hierarchyHeaderHtml = '';
        if (formKey === 'organization_units') {
          hierarchyHeaderHtml = `
          <div style="background: rgba(13, 148, 136, 0.08); border: 1.5px solid #0f766e; border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: #0f172a;">
            <div style="font-weight: 800; font-size: 0.78rem; color: #0f766e; text-transform: uppercase; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">

              <span>Parent-Child Hierarchy Relationships</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.25rem; line-height: 1.5; color: #0f172a;">
              <div><strong>Current Unit:</strong> ${row.unit_name || row.unit_code} [${row.unit_type || orgViews.detectUnitTier(row)}] (${pkVal})</div>
              <div id="org-edit-ancestry-path"><strong>Hierarchy Path:</strong> Loading ancestry...</div>
              <div id="org-edit-subordinates-box"><strong>Direct Sub Units (Children):</strong> Loading children...</div>
            </div>
          </div>
        `;
        } else if (formKey === 'pay_groups') {
          hierarchyHeaderHtml = `
          <div style="background: rgba(13, 148, 136, 0.08); border: 1.5px solid #0f766e; border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: #0f172a;">
            <div style="font-weight: 800; font-size: 0.78rem; color: #0f766e; text-transform: uppercase; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
              <span class="material-icons" style="font-size: 16px; color: #0f766e;">hub</span>
              <span>Designation Reporting Hierarchy Chain</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.25rem; line-height: 1.5; color: #0f172a;">
              <div><strong>Active Designation:</strong> ${row.designation || '-'} (${row.pay_group || '-'}) [${pkVal}]</div>
              <div id="pg-edit-reporting-chain"><strong>Reporting Line:</strong> Loading reporting chain...</div>

                var sType = String(foundStn.station_type || '').toLowerCase();
                var sCity = String(foundStn.city || '').trim().toUpperCase();
                var isForeignStn = sType.indexOf('foreign') !== -1;
                var isBangladesh = !isForeignStn || (sType.indexOf('base') !== -1 || sType.indexOf('home') !== -1) ||
                  ['DHAKA', 'CHITTAGONG', 'SYLHET', 'COX\'S BAZAR', 'JESSORE', 'SAIDPUR', 'RAJSHAHI', 'BARISAL'].indexOf(sCity) !== -1;

                if (editCountryInp) {
                  if (foundStn.country && String(foundStn.country).trim().toLowerCase() !== 'foreign') {
                    editCountryInp.value = foundStn.country;
                  } else if (isBangladesh) {
                    editCountryInp.value = 'Bangladesh';
                  } else {
                    editCountryInp.value = '';
                  }
                }
                if (editRegionSel) {
                  if (isBangladesh) {
                    editRegionSel.value = 'Home';
                  } else if (foundStn.region) {
                    editRegionSel.value = foundStn.region;
                  }
                }
              }
            });
          });
        }

        if (editCitySel) {
          editCitySel.addEventListener('change', function () {
            var selCity = this.value;
            if (!selCity) return;
            api.read('stations').then(function (stations) {
              var currStnVal = editStnSel2 ? editStnSel2.value : '';
              var matchingStations = (stations || []).filter(function (s) {
                return !selCity || String(s.city || '').trim().toLowerCase() === String(selCity).trim().toLowerCase();
              });
              if (editStnSel2) {
                editStnSel2.innerHTML = '<option value="">-- None / Head Office (Non-Airport Facility) --</option>';
                matchingStations.forEach(function (s) {
                  var sCode = s.station_code || s.station_id;
                  var opt = document.createElement('option');
                  opt.value = sCode;
                  opt.textContent = sCode;
                  if (sCode === currStnVal) opt.selected = true;
                  editStnSel2.appendChild(opt);
                });
              }
            });
          });
        }
      }

      if (schema.table === 'pay_groups') {
        var editPgInput = document.getElementById('edit-field-pay_group');
        var editRankInput = document.getElementById('edit-field-rank_level');
        var rankMap = {
          'PG-1': 1, 'PG-3(2)': 4, 'PG-4': 5, 'PG-5': 6, 'PG-6': 7,
          'PG-7': 8, 'PG-8': 9, 'PG-9': 10, 'PG-10': 11, 'PG-11': 12, 'PG-12': 13
        };
        if (editPgInput && editRankInput) {
          editPgInput.addEventListener('change', function () {
            var val = (this.value || '').trim();
            if (rankMap[val] !== undefined) {
              editRankInput.value = rankMap[val];
            }
          });
        }
      }

      if (schema.table === 'designations') {
        var editCategorySelect = document.getElementById('edit-field-pg_category');
        var editPgSelect = document.getElementById('edit-field-pay_group');
        var editCategoryRows = [];
        api.read('pay_groups').then(function(rows) {
          editCategoryRows = rows || [];
          if (editCategorySelect) {
            var categories = {};
            editCategoryRows.forEach(function(r) { if (r.pg_category) categories[r.pg_category] = true; });
            var targetCat = row.pg_category || editCategorySelect.value;
            editCategorySelect.innerHTML = '<option value="">-- Select category --</option>';
            Object.keys(categories).sort().forEach(function(category) {
              var option = document.createElement('option');
              option.value = category;
              option.textContent = category;
              if (category === targetCat) option.selected = true;
              editCategorySelect.appendChild(option);
            });
            if (targetCat && !categories[targetCat]) {
              var optFallback = document.createElement('option');
              optFallback.value = targetCat;
              optFallback.textContent = targetCat;
              optFallback.selected = true;
              editCategorySelect.appendChild(optFallback);
            }
          }

          var populateEditPgs = function(cat, initialPg) {
            if (!editPgSelect) return;
            var currPg = initialPg !== undefined ? initialPg : editPgSelect.value;
            editPgSelect.innerHTML = '<option value="">-- Select pay group --</option>';
            var seenPg = {};
            var stdOrder = ['PG-1', 'PG-3(2)', 'PG-4', 'PG-5', 'PG-6', 'PG-7', 'PG-8', 'PG-9', 'PG-10', 'PG-11', 'PG-12', 'LOCAL'];
            var matchedPgs = [];
            editCategoryRows.filter(function(r) { return !cat || String(r.pg_category) === cat; }).forEach(function(r) {
              var p = String(r.pay_group || '').trim();
              if (p && !seenPg[p]) {
                seenPg[p] = true;
                matchedPgs.push(p);
              }
            });
            matchedPgs.sort(function(a, b) {
              var iA = stdOrder.indexOf(a);
              var iB = stdOrder.indexOf(b);
              if (iA !== -1 && iB !== -1) return iA - iB;
              if (iA !== -1) return -1;
              if (iB !== -1) return 1;
              return a.localeCompare(b);
            });
            matchedPgs.forEach(function(pg) {
              var opt = document.createElement('option');
              opt.value = pg;
              opt.textContent = pg;
              if (pg === currPg) opt.selected = true;
              editPgSelect.appendChild(opt);
            });
            if (currPg && !seenPg[currPg]) {
              var optExtra = document.createElement('option');
              optExtra.value = currPg;
              optExtra.textContent = currPg;
              optExtra.selected = true;
              editPgSelect.appendChild(optExtra);
            }
          };

          populateEditPgs(row.pg_category, row.pay_group);

          if (editCategorySelect) {
            editCategorySelect.onchange = function() {
              populateEditPgs(this.value, '');
            };
          }
        });
      }

      if (schema.table === 'workforce_setup') {
        var editWsUnitSel = document.getElementById('edit-field-unit_id') || document.getElementById('field-unit_id');
        var editWsPgSel = document.getElementById('edit-field-pay_group') || document.getElementById('field-pay_group');
        var editWsDesigInp = document.getElementById('edit-field-designation') || document.getElementById('field-designation');
        var editWsPosSel = document.getElementById('edit-field-position_id') || document.getElementById('field-position_id');

        var updateEditWsPayGroups = function (selectedUnitId, currentPgVal) {
          Promise.all([
            api.read('pay_groups').catch(function () { return []; }),
            api.read('organization_units').catch(function () { return []; })
          ]).then(function (res) {
            var pgs = res[0] || [];
            var orgUnits = res[1] || [];
            var matchedU = null;
            if (selectedUnitId) {
              matchedU = orgUnits.find(function (u) {
                return String(u.unit_id || u.unit_code || '').trim().toUpperCase() === String(selectedUnitId).trim().toUpperCase();
              });
            }
            var ancestorIds = {};
            var chain = [];
            if (matchedU) {
              var currU = matchedU;
              var visitedU = {};
              while (currU && !visitedU[currU.unit_id]) {
                visitedU[currU.unit_id] = true;
                chain.unshift(currU.unit_name || currU.unit_code);
                if (currU.unit_id) ancestorIds[String(currU.unit_id).trim().toUpperCase()] = true;
                if (currU.unit_code) ancestorIds[String(currU.unit_code).trim().toUpperCase()] = true;
                var parentId = currU.parent_unit_id ? String(currU.parent_unit_id).trim().toUpperCase() : null;
                currU = parentId ? orgUnits.find(function (ou) {
                  return String(ou.unit_id || ou.unit_code || '').trim().toUpperCase() === parentId;
                }) : null;
              }
            }

            var prevWsEl = document.getElementById('ws-edit-hierarchy-preview-text');
            if (prevWsEl) {
              if (chain.length > 0) {
                prevWsEl.innerHTML = '<span style="color: #0f766e; font-weight: 800;">Ancestry Path:</span> ' + chain.join(' ➔ ');
              } else {
                prevWsEl.innerHTML = '<em>Select an Organization Unit to preview its Directorate, Department, and Section hierarchy chain.</em>';
              }
            }

            var filtered = pgs.filter(function (pg) {
              var pgU = String(pg.unit_id || '').trim().toUpperCase();
              if (!pgU || pgU === 'ALL' || pgU === 'CORPORATE') return true;
              if (ancestorIds[pgU]) return true;
              return false;
            });

            if (!selectedUnitId) filtered = pgs;

            var uniquePgs = {};
            filtered.forEach(function (item) {
              var p = (item.pay_group || '').trim();
              if (p) uniquePgs[p] = true;
            });
            var stdOrder = ['PG-1', 'PG-3(2)', 'PG-4', 'PG-5', 'PG-6', 'PG-7', 'PG-8', 'PG-9', 'PG-10', 'PG-11', 'PG-12', 'LOCAL'];
            var sortedPgs = Object.keys(uniquePgs).sort(function (a, b) {
              var iA = stdOrder.indexOf(a);
              var iB = stdOrder.indexOf(b);
              if (iA !== -1 && iB !== -1) return iA - iB;
              if (iA !== -1) return -1;
              if (iB !== -1) return 1;
              return a.localeCompare(b);
            });

            var targetPg = currentPgVal !== undefined ? currentPgVal : (editWsPgSel ? editWsPgSel.value : '');
            if (editWsPgSel) {
              editWsPgSel.innerHTML = '<option value="">-- Select Pay Group --</option>';
              sortedPgs.forEach(function (pg) {
                var opt = document.createElement('option');
                opt.value = pg;
                opt.textContent = pg; // ONLY clean single pay group name
                if (pg === targetPg) opt.selected = true;
                editWsPgSel.appendChild(opt);
              });
            }

            var populateEditDesignations = function (tPg, initialDesig) {
              if (!editWsDesigInp) return;
              if (editWsDesigInp.tagName === 'SELECT') {
                var desigList = filtered.filter(function (item) {
                  if (!tPg) return true;
                  return String(item.pay_group || '').trim().toUpperCase() === String(tPg).trim().toUpperCase();
                });
                var seenD = {};
                var currDesig = initialDesig !== undefined ? initialDesig : editWsDesigInp.value;
                editWsDesigInp.innerHTML = '<option value="">-- Select Designation --</option>';
                desigList.forEach(function (item) {
                  var d = (item.designation || '').trim();
                  if (d && !seenD[d]) {
                    seenD[d] = true;
                    var opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d; // ONLY clean designation name
                    opt.dataset.payGroup = item.pay_group || '';
                    if (d === currDesig) opt.selected = true;
                    editWsDesigInp.appendChild(opt);
                  }
                });
              }
            };

            populateEditDesignations(targetPg, row.designation);

            if (editWsPgSel) {
              editWsPgSel.onchange = function () {
                populateEditDesignations(this.value);
              };
            }
            if (editWsDesigInp && editWsDesigInp.tagName === 'SELECT') {
              editWsDesigInp.onchange = function () {
                var selOpt = this.options[this.selectedIndex];
                if (selOpt && selOpt.dataset.payGroup && editWsPgSel && !editWsPgSel.value) {
                  editWsPgSel.value = selOpt.dataset.payGroup;
                }
                if (editWsPosSel && !editWsPosSel.value && this.value) {
                  editWsPosSel.value = this.value;
                }
              };
            }
          });
        };

        if (editWsUnitSel) {
          editWsUnitSel.addEventListener('change', function () {
            updateEditWsPayGroups(this.value, '');
          });
        }
        if (editWsPosSel) {
          editWsPosSel.addEventListener('change', function () {
            var selectedPos = this.value;
            if (selectedPos && editWsDesigInp && !editWsDesigInp.value) {
              editWsDesigInp.value = selectedPos;
            }
          });
        }

        updateEditWsPayGroups(row.unit_id, row.pay_group);
      }
    },

    handleEditSubmit: function (e, formKey, pkVal) {
      e.preventDefault();
      var schema = AppSchemas[formKey];
      var form = document.getElementById('org-edit-form');
      var formData = new FormData(form);
      var payload = {};
      formData.forEach(function (val, key) { payload[key] = val; });

      if (formKey === 'workforce_setup') {
        var sNum = payload.sanctioned_posts || payload.staff_number || payload.set_up;
        if (sNum !== undefined && sNum !== '') {
          payload.sanctioned_posts = sNum;
          payload.staff_number = sNum;
          payload.set_up = sNum;
        }
        var editWsPgEl = document.getElementById('edit-field-pay_group');
        if (editWsPgEl && editWsPgEl.selectedIndex >= 0) {
          var selOpt2 = editWsPgEl.options[editWsPgEl.selectedIndex];
          if (selOpt2 && selOpt2.dataset.payGroup) {
            payload.pay_group = selOpt2.dataset.payGroup;
          }
          if (selOpt2 && selOpt2.dataset.designation && !payload.designation) {
            payload.designation = selOpt2.dataset.designation;
          }
        }
        if (payload.position_id && !payload.designation) {
          payload.designation = payload.position_id;
        }
        if (payload.station_code && !payload.station_id) {
          payload.station_id = payload.station_code;
        }
        if (payload.duty_pattern && !payload.shift_type) {
          payload.shift_type = payload.duty_pattern;
        }
      } else if (formKey === 'shifts') {
        if (!payload.unit_id && payload.dep_id) {
          payload.unit_id = payload.dep_id;
        }
        delete payload.station_code;
        delete payload.station_id;
        delete payload.dep_id;
      }

      api.update(schema.table, schema.pk, pkVal, payload).then(function () {
        app.toast('Record successfully updated', 'success');
        orgViews.openViewGrid(formKey);
      }).catch(function (err) {
        if (err.isDuplicate || (err.message && (err.message.indexOf('already exists') !== -1 || err.message.indexOf('Duplicate') !== -1))) {
          Components.showDuplicateModal(err.message, 'Edit: ' + schema.title);
        } else {
          app.toast('Update failed: ' + err.message, 'error');
        }
      });
    },

    deleteRecord: function (formKey, pkVal) {
      var schema = AppSchemas[formKey];
      if (!schema || !pkVal) return;

      Components.showConfirmModal({
        title: 'Delete ' + schema.title + ' Record',
        message: 'Are you sure you want to permanently delete record ' + pkVal + '?',
        onConfirm: function () {
          api.delete(schema.table, schema.pk, pkVal).then(function () {
            app.toast('Record deleted successfully', 'success');
            if (orgViews.masterData && orgViews.masterData[schema.table]) {
              orgViews.masterData[schema.table] = orgViews.masterData[schema.table].filter(function (item) {
                var itemPk = item[schema.pk] || item.id || '';
                return String(itemPk).trim().toLowerCase() !== String(pkVal).trim().toLowerCase();
              });
            }
            api.invalidateCache(schema.table);
            orgViews.loadGridData(formKey, true);
          }).catch(function (err) {
            var errMsg = (err && err.message) || String(err);
            if (errMsg.indexOf('no data rows') !== -1 || errMsg.indexOf('not found') !== -1 || errMsg.indexOf('absent') !== -1) {
              app.toast('Table cache synchronized: record is no longer present.', 'info');
              api.invalidateCache(schema.table);
              if (orgViews.masterData && orgViews.masterData[schema.table]) {
                delete orgViews.masterData[schema.table];
              }
              orgViews.loadGridData(formKey, true);
            } else {
              app.toast('Delete failed: ' + errMsg, 'error');
            }
          });
        }
      });
    }
  };
</script>
