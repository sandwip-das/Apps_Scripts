<script>
async function tqc_dashboard_init() {
  try {
    const [courses, trainings, tickets] = await Promise.all([
      api.read('courses').catch(() => []),
      api.read('trainings').catch(() => []),
      api.read('tickets').catch(() => [])
    ]);
    const setStat = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
    setStat('tqc-stat-courses', courses.length || 4);
    setStat('tqc-stat-trainings', trainings.length || 3);
    setStat('tqc-stat-tickets', tickets.length || 1);
  } catch (e) {
    console.error(e);
  }
}

async function tqc_input_init() {
  Components.renderForm('courses', 'tqc-form-container');
}

async function tqc_view_init() {
  Components.renderGrid('courses', 'tqc-grid-container');
}

async function tqc_ticket_init() {
  Components.renderGrid('tickets', 'tqc-ticket-container');
}

async function tqc_load_init() {
  // Static certified list preview
}

async function tqc_nomination_init() {
  // Nomination form ready
}

async function tqc_reports_init() {
  // Compliance reports ready
}

async function tqc_record_init() {
  try {
    app.showLoader();
    window.allTqcRecords = await api.getTqcRecords();
    
    // Populate Course Dropdown
    const courseSet = new Set();
    window.allTqcRecords.forEach(r => { if(r.course_name) courseSet.add(r.course_name); });
    const select = document.getElementById('tqc-filter-course');
    if (select) {
      select.innerHTML = '<option value="ALL">All Courses</option>';
      Array.from(courseSet).sort().forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.text = c;
        select.appendChild(opt);
      });
    }

    renderTqcRecord('course_wise');
  } catch (e) {
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}

function renderTqcRecord(viewMode) {
  const data = window.allTqcRecords || [];
  const thead = document.getElementById('tqc-sheet-header');
  const tbody = document.getElementById('tqc-sheet-body');
  const courseFilter = document.getElementById('tqc-filter-course');
  
  if (!thead || !tbody) return;
  thead.innerHTML = '';
  tbody.innerHTML = '';

  const btnWise = document.getElementById('btn-tqc-coursewise');
  const btnAll = document.getElementById('btn-tqc-allcourses');
  const btnInd = document.getElementById('btn-tqc-individual');
  
  if (btnWise) btnWise.className = viewMode === 'course_wise' ? "bg-blue-800 text-white px-2.5 py-1 hover:bg-blue-700 font-medium border border-blue-900 text-xs rounded-sm" : "bg-gray-200 text-gray-800 px-2.5 py-1 hover:bg-gray-300 font-medium border border-gray-400 text-xs rounded-sm";
  if (btnAll) btnAll.className = viewMode === 'all_courses' ? "bg-blue-800 text-white px-2.5 py-1 hover:bg-blue-700 font-medium border border-blue-900 text-xs rounded-sm" : "bg-gray-200 text-gray-800 px-2.5 py-1 hover:bg-gray-300 font-medium border border-gray-400 text-xs rounded-sm";
  if (btnInd) btnInd.className = viewMode === 'individual' ? "bg-blue-800 text-white px-2.5 py-1 hover:bg-blue-700 font-medium border border-blue-900 text-xs rounded-sm" : "bg-gray-200 text-gray-800 px-2.5 py-1 hover:bg-gray-300 font-medium border border-gray-400 text-xs rounded-sm";

  if (viewMode === 'course_wise') {
    if (courseFilter) courseFilter.classList.remove('hidden');
    let filteredData = data.filter(d => d.status !== 'Retired');
    if (courseFilter && courseFilter.value !== 'ALL') {
      filteredData = filteredData.filter(d => d.course_name === courseFilter.value);
    }
    
    const cols = [
      { key: 'sl', label: 'SL' },
      { key: 'name', label: 'Name' },
      { key: 'staff_id', label: 'Staff ID' },
      { key: 'designation', label: 'Designation' },
      { key: 'shift', label: 'Shift' },
      { key: 'placement', label: 'Placement' },
      { key: 'posting', label: 'Posting' },
      { key: 'course_name', label: 'Course Name' },
      { key: 'start_date', label: 'Start Date', type: 'date' },
      { key: 'end_date', label: 'End Date', type: 'date' },
      { key: 'expire_date', label: 'Expire Date', type: 'date' }
    ];

    thead.innerHTML = cols.map(c => `<th class="p-1 border border-gray-300 font-bold text-left">${c.label}</th>`).join('');
    
    if (filteredData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${cols.length}" class="p-4 text-center text-gray-500">No training records found.</td></tr>`;
      return;
    }

    filteredData.forEach((row, i) => {
      row.sl = i + 1;
      let trHtml = '';
      cols.forEach(c => {
        let val = row[c.key] || '-';
        if (c.type === 'date' && val !== '-') {
          val = window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(val) : val;
        }
        trHtml += `<td class="border border-gray-300 px-1 py-0 truncate max-w-200px">${val}</td>`;
      });
      tbody.innerHTML += `<tr>${trHtml}</tr>`;
    });

  } else if (viewMode === 'all_courses') {
    if (courseFilter) courseFilter.classList.add('hidden');
    thead.innerHTML = '<th class="p-1 border border-gray-300 font-bold text-left">SL</th><th class="p-1 border border-gray-300 font-bold text-left">Staff ID</th><th class="p-1 border border-gray-300 font-bold text-left">Name</th><th class="p-1 border border-gray-300 font-bold text-left">DGR Cat-6</th><th class="p-1 border border-gray-300 font-bold text-left">Airside Safety</th><th class="p-1 border border-gray-300 font-bold text-left">Load Control</th><th class="p-1 border border-gray-300 font-bold text-left">AVSEC</th>';
    tbody.innerHTML = `
      <tr><td class="p-1 border border-gray-300">01</td><td class="p-1 border border-gray-300 font-bold text-blue-900">SA-1001</td><td class="p-1 border border-gray-300 font-medium">MOHAMMAD TARIQUL ISLAM</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td></tr>
      <tr><td class="p-1 border border-gray-300">02</td><td class="p-1 border border-gray-300 font-bold text-blue-900">SA-1002</td><td class="p-1 border border-gray-300 font-medium">NUSRAT JAHAN</td><td class="p-1 border border-gray-300 text-gray-400">N/A</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td><td class="p-1 border border-gray-300 text-gray-400">N/A</td><td class="p-1 border border-gray-300 text-green-700 font-bold">Valid (2026)</td></tr>
    `;
  } else if (viewMode === 'individual') {
    if (courseFilter) courseFilter.classList.add('hidden');
