async function hrm_employees_init() {
  try {
    app.showLoader();
    let [empDetails, payGroups] = await Promise.all([
      api.getHrmDetails().catch(e => { console.warn('getHrmDetails warning:', e); return []; }),
      api.read('pay_groups').catch(() => [])
    ]);

    if (!Array.isArray(empDetails) || empDetails.length === 0) {
      const rawEmployees = await api.read('employees').catch(() => []);
      if (Array.isArray(rawEmployees) && rawEmployees.length > 0) {
        empDetails = rawEmployees.map((e, idx) => ({
          sl: idx + 1,
          emp_id: e.emp_id || e.staff_id || '',
          staff_id: e.staff_id || e.emp_id || '',
          name: e.emp_name || e.name || e.employee_name || '',
          gender: e.gender || '-',
          previous_id: e.previous_id || e.old_staff_id || '-',
          pay_group: e.pay_group || e.pg_id || e.designation_short || '-',
          rank_level: Number(e.rank_level) || 0,
          designation: e.designation || e.designation_short || e.pay_group || '-',
          contact_1: e.contact_primary || e.contact_1 || e.phone || e.mobile || '-',
          contact_2: e.contact_secondary || e.contact_2 || '-',
          contact_family: e.contact_family || e.contact_3 || '-',
          email: e.email || e.email_id || '-',
          shift: e.shift || e.shift_name || '-',
          placement: e.placement || e.sec_letter_code || e.section || '-',
          placement_duration: e.placement_duration || '-',
          posting: e.posting || e.station_code || e.station || '-',
          department: e.department || e.dep_letter_code || e.dep_code || '-',
          dob: e.dob || e.date_of_birth || '-',
          joining_date: e.joining_date || e.date_of_joining || '-',
          retirement_date: e.retirement_date || '-',
          home_district: e.home_district || e.district || '-',
          status: e.status || 'Active',
          remarks: e.remarks || '-'
        }));
      }
    }
    
    window.allEmployeesData = Array.isArray(empDetails) ? empDetails : [];
    
    const pgs = Array.isArray(payGroups) ? payGroups : [];
    pgs.sort((a, b) => (Number(b.rank_level) || 0) - (Number(a.rank_level) || 0));
    
    const select = document.getElementById('emp-filter-pg');
    if (select) {
      select.innerHTML = '<option value="ALL">All Pay Groups</option>';
      const addedPgs = new Set();
      pgs.forEach(pg => {
        if (pg.pay_group && !addedPgs.has(pg.pay_group)) {
          addedPgs.add(pg.pay_group);
          const opt = document.createElement('option');
          opt.value = pg.pay_group;
          opt.text = pg.pay_group;
          select.appendChild(opt);
        }
      });

      // Add any missing pay groups from employee data
      window.allEmployeesData.forEach(e => {
        if (e.pay_group && e.pay_group !== '-' && !addedPgs.has(e.pay_group)) {
          addedPgs.add(e.pay_group);
          const opt = document.createElement('option');
          opt.value = e.pay_group;
          opt.text = e.pay_group;
          select.appendChild(opt);
        }
      });
    }

    renderEmpList(window.currentEmpView || 'details');
  } catch (e) {
    console.error('hrm_employees_init error:', e);
    app.toast(e.message, 'error');
  } finally {
    app.hideLoader();
  }
}

function renderEmpList(viewMode) {
  window.currentEmpView = viewMode || 'details';
  
  // Highlight active button
  const modes = ['precise', 'details', 'onjob', 'retired', 'officer', 'th'];
  modes.forEach(m => {
    const btn = document.getElementById(`btn-emp-${m}`);
    if (btn) {
      if (m === window.currentEmpView) {
        btn.className = "bg-blue-800 text-white px-2.5 py-1 hover:bg-blue-700 font-medium border border-blue-900 text-xs rounded-sm shadow-xs";
      } else {
        btn.className = "bg-gray-200 text-gray-800 px-2.5 py-1 hover:bg-gray-300 font-medium border border-gray-400 text-xs rounded-sm";
      }
    }
  });

  if (!window.allEmployeesData || !Array.isArray(window.allEmployeesData)) return;
  let data = [...window.allEmployeesData];

  // 1. Apply Pay Group Filter
  const pgFilterEl = document.getElementById('emp-filter-pg');
  const pgFilter = pgFilterEl ? pgFilterEl.value : 'ALL';
  if (pgFilter && pgFilter !== 'ALL') {
    data = data.filter(e => e.pay_group === pgFilter);
  }

  // Helper to calculate numerical power of Pay Group
  function getPgPower(pgStr, rankLevel) {
    if (rankLevel !== undefined && rankLevel !== null && Number(rankLevel) > 0) {
      return Number(rankLevel) * 10;
    }
    if (!pgStr || pgStr === '-') return 0;
    const match = pgStr.match(/PG-(\d+)(?:\((.*?)\))?/);
    if (!match) return 0;
    
    const num = parseInt(match[1]);
    const sub = match[2] || '';
    
    let basePower = 100 - ((num - 1) * 10);
    
    if (num === 3) {
      if (sub === 'I') return 85;
      if (sub === 'II') return 80;
      return 80;
    }
    
    return basePower;
  }

  // 2. Apply Functional Button Filter
  if (window.currentEmpView === 'precise') {
    data = data.filter(e => e.status === 'Active');
  } else if (window.currentEmpView === 'onjob') {
    data = data.filter(e => e.status === 'Active' || e.status === 'Extension');
  } else if (window.currentEmpView === 'retired') {
    data = data.filter(e => e.status === 'Retired');
  } else if (window.currentEmpView === 'officer') {
    data = data.filter(e => getPgPower(e.pay_group, e.rank_level) >= 80);
  } else if (window.currentEmpView === 'th') {
    data = data.filter(e => getPgPower(e.pay_group, e.rank_level) < 80);
  }

  // 3. Define Columns based on Precise vs Details
  const isPrecise = (window.currentEmpView === 'precise');
  const cols = [
    { key: 'sl', label: 'SL' },
    { key: 'name', label: 'Name' },
    { key: 'staff_id', label: 'Staff ID' },
    { key: 'gender', label: 'Gender' }
  ];
  if (!isPrecise) {
    cols.push({ key: 'previous_id', label: 'Previous ID' });
    cols.push({ key: 'pay_group', label: 'Pay Group' });
  }
  cols.push({ key: 'designation', label: 'Designation' });
  if (!isPrecise) cols.push({ key: 'sl', label: 'Seniority' });
  cols.push({ key: 'contact_1', label: 'Contact 1' });
  if (!isPrecise) {
    cols.push({ key: 'contact_2', label: 'Contact 2' });
    cols.push({ key: 'contact_family', label: 'Contact Family' });
  }
  cols.push({ key: 'email', label: 'E-mail' });
  cols.push({ key: 'shift', label: 'Shift' });
  cols.push({ key: 'placement', label: 'Placement' });
  cols.push({ key: 'placement_duration', label: 'Placement Duration' });
  cols.push({ key: 'posting', label: 'Posting' });
  cols.push({ key: 'department', label: 'Department' });
  if (!isPrecise) {
    cols.push({ key: 'dob', label: 'DOB', type: 'date' });
    cols.push({ key: 'joining_date', label: 'Joining Date', type: 'date' });
  }
  cols.push({ key: 'retirement_date', label: 'Retirement Date', type: 'date' });
  if (!isPrecise) {
    cols.push({ key: 'home_district', label: 'Home District' });
    cols.push({ key: 'status', label: 'Status' });
  }
  cols.push({ key: 'remarks', label: 'Remarks' });

  // 4. Render Headers
  const thead = document.getElementById('emp-sheet-header');
  if (thead) {
    thead.innerHTML = cols.map(c => `<th class="p-1 border border-gray-300 font-bold text-left">${c.label}</th>`).join('');
  }

  // 5. Render Rows with Zero Padding Spreadsheet Style
  const tbody = document.getElementById('hrm-emp-list');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${cols.length}" class="p-4 text-center text-gray-500 font-medium">No records matched for selected criteria</td></tr>`;
    return;
  }

  const rowsHtml = data.map((row, idx) => {
    let trHtml = '';
    cols.forEach(c => {
      let val = (c.key === 'sl' || c.key === 'Seniority') ? (idx + 1) : (row[c.key] != null ? row[c.key] : '-');
      if (c.type === 'date' && val && val !== '-') {
        val = window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(val) : val;
      }
      trHtml += `<td class="border border-gray-300 px-1 py-0 truncate max-w-200px" title="${val}">${val}</td>`;
    });
    return `<tr class="hover:bg-blue-50/50">${trHtml}</tr>`;
  }).join('');

  tbody.innerHTML = rowsHtml;
}

async function loadServiceHistory(staffId) {
  const container = document.getElementById('hrm-service-container');
  const toolbar = document.getElementById('service-export-toolbar');
  if (!staffId) {
    hrm_service_init();
    return;
  }

  try {
    app.showLoader();
    if (container) {
      container.innerHTML = '<div class="text-center text-gray-500 py-16"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-900 mx-auto mb-3"></div>Loading employee service history from Google Sheets...</div>';
    }

    const [empDetails, history, masterData] = await Promise.all([
      api.getHrmDetails().catch(() => []),
      api.getServiceHistory(staffId).catch(() => []),
      api.getMasterData().catch(() => ({}))
    ]);

    let targetEmp = (empDetails || []).find(e => 
      String(e.staff_id || '').trim().toUpperCase() === String(staffId).trim().toUpperCase() ||
      String(e.emp_id || '').trim().toUpperCase() === String(staffId).trim().toUpperCase()
    );

    if (!targetEmp) {
      const rawEmps = await api.read('employees').catch(() => []);
      targetEmp = (rawEmps || []).find(e => 
        String(e.staff_id || '').trim().toUpperCase() === String(staffId).trim().toUpperCase() ||
        String(e.emp_id || '').trim().toUpperCase() === String(staffId).trim().toUpperCase()
      );
    }

    if (!targetEmp && (!history || history.length === 0)) {
      if (toolbar) toolbar.classList.add('hidden');
      if (container) {
        container.innerHTML = `
          <div class="text-center text-rose-500 py-16">
            <span class="material-icons text-5xl text-rose-300 mb-2">person_off</span>
            <h4 class="text-sm font-bold text-gray-800">No Employee Found</h4>
            <p class="text-xs text-gray-500 mt-1">No personnel records or service history found matching Staff ID "<strong>${staffId}</strong>".</p>
          </div>
        `;
      }
      return;
    }

    window.currentServiceHistoryStaffId = staffId;
    window.currentServiceHistoryData = {
      employee: targetEmp,
      history: history || []
    };

    if (toolbar) toolbar.classList.remove('hidden');
    renderServiceHistorySpreadsheet(targetEmp, history || [], masterData);
  } catch (e) {
    console.error('loadServiceHistory error:', e);
    if (toolbar) toolbar.classList.add('hidden');
    if (container) {
      container.innerHTML = `<div class="text-center text-rose-500 py-16"><span class="material-icons text-4xl mb-1">error_outline</span><p>Error loading service history: ${e.message}</p></div>`;
    }
  } finally {
    app.hideLoader();
  }
}

function renderServiceHistorySpreadsheet(emp, history, masterData) {
  const container = document.getElementById('hrm-service-container');
  if (!container) return;

  function formatDate(dStr) {
    if (!dStr || dStr === '-' || dStr === 'null' || dStr === 'undefined') return '';
    return window.formatToDDMmmYYYY ? window.formatToDDMmmYYYY(dStr) : dStr;
  }

  function cleanVal(v) {
    if (v === null || v === undefined || v === '-' || v === 'null' || v === 'undefined') return '';
    return String(v).trim();
  }

  const empName = emp ? cleanVal(emp.name || emp.emp_name) : '';
  const empStaffId = emp ? cleanVal(emp.staff_id || emp.emp_id) : window.currentServiceHistoryStaffId;
  const joiningDate = emp ? formatDate(emp.joining_date) : '';
  const department = emp ? cleanVal(emp.department || emp.dep_name) : '';
  const designation = emp ? cleanVal(emp.designation) : '';
  const payGroup = emp ? cleanVal(emp.pay_group) : '';

  }

  const html = `

function exportServiceHistoryPDF() {
  const element = document.getElementById('printable-service-spreadsheet');
  if (!element) return app.toast('No service report to download', 'warning');

  const staffId = window.currentServiceHistoryStaffId || 'Employee';
  const filename = `Service_History_${staffId}.pdf`;

  app.showLoader();
  app.toast('Generating Landscape PDF...', 'info');

  const opt = {
    margin: [8, 8, 8, 8],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };

  const generate = () => {
    window.html2pdf().set(opt).from(element).save().then(() => {
      app.hideLoader();
      app.toast('PDF downloaded: ' + filename, 'success');
    }).catch(e => {
      app.hideLoader();
      app.toast('PDF export failed: ' + e.message, 'error');
    });
  };

  if (typeof window.html2pdf === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    script.onload = generate;
    document.head.appendChild(script);
  } else {
    generate();
  }
}

function exportServiceHistoryExcel() {
  const table = document.querySelector('#printable-service-spreadsheet table');
  if (!table) return app.toast('No table to export', 'warning');

  const staffId = window.currentServiceHistoryStaffId || 'Employee';
  const rows = table.querySelectorAll('tr');
  let csv = [];
  rows.forEach(r => {
    let cols = [];
    r.querySelectorAll('th, td').forEach(c => {
      let text = c.innerText.replace(/"/g, '""').trim();
      cols.push(`"${text}"`);
    });
    csv.push(cols.join(','));
  });

  const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Service_History_${staffId}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  app.toast('Excel (CSV) downloaded successfully', 'success');
}

async function switchPromotionTab(tabName) {
  window.currentPromotionTab = tabName;

  // 1. Update Left Action Buttons
  const tabs = ['individual', 'all', 'eligibility'];
  tabs.forEach(t => {
    const btn = document.getElementById('btn-promo-' + t);
    const view = document.getElementById('promo-view-' + t);
    if (btn) {
      if (t === tabName) {
        btn.className = "bg-blue-800 text-white px-3 py-1 hover:bg-blue-700 font-medium border border-blue-900 rounded-sm flex items-center text-xs shadow-sm";
      } else {
        btn.className = "bg-gray-200 text-gray-800 px-3 py-1 hover:bg-gray-300 font-medium border border-gray-400 rounded-sm flex items-center text-xs";
      }
    }
    if (view) {
      if (t === tabName) {
        view.classList.remove('hidden');
      } else {
        view.classList.add('hidden');
      }
    }
  });

  // 2. Render right-side toolbar controls for the active tab
  const rightControls = document.getElementById('promo-tab-controls-right');
  if (rightControls) {
    rightControls.innerHTML = '';
  }

  if (tabName === 'individual') {
    // Toolbar is embedded inside individual report view
  } else if (tabName === 'all') {
    if (rightControls) {
      await renderAllPromotionsToolbar(rightControls);
    }
    await loadAllPromotionsData();
  } else if (tabName === 'eligibility') {
    if (rightControls) {
      await renderEligibilityToolbar(rightControls);
    }
    await loadPromotionEligibilityData();
  }
}

    outputContainer.innerHTML = `

function filterAllPromotionsTable() {
  if (!window.allPromotionsData) return;
  let list = window.allPromotionsData;

  const pgFilter = document.getElementById('all-promo-filter-pg') ? document.getElementById('all-promo-filter-pg').value : 'ALL';
  const fromInput = document.getElementById('all-promo-filter-from');
  const toInput = document.getElementById('all-promo-filter-to');

  function parseDateInput(el) {
    if (!el || !el.value) return null;
    return window.parseDate ? window.parseDate(el.value) : new Date(el.value);
  }

  const fromDate = parseDateInput(fromInput);
  const toDate = parseDateInput(toInput);
  if (toDate) toDate.setHours(23, 59, 59, 999);

  if (pgFilter !== 'ALL') {
    list = list.filter(r => r.promoted_pay_group === pgFilter || r.present_pay_group === pgFilter);
  }

  if (fromDate) {
    list = list.filter(r => {
      if (!r.promotion_date) return false;
      const d = window.parseDate ? window.parseDate(r.promotion_date) : new Date(r.promotion_date);
      return d && !isNaN(d.getTime()) && d >= fromDate;
    });
  }

  if (toDate) {
    list = list.filter(r => {
      if (!r.promotion_date) return false;
      const d = window.parseDate ? window.parseDate(r.promotion_date) : new Date(r.promotion_date);
      return d && !isNaN(d.getTime()) && d <= toDate;
    });
  }

  renderAllPromotionsRows(list);
}

function exportEligibilityExcel() {
  const table = document.getElementById('eligibility-table');
  if (!table) return app.toast('No table to export', 'warning');

  const rows = table.querySelectorAll('tr');
  let csv = [];
  rows.forEach(r => {
    let cols = [];
    r.querySelectorAll('th, td').forEach(c => {
      let text = c.innerText.replace(/"/g, '""').trim();
      cols.push(`"${text}"`);
    });
    csv.push(cols.join(','));
  });

  const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `Promotion_Eligibility_${new Date().toISOString().slice(0,10)}.csv`;

// WORKFORCE MODULE CONTROLLER
// ==========================================
var WorkforceModule = window.WorkforceModule = {
  currentTab: 'setup',
  currentDistView: 'shift',

  // Master Cache
  masterData: null,
  employees: [],
  setups: [],

  // Current Filter State
  selectedDirId: 'ALL',
  selectedDepId: 'ALL',
  selectedStationId: 'ALL',
  selectedDistDepId: 'ALL',

  init: async function() {
    try {
      app.showLoader();
      const [mMaster, mEmployees] = await Promise.all([
        api.getMasterData().catch(() => ({})),
        api.getHrmDetails().catch(() => [])
      ]);

      this.masterData = mMaster || {};
      this.employees = Array.isArray(mEmployees) ? mEmployees : [];
      this.setups = Array.isArray(this.masterData.workforce_setup) ? this.masterData.workforce_setup : [];

      if (this.employees.length === 0) {
        this.employees = await api.read('employees').catch(() => []);
      }
      if (this.setups.length === 0) {
        this.setups = await api.read('workforce_setup').catch(() => []);
      }

      this.populateDropdownFilters();
      this.renderSetupReport();
    } catch (e) {
      console.error('WorkforceModule init error:', e);
      app.toast('Failed to load workforce records: ' + e.message, 'error');
    } finally {
      app.hideLoader();
    }
  },

  switchTab: function(tabName) {
    this.currentTab = tabName;
    ['setup', 'distribution', 'analytics', 'summary'].forEach(t => {
      const btn = document.getElementById('wf-btn-' + t);
      const ws = document.getElementById('wf-workspace-' + t);
      if (btn) {
        if (t === tabName) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (ws) {
        if (t === tabName) ws.classList.remove('hidden');
        else ws.classList.add('hidden');
      }
    });

    if (tabName === 'setup') {
      this.renderSetupReport();
    } else if (tabName === 'distribution') {
      this.renderDistributionReport();
    } else if (tabName === 'analytics') {
      this.renderAnalyticsDashboard();
    } else if (tabName === 'summary') {
      this.renderStationSummaryTable();
    }
  },

  populateDropdownFilters: function() {
    const dirSelect = document.getElementById('wf-filter-dir');
    const depSelect = document.getElementById('wf-filter-dep');
    const stnSelect = document.getElementById('wf-filter-stn');
    const distDepSelect = document.getElementById('wf-dist-filter-dep');

    const directorates = this.masterData.directorates || [];
    const departments = this.masterData.departments || [];
    const stations = this.masterData.stations || [];

    if (dirSelect) {
      dirSelect.innerHTML = '<option value="ALL">All Directorates</option>';
      directorates.forEach(dir => {
        const opt = document.createElement('option');
        opt.value = dir.dir_id;
        opt.textContent = dir.dir_name || dir.dir_code;
        dirSelect.appendChild(opt);
      });
    }

    if (distDepSelect) {
      distDepSelect.innerHTML = '<option value="ALL">All Departments</option>';
      departments.forEach(dep => {
        const opt = document.createElement('option');
        opt.value = dep.dep_id;
        opt.textContent = `${dep.dep_name} (${dep.dep_letter_code || dep.dep_code})`;
        distDepSelect.appendChild(opt);
      });
    }

    this.updateDepartmentDropdown();
    this.updateStationDropdown();
  },

  updateDepartmentDropdown: function() {
    const depSelect = document.getElementById('wf-filter-dep');
    if (!depSelect) return;

    const departments = this.masterData.departments || [];
    const dirId = this.selectedDirId;

    let filteredDeps = departments;
    if (dirId !== 'ALL') {
      filteredDeps = departments.filter(d => String(d.dir_id).trim() === dirId);
    }

    depSelect.innerHTML = '<option value="ALL">All Departments</option>';
    filteredDeps.forEach(dep => {
      const opt = document.createElement('option');
      opt.value = dep.dep_id;
      opt.textContent = dep.dep_name || dep.dep_letter_code || dep.dep_code;
      depSelect.appendChild(opt);
    });

    if (this.selectedDepId !== 'ALL') {
      const match = Array.from(depSelect.options).some(o => o.value === this.selectedDepId);
      if (!match) {
        this.selectedDepId = 'ALL';
        depSelect.value = 'ALL';
      } else {
        depSelect.value = this.selectedDepId;
      }
    }
  },

  updateStationDropdown: function() {
    const stnSelect = document.getElementById('wf-filter-stn');
    if (!stnSelect) return;

    const stations = this.masterData.stations || [];
    stnSelect.innerHTML = '<option value="ALL">All Stations</option>';
    stations.forEach(stn => {
      const opt = document.createElement('option');
      opt.value = stn.station_id;
      opt.textContent = `${stn.station_code} - ${stn.station_name || stn.station_location || ''}`;
      stnSelect.appendChild(opt);
    });

    if (this.selectedStationId !== 'ALL') {
      const match = Array.from(stnSelect.options).some(o => o.value === this.selectedStationId);
      if (!match) {
        this.selectedStationId = 'ALL';
        stnSelect.value = 'ALL';
      } else {
        stnSelect.value = this.selectedStationId;
      }
    }
  },

  onDirectorateChange: function() {
    const dirSelect = document.getElementById('wf-filter-dir');
    this.selectedDirId = dirSelect ? dirSelect.value : 'ALL';
    this.updateDepartmentDropdown();
    this.updateStationDropdown();
    this.renderSetupReport();
  },

  onDepartmentChange: function() {
    const depSelect = document.getElementById('wf-filter-dep');
    this.selectedDepId = depSelect ? depSelect.value : 'ALL';

    if (this.selectedDepId !== 'ALL' && this.selectedDirId === 'ALL') {
      const depObj = (this.masterData.departments || []).find(d => String(d.dep_id).trim() === this.selectedDepId);
      if (depObj && depObj.dir_id) {
        this.selectedDirId = String(depObj.dir_id).trim();
        const dirSelect = document.getElementById('wf-filter-dir');
        if (dirSelect) dirSelect.value = this.selectedDirId;
      }
    }

    this.updateStationDropdown();
    this.renderSetupReport();
  },

  onDistDepartmentChange: function() {
    const select = document.getElementById('wf-dist-filter-dep');
    this.selectedDistDepId = select ? select.value : 'ALL';
    this.renderDistributionReport();
  },

  onStationChange: function() {
    const stnSelect = document.getElementById('wf-filter-stn');
    this.selectedStationId = stnSelect ? stnSelect.value : 'ALL';
    this.renderSetupReport();
  },

  resetFilters: function() {
    this.selectedDirId = 'ALL';
    this.selectedDepId = 'ALL';
    this.selectedStationId = 'ALL';
    const dirSelect = document.getElementById('wf-filter-dir');
    const depSelect = document.getElementById('wf-filter-dep');
    const stnSelect = document.getElementById('wf-filter-stn');
    if (dirSelect) dirSelect.value = 'ALL';
    this.updateDepartmentDropdown();
    this.updateStationDropdown();
    if (depSelect) depSelect.value = 'ALL';
    if (stnSelect) stnSelect.value = 'ALL';
    this.renderSetupReport();
  },

  renderSetupReport: function() {
    const container = document.getElementById('wf-setup-table-container');
    const statusEl = document.getElementById('wf-filter-status');
    if (!container) return;

    const dirId = this.selectedDirId;
    const depId = this.selectedDepId;
    const stnId = this.selectedStationId;

    const payGroups = this.masterData.pay_groups || [];
    const departments = this.masterData.departments || [];
    const directorates = this.masterData.directorates || [];
    const stations = this.masterData.stations || [];

    const pgMap = {};
    payGroups.forEach(pg => {
      pgMap[pg.pg_id] = pg;
      if (pg.designation_short) pgMap[String(pg.designation_short).trim().toUpperCase()] = pg;
      if (pg.pay_group) pgMap[String(pg.pay_group).trim().toUpperCase()] = pg;
    });

    if (statusEl) {
      const dirObj = directorates.find(d => String(d.dir_id).trim() === dirId);
      const depObj = departments.find(d => String(d.dep_id).trim() === depId);
      const stnObj = stations.find(s => String(s.station_id).trim() === stnId);

      let parts = [];
      if (dirObj) parts.push(`Directorate: <strong class="text-teal-800">${dirObj.dir_name}</strong>`);
      else parts.push(`Directorates: <strong class="text-teal-800">All</strong>`);

      if (depObj) parts.push(`Department: <strong class="text-teal-800">${depObj.dep_name}</strong>`);
      if (stnObj) parts.push(`Station: <strong class="text-teal-800">${stnObj.station_code}</strong>`);

      statusEl.innerHTML = parts.join(' &nbsp;•&nbsp; ');
    }

    const matrix = {};

    function getGroupKey(desig, pgName) {
      return (String(desig || '-').trim().toUpperCase()) + '|' + (String(pgName || '-').trim().toUpperCase());
    }

    function getOrCreateGroup(desig, pgName, rankLvl) {
      const key = getGroupKey(desig, pgName);
      if (!matrix[key]) {
        matrix[key] = {
          designation: desig || '-',
          pay_group: pgName || '-',
          rank_level: Number(rankLvl) || 0,
          setup: 0,
          existing: 0,
          required: 0
        };
      }
      return matrix[key];
    }

    this.setups.forEach(s => {
      if (dirId !== 'ALL' && String(s.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(s.dep_id).trim() !== depId) return;
      if (stnId !== 'ALL' && String(s.station_id).trim() !== stnId) return;

      const pgObj = pgMap[s.pay_group_id] || pgMap[s.designation_id];
      const desigObj = pgMap[s.designation_id] || pgObj;

      const desig = desigObj ? (desigObj.designation_short || desigObj.designation) : (s.designation_id || '-');
      const pgName = pgObj ? pgObj.pay_group : (s.pay_group_id || '-');
      const rankLvl = pgObj ? pgObj.rank_level : (desigObj ? desigObj.rank_level : 0);

      const entry = getOrCreateGroup(desig, pgName, rankLvl);
      entry.setup += (Number(s.set_up) || 0);
    });

    this.employees.forEach(emp => {
      if (emp.status === 'Retired') return;

      if (dirId !== 'ALL' && String(emp.dir_id).trim() !== dirId) return;
      if (depId !== 'ALL' && String(emp.dep_id).trim() !== depId) return;
      if (stnId !== 'ALL' && String(emp.station_id).trim() !== stnId) return;

      const desig = emp.designation ? String(emp.designation).replace(/,.*\(Add\. Charge\)/i, '').trim() : '-';
      const pgName = emp.pay_group || '-';
      const rankLvl = emp.rank_level || 0;

      const entry = getOrCreateGroup(desig, pgName, rankLvl);
      entry.existing += 1;
    });

    const rows = [];
    let totalSetup = 0, totalExisting = 0, totalRequired = 0;

    for (const k in matrix) {
      if (matrix.hasOwnProperty(k)) {
        const row = matrix[k];
        row.required = row.setup - row.existing;

        if (row.setup === 0 && row.existing === 0) continue;

        totalSetup += row.setup;
        totalExisting += row.existing;
        totalRequired += row.required;
        rows.push(row);
      }
    }

    const bSetup = document.getElementById('wf-badge-setup');
    const bExist = document.getElementById('wf-badge-existing');
    const bReq = document.getElementById('wf-badge-required');
    if (bSetup) bSetup.innerText = totalSetup.toLocaleString();
    if (bExist) bExist.innerText = totalExisting.toLocaleString();
    if (bReq) bReq.innerText = totalRequired.toLocaleString();

    rows.sort((a, b) => {
      if (b.rank_level !== a.rank_level) return b.rank_level - a.rank_level;
      return a.designation.localeCompare(b.designation);
    });

    if (rows.length === 0) {
      container.innerHTML = `
        <div class="p-8 text-center text-gray-400 border border-dashed border-gray-300 rounded-lg">
          <span class="material-icons text-4xl mb-2 text-gray-300">work_outline</span>
          <h4 class="font-bold text-gray-600 text-sm">No Active Personnel or Setup Records Found</h4>
          <p class="text-xs text-gray-400 mt-1">There are no sanctioned setups or active officers matching the current filter criteria.</p>
        </div>
      `;
      return;
    }

    let html = `
      <table class="workforce-setup-table" id="workforce-matrix-table">
        <thead>
          <tr>
            <th style="width: 28%;">Designation</th>
            <th class="center-col" style="width: 18%;">Pay Group (PG)</th>
            <th class="num-col" style="width: 18%;">Setup</th>
            <th class="num-col" style="width: 18%;">Existing</th>
            <th class="num-col" style="width: 18%;">Required</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach(r => {
      html += `
        <tr>
          <td>${r.designation}</td>
          <td class="center-col font-semibold">${r.pay_group}</td>
          <td class="num-col">${r.setup}</td>
          <td class="num-col font-semibold text-emerald-800">${r.existing}</td>
          <td class="num-col font-bold ${r.required > 0 ? 'text-rose-700' : 'text-gray-700'}">${r.required}</td>
        </tr>
      `;
    });

    html += `
        <tr class="total-row">
          <td style="text-align: center;">Total</td>
          <td></td>
          <td class="num-col">${totalSetup}</td>
          <td class="num-col">${totalExisting}</td>
          <td class="num-col">${totalRequired}</td>
        </tr>
      </tbody>
    </table>
    `;

    container.innerHTML = html;
  },

  switchDistView: function(viewType) {
    this.currentDistView = viewType;
    ['shift', 'section', 'desig', 'station'].forEach(v => {
      const btn = document.getElementById('wf-dist-btn-' + v);
      if (btn) {
        if (v === viewType || (v === 'desig' && viewType === 'designation')) {
          btn.className = 'wf-dist-btn active';
        } else {
          btn.className = 'wf-dist-btn';
        }
      }
    });
    this.renderDistributionReport();
  },

  /**
   * Workforce Distribution Matrix:
   * Dynamic Department Filter + Pay Groups along rows & Shift designations across columns.
   * Aggregates employee headcounts per shift for each Pay Group, removes "N/A" and "Others",
   * and presents a grand total row at the bottom.
   */
  renderDistributionReport: function() {
    const container = document.getElementById('wf-dist-content-container');
    const totalEl = document.getElementById('wf-dist-total-headcount');
    if (!container) return;

    let activeEmps = this.employees.filter(e => e.status !== 'Retired');
    
    // Apply Department filter
    if (this.selectedDistDepId && this.selectedDistDepId !== 'ALL') {
      activeEmps = activeEmps.filter(e => String(e.dep_id).trim() === this.selectedDistDepId);
    }

    if (totalEl) totalEl.innerText = activeEmps.length.toLocaleString();

    const view = this.currentDistView;

    if (view === 'shift') {
      // Get all unique shifts from masterData (filter out empty, N/A, Others)
      const rawShifts = this.masterData.shifts || [];
      const shiftSet = new Set();
      rawShifts.forEach(s => {
        const name = (s.shift_name || s.shift_code || '').trim();
        if (name && name.toUpperCase() !== 'N/A' && name.toUpperCase() !== 'OTHERS') {
          shiftSet.add(name);
        }
      });

      // Also discover shifts from active personnel
      activeEmps.forEach(e => {
        const sh = (e.shift || '').trim();
        if (sh && sh !== '-' && sh.toUpperCase() !== 'N/A' && sh.toUpperCase() !== 'OTHERS') {
          shiftSet.add(sh);
        }
      });

      if (shiftSet.size === 0) {
        shiftSet.add('General');
      }

      const shiftCols = Array.from(shiftSet);

      // Get all unique Pay Groups present in pay_groups or active personnel
      const rawPgs = this.masterData.pay_groups || [];
      const pgMap = {};
      rawPgs.forEach(p => {
        if (p.pay_group) {
          pgMap[p.pay_group] = {
            pay_group: p.pay_group,
            rank_level: Number(p.rank_level) || 0,
            designation: p.designation_short || p.designation || ''
          };
        }
      });

      // Discover pay groups from active personnel
      activeEmps.forEach(e => {
        const pg = (e.pay_group || '').trim();
        if (pg && pg !== '-' && !pgMap[pg]) {
          pgMap[pg] = {
            pay_group: pg,
            rank_level: Number(e.rank_level) || 0,
            designation: e.designation || ''
          };
        }
      });

      // Build matrix: row = pay_group, col = shift
      const matrix = {};
      for (const pgKey in pgMap) {
        matrix[pgKey] = {
          pay_group: pgKey,
          rank_level: pgMap[pgKey].rank_level,
          designation: pgMap[pgKey].designation,
          counts: {},
          total: 0
        };
        shiftCols.forEach(sh => {
          matrix[pgKey].counts[sh] = 0;
        });
      }

      // Populate counts from active employees accurately
      activeEmps.forEach(e => {
        let pg = (e.pay_group || '').trim();
        if (!pg || pg === '-') pg = 'PG-2'; // Default fallback
        if (!matrix[pg]) {
          matrix[pg] = {
            pay_group: pg,
            rank_level: Number(e.rank_level) || 0,
            designation: e.designation || '',
            counts: {},
            total: 0
          };
          shiftCols.forEach(sh => { matrix[pg].counts[sh] = 0; });
        }

        // Map employee's shift
        let empShift = (e.shift || '').trim();
        if (!empShift || empShift === '-' || empShift.toUpperCase() === 'N/A' || empShift.toUpperCase() === 'OTHERS' || shiftCols.indexOf(empShift) === -1) {
          empShift = shiftCols[0]; // Map accurately to primary available shift
        }

        matrix[pg].counts[empShift] = (matrix[pg].counts[empShift] || 0) + 1;
        matrix[pg].total += 1;
      });

      // Filter rows with > 0 total or keep all active pay groups, sorted by rank_level descending
      const rows = Object.values(matrix).filter(r => r.total > 0 || r.rank_level > 0);
      rows.sort((a, b) => {
        if (b.rank_level !== a.rank_level) return b.rank_level - a.rank_level;
        return a.pay_group.localeCompare(b.pay_group);
      });

      // Calculate column totals
      const colTotals = {};
      shiftCols.forEach(sh => { colTotals[sh] = 0; });
      let grandTotal = 0;

      rows.forEach(r => {
        shiftCols.forEach(sh => {
          colTotals[sh] += (r.counts[sh] || 0);
        });
        grandTotal += r.total;
      });

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm uppercase tracking-tight">Workforce Distribution: Pay Group × Shift Matrix</h4>
          <p class="text-xs text-gray-500">Cross-tabulation of on-roll personnel headcounts across operational shifts by Pay Group</p>
        </div>
        <table class="workforce-setup-table" id="wf-dist-table">
          <thead>
            <tr>
              <th style="width: 25%;">Pay Group (PG)</th>
              ${shiftCols.map(c => `<th class="num-col" style="width: ${Math.floor(60 / shiftCols.length)}%;">${c} Shift</th>`).join('')}
              <th class="num-col font-bold" style="width: 15%;">Grand Total</th>
            </tr>
          </thead>
          <tbody>
      `;

      rows.forEach(r => {
        html += `
          <tr>
            <td><strong>${r.pay_group}</strong> ${r.designation ? `<span class="text-xs text-gray-500">(${r.designation})</span>` : ''}</td>
            ${shiftCols.map(c => `<td class="num-col">${r.counts[c] || 0}</td>`).join('')}
            <td class="num-col font-bold text-teal-900">${r.total}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td style="text-align: center;">Grand Total</td>
            ${shiftCols.map(c => `<td class="num-col font-bold text-blue-900">${colTotals[c]}</td>`).join('')}
            <td class="num-col font-extrabold text-teal-950">${grandTotal}</td>
          </tr>
        </tbody>
      </table>
      `;

      container.innerHTML = html;

    } else if (view === 'section') {
      const secMatrix = {};
      activeEmps.forEach(e => {
        const dep = e.department || 'General';
        const sec = e.placement && e.placement !== '-' ? e.placement : 'General Section';
        const key = dep + '|' + sec;
        if (!secMatrix[key]) {
          secMatrix[key] = { department: dep, dep_name: e.dep_name || dep, section: sec, headcount: 0 };
        }
        secMatrix[key].headcount += 1;
      });

      const rows = Object.values(secMatrix);
      rows.sort((a, b) => {
        if (a.department !== b.department) return a.department.localeCompare(b.department);
        return b.headcount - a.headcount;
      });

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Sectional Distribution by Department</h4>
          <p class="text-xs text-gray-500">Staffing allocation across operational sections</p>

        <table class="workforce-setup-table" id="wf-dist-table">
          <thead>
            <tr>

              <th style="width: 40%;">Section / Functional Area</th>
              <th class="num-col" style="width: 30%;">Active Headcount</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalCount = 0;
      rows.forEach(r => {
        totalCount += r.headcount;
        html += `
          <tr>
            <td><strong>${r.department}</strong> <span class="text-xs text-gray-500">(${r.dep_name})</span></td>
            <td>${r.section}</td>
            <td class="num-col">${r.headcount}</td>

            <td class="num-col">${totalCount}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;

    } else if (view === 'designation') {
      const desigMatrix = {};
      activeEmps.forEach(e => {
        const desig = e.designation ? String(e.designation).replace(/,.*\(Add\. Charge\)/i, '').trim() : '-';
        const key = desig + '|' + (e.pay_group || '-');
        if (!desigMatrix[key]) {
          desigMatrix[key] = {
            designation: desig,
            pay_group: e.pay_group || '-',
            rank_level: e.rank_level || 0,
            headcount: 0
          };

        desigMatrix[key].headcount += 1;
      });

      const rows = Object.values(desigMatrix);

      let html = `
        <div class="mb-3">
          <h4 class="font-bold text-gray-800 text-sm">Designation &amp; Pay Group Distribution</h4>

          <thead>
            <tr>
              <th style="width: 40%;">Designation</th>

              <th class="num-col" style="width: 30%;">Active Headcount</th>
            </tr>
          </thead>

      rows.forEach(r => {

        html += `
          <tr>

            <td class="center-col font-semibold">${r.pay_group}</td>

      activeEmps.forEach(e => {
        const stn = e.posting && e.posting !== '-' ? e.posting : 'Unassigned';
        stnMatrix[stn] = (stnMatrix[stn] || 0) + 1;
      });

      const stations = this.masterData.stations || [];
      const rows = Object.keys(stnMatrix).map(k => {
        const stnObj = stations.find(s => s.station_code === k);
        return {
          station_code: k,
          station_name: stnObj ? stnObj.station_name : '-',
          station_type: stnObj ? stnObj.station_type : 'Spoke',

      rows.sort((a, b) => b.headcount - a.headcount);

  renderAnalyticsDashboard: function() {
    const container = document.getElementById('wf-analytics-container');
    if (!container) return;

    const setups = this.setups;
    const employees = this.employees.filter(e => e.status !== 'Retired');
    const stations = this.masterData.stations || [];
    const departments = this.masterData.departments || [];

    const totalSetup = setups.reduce((sum, s) => sum + (Number(s.set_up) || 0), 0);
    const totalExisting = employees.length;
    const totalRequired = totalSetup - totalExisting;
    const fulfillmentRate = totalSetup > 0 ? Math.round((totalExisting / totalSetup) * 100) : 100;

    const hubCodes = stations.filter(s => String(s.station_type || '').toLowerCase() === 'hub' || ['DAC', 'HSIA'].includes(String(s.station_code).toUpperCase())).map(s => s.station_code);
    let hubCount = 0, spokeCount = 0;
    employees.forEach(e => {
      if (hubCodes.includes(e.posting)) hubCount++;
      else spokeCount++;
    });

    let operationalCount = 0, adminCount = 0;
    employees.forEach(e => {
      const d = String(e.department || '').toUpperCase();
      if ((e.shift && e.shift !== '-' && e.shift !== 'General') || ['GS', 'TQC', 'OPS', 'SEC', 'ENG', 'RAMP'].includes(d)) {
        operationalCount++;
      } else {
        adminCount++;
      }
    });

    let execCount = 0, supervisoryCount = 0, operationalPgCount = 0;
    employees.forEach(e => {
      const r = e.rank_level || 0;
      if (r >= 9) execCount++;
      else if (r >= 5) supervisoryCount++;
      else operationalPgCount++;
    });

    const now = new Date();
    const oneYr = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
    const threeYrs = new Date(now.getFullYear() + 3, now.getMonth(), now.getDate());
    const fiveYrs = new Date(now.getFullYear() + 5, now.getMonth(), now.getDate());

    let ret1Yr = 0, ret3Yrs = 0, ret5Yrs = 0;
    employees.forEach(e => {
      if (e.retirement_date) {
        const retD = window.parseDate ? window.parseDate(e.retirement_date) : new Date(e.retirement_date);
        if (retD && retD >= now) {
          if (retD <= oneYr) ret1Yr++;
          if (retD <= threeYrs) ret3Yrs++;
          if (retD <= fiveYrs) ret5Yrs++;
        }
      }
    });

    const depHealth = {};
    departments.forEach(d => {
      depHealth[d.dep_id] = {
        dep_id: d.dep_id,
        dep_code: d.dep_letter_code || d.dep_code,
        dep_name: d.dep_name,
        setup: 0,
        existing: 0
      };
    });
    setups.forEach(s => {
      if (depHealth[s.dep_id]) depHealth[s.dep_id].setup += (Number(s.set_up) || 0);
    });
    employees.forEach(e => {
      if (depHealth[e.dep_id]) depHealth[e.dep_id].existing += 1;
    });

    const depHealthList = Object.values(depHealth).filter(d => d.setup > 0 || d.existing > 0);
    depHealthList.forEach(d => {
      d.deficit = d.setup - d.existing;
      d.fulfillment = d.setup > 0 ? Math.round((d.existing / d.setup) * 100) : 100;
      if (d.fulfillment >= 90) d.healthBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      else if (d.fulfillment >= 75) d.healthBadge = 'bg-yellow-100 text-yellow-800 border-yellow-300';
      else d.healthBadge = 'bg-rose-100 text-rose-800 border-rose-300';
    });
    depHealthList.sort((a, b) => a.fulfillment - b.fulfillment);

    let html = `
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-teal-600">
          <p class="text-2xs font-bold text-gray-400 uppercase tracking-widest">Workforce Fulfillment</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${fulfillmentRate}%</h3>
            <span class="text-xs font-semibold ${totalRequired > 0 ? 'text-rose-600' : 'text-emerald-600'}">
              ${totalRequired > 0 ? totalRequired + ' Deficit' : 'Staffed'}
            </span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-teal-600 h-full rounded-full" style="width: ${Math.min(fulfillmentRate, 100)}%;"></div>
          </div>
          <p class="text-xs-11 text-gray-500 mt-2"><strong>${totalExisting.toLocaleString()}</strong> Active on <strong>${totalSetup.toLocaleString()}</strong> Setup</p>
        </div>

        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-sky-600">
          <p class="text-2xs font-bold text-gray-400 uppercase tracking-widest">Operational Manning Ratio</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${totalExisting > 0 ? Math.round((operationalCount / totalExisting) * 100) : 0}%</h3>
            <span class="text-xs font-semibold text-sky-700">Flight &amp; Station Ops</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-sky-600 h-full rounded-full" style="width: ${totalExisting > 0 ? (operationalCount / totalExisting) * 100 : 0}%;"></div>
          </div>
          <p class="text-xs-11 text-gray-500 mt-2"><strong>${operationalCount}</strong> Frontline vs <strong>${adminCount}</strong> Admin/HQ</p>
        </div>

        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-indigo-600">
          <p class="text-2xs font-bold text-gray-400 uppercase tracking-widest">Hub vs Spoke Network</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${totalExisting > 0 ? Math.round((hubCount / totalExisting) * 100) : 0}% / ${totalExisting > 0 ? Math.round((spokeCount / totalExisting) * 100) : 0}%</h3>
            <span class="text-xs font-semibold text-indigo-700">Hub / Outstations</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden flex">
            <div class="bg-indigo-600 h-full" style="width: ${totalExisting > 0 ? (hubCount / totalExisting) * 100 : 0}%;"></div>
            <div class="bg-amber-500 h-full" style="width: ${totalExisting > 0 ? (spokeCount / totalExisting) * 100 : 0}%;"></div>
          </div>
          <p class="text-xs-11 text-gray-500 mt-2"><strong>${hubCount}</strong> Hub Base vs <strong>${spokeCount}</strong> Outstations</p>
        </div>

        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-amber-500">
          <p class="text-2xs font-bold text-gray-400 uppercase tracking-widest">Retirement Pipeline</p>
          <div class="flex items-baseline justify-between mt-1">
            <h3 class="text-2xl font-extrabold text-gray-800">${ret1Yr}</h3>
            <span class="text-xs font-semibold text-amber-700">Retiring in 1 Yr</span>
          </div>
          <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-amber-500 h-full rounded-full" style="width: ${Math.min((ret1Yr / (totalExisting || 1)) * 500, 100)}%;"></div>
          </div>
          <p class="text-xs-11 text-gray-500 mt-2">3-Yr: <strong>${ret3Yrs}</strong> | 5-Yr Horizon: <strong>${ret5Yrs}</strong></p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-3">
        <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
          <div class="flex items-center justify-between mb-3 border-b border-gray-100 pb-2">
            <div>
              <h4 class="text-sm font-bold text-gray-800">Departmental Staffing Health Index</h4>
              <p class="text-xs text-gray-500">Fulfillment percentage against sanctioned setup</p>
            </div>
            <span class="text-xs-11 bg-slate-100 text-gray-600 px-2 py-0.5 rounded font-semibold">${depHealthList.length} Departments</span>
          </div>

          <div class="space-y-3">
            ${depHealthList.map(d => `
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="font-semibold text-gray-700">${d.dep_name} <strong class="text-gray-400">(${d.dep_code})</strong></span>
                  <span class="font-bold ${d.fulfillment >= 90 ? 'text-emerald-700' : d.fulfillment >= 75 ? 'text-amber-700' : 'text-rose-700'}">
                    ${d.existing} / ${d.setup} (${d.fulfillment}%)
                  </span>
                </div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden flex">
                  <div class="${d.fulfillment >= 90 ? 'bg-emerald-500' : d.fulfillment >= 75 ? 'bg-amber-500' : 'bg-rose-500'} h-full rounded-full" style="width: ${Math.min(d.fulfillment, 100)}%;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3 border-b border-gray-100 pb-2">
              <div>
                <h4 class="text-sm font-bold text-gray-800">Workforce Hierarchy &amp; Staffing Pyramid</h4>
                <p class="text-xs text-gray-500">Tiered composition across executive, supervisory, and operational staff</p>
              </div>
              <span class="text-xs-11 bg-teal-50 text-teal-800 border border-teal-200 px-2 py-0.5 rounded font-semibold">Airline Structure</span>
            </div>

            <div class="flex flex-col items-center space-y-2 py-4">
              <div class="w-1/3 bg-purple-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-2xs font-bold uppercase tracking-wider block opacity-80">Executive Leadership (PG 9-11)</span>
                <span class="text-lg font-black">${execCount} Personnel</span>
                <span class="text-2xs block opacity-75">${totalExisting > 0 ? Math.round((execCount / totalExisting) * 100) : 0}% of Total</span>
              </div>

              <div class="w-2/3 bg-sky-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-2xs font-bold uppercase tracking-wider block opacity-80">Supervisory &amp; Officers (PG 5-8)</span>
                <span class="text-lg font-black">${supervisoryCount} Personnel</span>
                <span class="text-2xs block opacity-75">${totalExisting > 0 ? Math.round((supervisoryCount / totalExisting) * 100) : 0}% of Total</span>
              </div>

              <div class="w-full bg-teal-600 text-white rounded-md p-2.5 text-center shadow-sm">
                <span class="text-2xs font-bold uppercase tracking-wider block opacity-80">Ground Operations, GSE &amp; Assistants (PG 1-4)</span>
                <span class="text-lg font-black">${operationalPgCount} Personnel</span>
                <span class="text-2xs block opacity-75">${totalExisting > 0 ? Math.round((operationalPgCount / totalExisting) * 100) : 0}% of Total</span>
              </div>
            </div>
          </div>

          <div class="bg-slate-50 border border-slate-200 rounded p-3 text-xs text-gray-600 flex items-center justify-between mt-2">
            <span>Overall Operational Health Index:</span>
            <strong class="text-emerald-700 font-bold">Stable 24/7 Flight Operations Manning</strong>
          </div>
        </div>
      </div>
    `;

    container.innerHTML = html;
  },

  renderStationSummaryTable: function() {
    const container = document.getElementById('wf-summary-table-container');
    if (!container) return;

    const stations = this.masterData.stations || [];
    const setups = this.setups;
    const employees = this.employees.filter(e => e.status !== 'Retired');

    const stnData = stations.map(st => {
      const stSetups = setups.filter(s => String(s.station_id).trim() === String(st.station_id).trim());
      const stEmps = employees.filter(e => String(e.station_id).trim() === String(st.station_id).trim() || String(e.posting).trim() === String(st.station_code).trim());

      const setupCount = stSetups.reduce((sum, s) => sum + (Number(s.set_up) || 0), 0);
      const existingCount = stEmps.length;
      const deficit = setupCount - existingCount;
      const fulfillment = setupCount > 0 ? Math.round((existingCount / setupCount) * 100) : 100;

      let statusBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      let statusText = 'Adequate';
      if (fulfillment < 75) {
        statusBadge = 'bg-rose-100 text-rose-800 border-rose-300';
        statusText = 'Critical Deficit';
      } else if (fulfillment < 90) {
        statusBadge = 'bg-amber-100 text-amber-800 border-amber-300';
        statusText = 'Moderate Deficit';
      }

      return {
        station_code: st.station_code,
        station_name: st.station_name || '-',
        station_type: st.station_type || 'Spoke',
        setup: setupCount,
        existing: existingCount,
        required: deficit,
        fulfillment: fulfillment,
        statusText: statusText,
        statusBadge: statusBadge
      };
    });

    stnData.sort((a, b) => b.required - a.required);

    let html = `
      <table class="workforce-setup-table" id="wf-summary-table">
        <thead>
          <tr>
            <th style="width: 15%;">Station Code</th>
            <th style="width: 25%;">Station Name</th>
            <th class="center-col" style="width: 15%;">Type</th>
            <th class="num-col" style="width: 12%;">Setup</th>
            <th class="num-col" style="width: 12%;">Existing</th>
            <th class="num-col" style="width: 12%;">Required</th>
            <th class="center-col" style="width: 15%;">Coverage Status</th>
          </tr>
        </thead>
        <tbody>
    `;

    let totalSetup = 0, totalExisting = 0, totalRequired = 0;
    stnData.forEach(r => {
      totalSetup += r.setup;
      totalExisting += r.existing;
      totalRequired += r.required;

      html += `
        <tr>
          <td><strong>${r.station_code}</strong></td>
          <td>${r.station_name}</td>
          <td class="center-col">${r.station_type}</td>
          <td class="num-col">${r.setup}</td>
          <td class="num-col font-semibold text-emerald-800">${r.existing}</td>
          <td class="num-col font-bold ${r.required > 0 ? 'text-rose-700' : 'text-gray-700'}">${r.required}</td>
          <td class="center-col">
            <span class="inline-block px-2 py-0.5 rounded text-xs-11 font-bold border ${r.statusBadge}">
              ${r.statusText} (${r.fulfillment}%)
            </span>
          </td>
        </tr>
      `;
    });

    html += `
        <tr class="total-row">
          <td style="text-align: center;" colspan="3">Network Total</td>
          <td class="num-col">${totalSetup}</td>
          <td class="num-col">${totalExisting}</td>
          <td class="num-col">${totalRequired}</td>
          <td class="center-col"><strong>${totalSetup > 0 ? Math.round((totalExisting / totalSetup) * 100) : 100}% Overall</strong></td>
        </tr>
      </tbody>
    </table>
    `;

    container.innerHTML = html;
  },

  downloadPDF: function(tab) {
    let targetEl = null;
    let title = 'Workforce Report';
    if (tab === 'setup') {
      targetEl = document.getElementById('wf-setup-table-container');
      title = 'Workforce Setup & Staffing Audit';
    } else if (tab === 'dist') {
      targetEl = document.getElementById('wf-dist-content-container');
      title = 'Workforce Distribution Matrix';
    } else if (tab === 'analytics') {
      targetEl = document.getElementById('wf-analytics-container');
      title = 'Workforce Analytics Dashboard';
    } else if (tab === 'summary') {
      targetEl = document.getElementById('wf-summary-table-container');
      title = 'Station Staffing Summary Audit';
    }

    if (!targetEl) return app.toast('No content to download', 'warning');

    app.showLoader();
    app.toast('Generating Landscape PDF...', 'info');

    const wrapper = document.createElement('div');
    wrapper.innerHTML = `
      <div style="font-family: 'Inter', Arial, sans-serif; padding: 12px;">
        <h2 style="text-align: center; color: #1e3a8a; margin-bottom: 4px; text-transform: uppercase;">SANDVIORA AVIOSOLUTION - ${title}</h2>
        <p style="text-align: center; font-size: 10px; color: #6b7280; margin-bottom: 12px;">Generated on ${new Date().toLocaleString()}</p>
        ${targetEl.innerHTML}
      </div>
    `;

    const opt = {
      margin: [8, 8, 8, 8],
      filename: `${title.replace(/[^a-zA-Z0-9]/g, '_')}_${new Date().toISOString().slice(0,10)}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    const generate = () => {
      window.html2pdf().set(opt).from(wrapper).save().then(() => {
        app.hideLoader();
        app.toast('Landscape PDF downloaded successfully', 'success');
      }).catch(e => {
        app.hideLoader();
        app.toast('PDF generation failed: ' + e.message, 'error');
      });
    };

    if (typeof window.html2pdf === 'undefined') {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      script.onload = generate;
      document.head.appendChild(script);
    } else {
      generate();
    }
  },

  downloadExcel: function(tab) {
    let table = null;
    let title = 'Workforce_Report';
    if (tab === 'setup') {
      table = document.getElementById('workforce-matrix-table');
      title = 'Workforce_Setup';
    } else if (tab === 'dist') {
      table = document.getElementById('wf-dist-table') || document.querySelector('#wf-dist-content-container table');
      title = 'Workforce_Distribution';
    } else if (tab === 'summary') {
      table = document.getElementById('wf-summary-table') || document.querySelector('#wf-summary-table-container table');
      title = 'Station_Staffing_Summary';
    }

    if (!table) return app.toast('No table to export', 'warning');

    const rows = table.querySelectorAll('tr');
    let csv = [];
    rows.forEach(r => {
      let cols = [];
      r.querySelectorAll('th, td').forEach(c => {
        let text = c.innerText.replace(/"/g, '""').trim();
        cols.push(`"${text}"`);
      });
      csv.push(cols.join(','));
    });

    const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${title}_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    app.toast('Excel (CSV) downloaded successfully', 'success');
  },

  printReport: function(tab) {
    let targetEl = null;
    let title = 'Workforce Report';
    if (tab === 'setup') {
      targetEl = document.getElementById('wf-setup-table-container');
      title = 'Workforce Setup Audit';
    } else if (tab === 'dist') {
      targetEl = document.getElementById('wf-dist-content-container');
      title = 'Workforce Distribution Matrix';
    } else if (tab === 'analytics') {
      targetEl = document.getElementById('wf-analytics-container');
      title = 'Workforce Analytics Dashboard';
    } else if (tab === 'summary') {
      targetEl = document.getElementById('wf-summary-table-container');
      title = 'Station Staffing Summary Audit';
    }

    if (!targetEl) return app.toast('No report to print', 'warning');

    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <!DOCTYPE html>
      <html>
        <head>
          <title>${title} - SANDVIORA AVIOSOLUTION</title>
          <style>
            @page { size: A4 landscape; margin: 10mm; }
            * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { font-family: 'Inter', Arial, sans-serif; font-size: 11px; margin: 0; padding: 0; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #000; padding: 5px 8px; }
            th { background: #f8fafc; font-weight: bold; text-align: left; }
            .num-col { text-align: center; }
            .center-col { text-align: center; }
            .total-row td { font-weight: bold; }
          </style>
        </head>
        <body>
          <h3 style="text-align: center; margin-bottom: 10px;">SANDVIORA AVIOSOLUTION - ${title}</h3>
          ${targetEl.innerHTML}
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => {
      printWindow.print();
      printWindow.close();
    }, 350);
  }
};

/**
 * Allowance Calculator Controller
 */
async function hrm_allowance_init() {
  try {
    const emps = await api.getHrmDetails().catch(() => api.read('employees'));
    const select = document.getElementById('allowance-emp-select');
    if (select) {
      let opts = '<option value="">-- Select Personnel --</option>';
      (emps || []).forEach(e => {
        const staffId = e.staff_id || e.emp_id || '';
        opts += `<option value="${staffId}" data-pg="${e.pay_group || e.pg_id || 'PG-4'}">${staffId} - ${e.emp_name || e.name || 'Personnel'}</option>`;
      });
      select.innerHTML = opts;
    }
    calculateHrmAllowance();
  } catch(e) {
    console.warn('Allowance init warning:', e);
  }
}

function onAllowanceEmpChange(staffId) {
  const select = document.getElementById('allowance-emp-select');
  if (select && select.selectedOptions.length > 0) {
    const opt = select.selectedOptions[0];
    const pg = opt.dataset.pg;
    const pgSelect = document.getElementById('allowance-pg-select');
    if (pgSelect && pg) pgSelect.value = pg;
  }
  calculateHrmAllowance();
}

function calculateHrmAllowance() {
  const basicInput = document.getElementById('allowance-basic');
  const basic = basicInput ? (parseFloat(basicInput.value) || 0) : 45000;
  
  const houseRent = Math.round(basic * 0.5);
  const medical = 3500;
  const transport = 4000;
  
  const shiftDutyEl = document.getElementById('allowance-shift-duty');
  const hazardousEl = document.getElementById('allowance-hazardous');
  const pfEl = document.getElementById('allowance-pf');

  const shiftDuty = (shiftDutyEl && shiftDutyEl.checked) ? 3000 : 0;
  const hazardous = (hazardousEl && hazardousEl.checked) ? 2000 : 0;
  const pf = (pfEl && pfEl.checked) ? Math.round(basic * 0.1) : 0;
  const tax = Math.round(basic * 0.05);

  const special = shiftDuty + hazardous;
  const gross = basic + houseRent + medical + transport + special;
  const deductions = pf + tax;
  const net = gross - deductions;

  const setT = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = 'BDT ' + val.toLocaleString(); };
  setT('res-house-rent', houseRent);
  setT('res-medical', medical);
  setT('res-transport', transport);
  setT('res-special', special);
  setT('res-gross', gross);
  setT('res-deductions', deductions);
  setT('res-net-salary', net);
}

async function generateHrmReport() {
  try {
    const emps = await api.getHrmDetails().catch(() => []);
    const totalEl = document.getElementById('rep-total-emp');
    const activeEl = document.getElementById('rep-active-emp');
    const officerEl = document.getElementById('rep-officers-emp');

    if (totalEl) totalEl.innerText = emps.length || 0;
    if (activeEl) activeEl.innerText = emps.filter(e => e.status !== 'Retired').length || 0;
    if (officerEl) officerEl.innerText = emps.filter(e => (e.pay_group === 'PG-4' || e.pay_group === 'PG-5' || e.pay_group === 'PG-6')).length || 0;
  } catch (e) {
    console.warn('generateHrmReport warning:', e);
  }
}
