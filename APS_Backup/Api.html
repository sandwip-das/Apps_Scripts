<script>
/**
 * Ultra-Fast High-Speed API Wrapper for Google Apps Script
 * Direct Google Sheets Integration via google.script.run
 * 
 * High-Performance Caching Architecture:
 * 1. In-Memory RAM Cache (_memCache): 0ms instant local resolution across view switches.
 * 2. SessionStorage Persistence: Caches data across page visits with TTL validation.
 * 3. In-Flight Request De-duplication (_inflight): Merges concurrent identical calls into 1 request.
 * 4. Automatic Cache Invalidation: Mutations (Create/Update/Delete) purge relevant table and dependent caches.
 * 5. Full Direct Sync (syncAllData): Flushes client & server caches and pulls fresh records from Google Sheets.
 */
var api = window.api = {
  _memCache: {},
  _inflight: {},
  _STORAGE_PREFIX: 'sandviora_cache_',
  _CACHE_TTL_MS: 15 * 60 * 1000, // 15 minutes TTL

  // SessionStorage Helper with TTL Validation
  _getFromStorage: function(key) {
    try {
      var raw = sessionStorage.getItem(this._STORAGE_PREFIX + key);
      if (!raw) return null;
      var item = JSON.parse(raw);
      if (item && item.expiry && item.expiry > Date.now()) {
        if (Array.isArray(item.data) && item.data.length === 0) {
          sessionStorage.removeItem(this._STORAGE_PREFIX + key);
          return null;
        }
        return item.data;
      }
      sessionStorage.removeItem(this._STORAGE_PREFIX + key);
    } catch (e) {}
    return null;
  },

  _setToStorage: function(key, data, ttlMs) {
    try {
      if (!data || (Array.isArray(data) && data.length === 0)) return;
      var ttl = ttlMs || this._CACHE_TTL_MS;
      var item = { data: data, expiry: Date.now() + ttl };
      sessionStorage.setItem(this._STORAGE_PREFIX + key, JSON.stringify(item));
    } catch (e) {}
  },

  _removeFromStorage: function(key) {
    try {
      sessionStorage.removeItem(this._STORAGE_PREFIX + key);
    } catch (e) {}
  },

  // Base RPC call with in-flight Promise de-duplication and timeout protection
  call: function(serverFunction, ...args) {
    var callKey = serverFunction + (args.length ? '_' + JSON.stringify(args) : '');
    
    if (this._inflight[callKey]) {
      return this._inflight[callKey];
    }

    var self = this;
    var promise = new Promise((resolve, reject) => {
      var timer = setTimeout(function() {
        delete self._inflight[callKey];
        reject(new Error('Server request timed out for ' + serverFunction + '. Please try again.'));
      }, 30000);

    var cleanArgs = args.map(function(a) { return a === undefined ? null : a; });

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var runner = google.script.run
        .withSuccessHandler(response => {
          clearTimeout(timer);
          delete self._inflight[callKey];
          if (response && response.status === 'success') {
            resolve(response.data);
          } else {
            reject(new Error((response && response.message) || 'Server returned an error'));
          }
        })
        .withFailureHandler(error => {
          clearTimeout(timer);
          delete self._inflight[callKey];
          reject(new Error((error && error.message) || String(error)));
        });

      if (typeof runner[serverFunction] === 'function') {
        runner[serverFunction].apply(runner, cleanArgs);
      } else {
        clearTimeout(timer);
        delete self._inflight[callKey];
        reject(new Error("Server endpoint '" + serverFunction + "' is not found in Google Apps Script. Please verify Router.gs is saved."));
      }
    } else {
      clearTimeout(timer);
      delete self._inflight[callKey];
      reject(new Error('Google Apps Script environment not detected. Please run this application in Google Apps Script connected to your Google Sheet.'));
    }
  });

    this._inflight[callKey] = promise;
    return promise;
  },

  // Cached Master Reference Data (Directorates, Departments, Stations, Pay Groups, Shifts, Sections, Workforce Setup)
  getMasterData: async function(forceRefresh = false) {
    var cacheKey = 'master_data';
    if (!forceRefresh) {
      if (this._memCache[cacheKey] && typeof this._memCache[cacheKey] === 'object' && Object.keys(this._memCache[cacheKey]).length > 0) {
        return this._memCache[cacheKey];
      }
      var stored = this._getFromStorage(cacheKey);
      if (stored && typeof stored === 'object' && Object.keys(stored).length > 0) {
        this._memCache[cacheKey] = stored;
        for (var tbl in stored) {
          if (Array.isArray(stored[tbl]) && stored[tbl].length > 0) {
            this._memCache['tbl_' + tbl] = stored[tbl];
          }
        }
        return stored;
      }
    }

    var data = await this.call('api_get_master_data', forceRefresh);
    if (data && typeof data === 'object') {
      this._memCache[cacheKey] = data;
      this._setToStorage(cacheKey, data);
      for (var tbl in data) {
        if (Array.isArray(data[tbl]) && data[tbl].length > 0) {
          this._memCache['tbl_' + tbl] = data[tbl];
        }
      }
    }
    return data;
  },

  // Cached Enriched Employee Details List (with ranks, postings, shifts, status, retirement dates)
  getHrmDetails: async function(forceRefresh = false) {
    var cacheKey = 'hrm_details';
    if (!forceRefresh) {
      if (this._memCache[cacheKey] && Array.isArray(this._memCache[cacheKey]) && this._memCache[cacheKey].length > 0) {
        return this._memCache[cacheKey];
      }
      var stored = this._getFromStorage(cacheKey);
      if (stored && Array.isArray(stored) && stored.length > 0) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }

    var data = await this.call('api_get_hrm_details', forceRefresh);
    if (Array.isArray(data) && data.length > 0) {
      this._memCache[cacheKey] = data;
      this._setToStorage(cacheKey, data);
    }
    return data;
  },

  // Generic Table Read with Cache
  read: async function(table, forceRefresh = false) {
    var cacheKey = 'tbl_' + table;
    if (!forceRefresh) {
      if (this._memCache[cacheKey] && Array.isArray(this._memCache[cacheKey]) && this._memCache[cacheKey].length > 0) {
        return this._memCache[cacheKey];
      }
      var stored = this._getFromStorage(cacheKey);
      if (stored && Array.isArray(stored) && stored.length > 0) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }

    const data = await this.call('api_read', table);
    if (Array.isArray(data) && data.length > 0) {
      this._memCache[cacheKey] = data;
      this._setToStorage(cacheKey, data);
    }
    return data;
  },

  // Invalidate Cache for Specific Table and Derived Datasets
  invalidateCache: function(table) {
    if (table) {
      delete this._memCache['tbl_' + table];
      this._removeFromStorage('tbl_' + table);
    }
    delete this._memCache['master_data'];
    delete this._memCache['hrm_details'];
    delete this._memCache['promotions_detailed'];
    delete this._memCache['promotion_eligibility'];
    delete this._memCache['tqc_records'];
    this._removeFromStorage('master_data');
    this._removeFromStorage('hrm_details');
    this._removeFromStorage('promotions_detailed');
    this._removeFromStorage('promotion_eligibility');
    this._removeFromStorage('tqc_records');

    // Purge individual employee reports and history cache
    for (var k in this._memCache) {
      if (k.startsWith('promo_rep_') || k.startsWith('srv_hist_')) {
        delete this._memCache[k];
        this._removeFromStorage(k);
      }
    }
  },

  // Full manual cache purge across memory and sessionStorage
  clearAllCaches: function() {
    this._memCache = {};
    this._inflight = {};
    try {
      var keysToRemove = [];
      for (var i = 0; i < sessionStorage.length; i++) {
        var k = sessionStorage.key(i);
        if (k && k.startsWith(this._STORAGE_PREFIX)) {
          keysToRemove.push(k);
        }
      }
      keysToRemove.forEach(k => sessionStorage.removeItem(k));
    } catch (e) {}
  },

  // Force Full System Sync (Server CacheService Purge + Client Purge + Fresh Fetch)
  syncAllData: async function() {
    this.clearAllCaches();
    await this.call('api_clear_all_caches').catch(() => {});
    return Promise.all([
      this.getMasterData(true),
      this.getHrmDetails(true)
    ]);
  },

  // Mutation Operations with Instant Auto-Invalidation
  create: async function(table, data, pkPrefix, pkColName) {
    const res = await this.call('api_create', table, data, pkPrefix, pkColName);
    this.invalidateCache(table);
    return res;
  },

  update: async function(table, pkCol, id, data) {
    const res = await this.call('api_update', table, pkCol, id, data);
    this.invalidateCache(table);
    return res;
  },

  delete: async function(table, pkCol, id) {
    const res = await this.call('api_delete', table, pkCol, id);
    this.invalidateCache(table);
    return res;
  },

  // Specialized Queries directly mapped to Google Apps Script Services with High-Speed Caching
  getServiceHistory: async function(empId, forceRefresh = false) { 
    var cacheKey = 'srv_hist_' + (empId || 'default');
    if (!forceRefresh) {
      if (this._memCache[cacheKey]) return this._memCache[cacheKey];
      var stored = this._getFromStorage(cacheKey);
      if (stored) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }
    var data = await this.call('api_get_service_history', empId);
    this._memCache[cacheKey] = data;
    this._setToStorage(cacheKey, data);
    return data;
  },
  
  getTqcRecords: async function(forceRefresh = false) {
    var cacheKey = 'tqc_records';
    if (!forceRefresh) {
      if (this._memCache[cacheKey]) return this._memCache[cacheKey];
      var stored = this._getFromStorage(cacheKey);
      if (stored) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }
    var data = await this.call('api_get_tqc_records');
    this._memCache[cacheKey] = data;
    this._setToStorage(cacheKey, data);
    return data;
  },
  
  getPromotionsDetailed: async function(forceRefresh = false) {
    var cacheKey = 'promotions_detailed';
    if (!forceRefresh) {
      if (this._memCache[cacheKey]) return this._memCache[cacheKey];
      var stored = this._getFromStorage(cacheKey);
      if (stored) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }
    var data = await this.call('api_get_promotions_detailed');
    this._memCache[cacheKey] = data;
    this._setToStorage(cacheKey, data);
    return data;
  },
  
  getEmployeePromotionReport: async function(empId, forceRefresh = false) {
    var cacheKey = 'promo_rep_' + (empId || 'default');
    if (!forceRefresh) {
      if (this._memCache[cacheKey]) return this._memCache[cacheKey];
      var stored = this._getFromStorage(cacheKey);
      if (stored) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }
    var data = await this.call('api_get_employee_promotion_report', empId);
    this._memCache[cacheKey] = data;
    this._setToStorage(cacheKey, data);
    return data;
  },
  
  getPromotionEligibility: async function(forceRefresh = false) {
    var cacheKey = 'promotion_eligibility';
    if (!forceRefresh) {
      if (this._memCache[cacheKey]) return this._memCache[cacheKey];
      var stored = this._getFromStorage(cacheKey);
      if (stored) {
        this._memCache[cacheKey] = stored;
        return stored;
      }
    }
    var data = await this.call('api_get_promotion_eligibility');
    this._memCache[cacheKey] = data;
    this._setToStorage(cacheKey, data);
    return data;
  },
  
  _saveToStorage: function(key, data, ttlMs) {
    return this._setToStorage(key, data, ttlMs);
  }
};
</script>
